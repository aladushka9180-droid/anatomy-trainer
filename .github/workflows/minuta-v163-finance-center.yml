name: Minuta v163 finance center
run-name: Minuta v163 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v163
        required: true
        default: test-v163
        type: choice
        options: [test-v163, validate-production-v163, apply-production-v163, observe-production-v163]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v163 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v163 validation run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency:
  group: "${{ inputs.phase == 'test-v163' && 'minuta-test-database' || 'minuta-production-database' }}"
  cancel-in-progress: false
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact main commit and required files
        env:
          SHA: "${{ inputs.commit_sha }}"
          PHASE: "${{ inputs.phase }}"
          CONFIRMATION: "${{ inputs.confirmation }}"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v163|validate-production-v163|observe-production-v163) ;;
            apply-production-v163) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
          for file in \
            minuta-online-booking/supabase-migration-v163.sql \
            minuta-online-booking/supabase-migration-v163-rollback.sql \
            minuta-online-booking/supabase-migration-v151.sql \
            minuta-online-booking/supabase-migration-v151-rollback.sql \
            minuta-online-booking/scripts/commercial-sales-v151-state.sql \
            minuta-online-booking/tests/financial-screen-v163-integration-test.sql \
            minuta-online-booking/financial-screen-v163-static-test.mjs \
            minuta-online-booking/finance-center-ui-static-test.mjs \
            minuta-online-booking/finance-center-provider-static-test.mjs \
            minuta-online-booking/finance-center-v163-integration-static-test.mjs; do test -s "$file"; done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: |
          node minuta-online-booking/financial-screen-v163-static-test.mjs
          node minuta-online-booking/finance-center-ui-static-test.mjs
          node minuta-online-booking/finance-center-provider-static-test.mjs
          node minuta-online-booking/finance-center-v163-integration-static-test.mjs
          node --check minuta-online-booking/finance-center.js
          node --check minuta-online-booking/finance-center-provider.js
          node --check minuta-online-booking/provider.js

  test-v163:
    if: inputs.phase == 'test-v163'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
      PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=10000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify the real provider layout at target widths
        run: |
          npm install --prefix "$RUNNER_TEMP/v163-browser" --ignore-scripts --no-save playwright@1.62.1
          node "$RUNNER_TEMP/v163-browser/node_modules/playwright/cli.js" install --with-deps chromium
          MINUTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/v163-browser/node_modules/playwright/index.mjs" node minuta-online-booking/tests/finance-center-ui-browser-test.mjs
          MINUTA_PLAYWRIGHT_MODULE="$RUNNER_TEMP/v163-browser/node_modules/playwright/index.mjs" node minuta-online-booking/tests/finance-center-provider-browser-test.mjs
      - name: Apply, integrate, rollback and reapply in isolated database
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          v151_state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          case "$(jq -r .classification <<<"$v151_state")" in
            exact) ;;
            absent)
              psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
              touch "$RUNNER_TEMP/v163-test-owned-v151"
              ;;
            *) jq -c . <<<"$v151_state"; exit 1 ;;
          esac
          if test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.organization_finance_categories_v163') is not null")" = t; then
            touch "$RUNNER_TEMP/v163-test-preexisting"
            psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163-rollback.sql
          else
            touch "$RUNNER_TEMP/v163-test-owned"
          fi
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/financial-screen-v163-integration-test.sql
          if psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163.sql >"$RUNNER_TEMP/v163-repeat.log" 2>&1; then
            echo 'Repeated migration unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Eq 'already exists|duplicate' "$RUNNER_TEMP/v163-repeat.log"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163-rollback.sql
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.organization_finance_categories_v163') is null")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/financial-screen-v163-integration-test.sql
      - name: Restore isolated database schema baseline
        if: always()
        run: |
          set -euo pipefail
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          if test -f "$RUNNER_TEMP/v163-test-owned" || test -f "$RUNNER_TEMP/v163-test-preexisting"; then
            if test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.organization_finance_categories_v163') is not null")" = t; then
              psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163-rollback.sql
            fi
          fi
          if test -f "$RUNNER_TEMP/v163-test-owned-v151"; then
            psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151-rollback.sql
          fi
          if test -f "$RUNNER_TEMP/v163-test-preexisting"; then
            psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163.sql
          fi
          if test -f "$RUNNER_TEMP/v163-test-owned"; then
            test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.organization_finance_categories_v163') is null")" = t
          fi
          if test -f "$RUNNER_TEMP/v163-test-owned-v151"; then
            restored="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
            test "$(jq -r .classification <<<"$restored")" = absent
          fi
      - name: Create isolated test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" '{status:"success",phase:"test-v163",commitSha:$sha,cycle:["dependency-setup","apply","integration","repeat-refused","rollback","reapply","integration","baseline-restored"],productionWritten:false,businessRowsChanged:false,testBaselineRestored:true}' > "$RUNNER_TEMP/v163-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v163-test-${{ github.run_id }}", path: "${{ runner.temp }}/v163-test.json", if-no-files-found: error, retention-days: 90 }

  validate-production-v163:
    if: inputs.phase == 'validate-production-v163'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Read-only production state
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('categories',to_regclass('public.organization_finance_categories_v163') is not null,'events',to_regclass('public.organization_finance_category_events_v163') is not null,'expenses',to_regclass('public.financial_manual_expenses_v163') is not null,'read_rpc',to_regprocedure('public.get_minuta_finance_screen_v163(uuid,date,date,uuid,integer,timestamp with time zone,text)') is not null,'write_rpc',to_regprocedure('public.record_minuta_manual_expense_v163(uuid,uuid,text,text,bigint,uuid,date,uuid,uuid)') is not null)")"
          jq -e '([.categories,.events,.expenses,.read_rpc,.write_rpc]|all) or ([.categories,.events,.expenses,.read_rpc,.write_rpc]|any|not)' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v163",commitSha:$sha,state:$state,readOnly:true,productionWritten:false}' > "$RUNNER_TEMP/v163-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v163-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v163-validation.json", if-no-files-found: error, retention-days: 90 }

  apply-production-v163:
    if: inputs.phase == 'apply-production-v163'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify linked backup and proof runs
        env:
          SHA: "${{ inputs.commit_sha }}"
          BACKUP_RUN: "${{ inputs.backup_run_id }}"
          TEST_RUN: "${{ inputs.test_run_id }}"
          VALIDATION_RUN: "${{ inputs.validation_run_id }}"
        run: |
          set -euo pipefail
          for id in "$BACKUP_RUN" "$TEST_RUN" "$VALIDATION_RUN"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          backup="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN")"
          test_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN")"
          validation="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN")"
          test "$(jq -r .conclusion <<<"$backup")" = success
          test "$(jq -r .path <<<"$backup")" = .github/workflows/minuta-supabase-backup.yml
          backup_epoch="$(date -d "$(jq -r .updated_at <<<"$backup")" +%s)"
          test "$(( $(date +%s) - backup_epoch ))" -le 93600
          test "$(jq -r .head_sha <<<"$backup")" = "$SHA"
          for run in "$test_run" "$validation"; do
            test "$(jq -r .conclusion <<<"$run")" = success
            test "$(jq -r .head_sha <<<"$run")" = "$SHA"
            test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v163-finance-center.yml
          done
          test "$(jq -r .display_title <<<"$test_run")" = "Minuta v163 - test-v163 - $SHA"
          test "$(jq -r .display_title <<<"$validation")" = "Minuta v163 - validate-production-v163 - $SHA"
      - name: Apply exact migration once
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('categories',to_regclass('public.organization_finance_categories_v163') is not null,'events',to_regclass('public.organization_finance_category_events_v163') is not null,'expenses',to_regclass('public.financial_manual_expenses_v163') is not null,'read_rpc',to_regprocedure('public.get_minuta_finance_screen_v163(uuid,date,date,uuid,integer,timestamp with time zone,text)') is not null,'write_rpc',to_regprocedure('public.record_minuta_manual_expense_v163(uuid,uuid,text,text,bigint,uuid,date,uuid,uuid)') is not null)")"
          jq -e '([.categories,.events,.expenses,.read_rpc,.write_rpc]|all) or ([.categories,.events,.expenses,.read_rpc,.write_rpc]|any|not)' <<<"$state" >/dev/null
          if jq -e '[.categories,.events,.expenses,.read_rpc,.write_rpc]|any|not' <<<"$state" >/dev/null; then
            psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v163.sql
          fi
          final="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('categories',to_regclass('public.organization_finance_categories_v163') is not null,'events',to_regclass('public.organization_finance_category_events_v163') is not null,'expenses',to_regclass('public.financial_manual_expenses_v163') is not null,'read_rpc',to_regprocedure('public.get_minuta_finance_screen_v163(uuid,date,date,uuid,integer,timestamp with time zone,text)') is not null,'write_rpc',to_regprocedure('public.record_minuta_manual_expense_v163(uuid,uuid,text,text,bigint,uuid,date,uuid,uuid)') is not null)")"
          jq -e '[.categories,.events,.expenses,.read_rpc,.write_rpc]|all' <<<"$final" >/dev/null

  observe-production-v163:
    if: inputs.phase == 'observe-production-v163'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Observe production without writes
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('categories',to_regclass('public.organization_finance_categories_v163') is not null,'events',to_regclass('public.organization_finance_category_events_v163') is not null,'expenses',to_regclass('public.financial_manual_expenses_v163') is not null,'initialize_rpc',to_regprocedure('public.initialize_minuta_finance_screen_v163(uuid)') is not null,'create_category_rpc',to_regprocedure('public.create_minuta_finance_category_v163(uuid,uuid,text)') is not null,'update_category_rpc',to_regprocedure('public.update_minuta_finance_category_v163(uuid,uuid,text,boolean,uuid)') is not null,'write_rpc',to_regprocedure('public.record_minuta_manual_expense_v163(uuid,uuid,text,text,bigint,uuid,date,uuid,uuid)') is not null,'reverse_rpc',to_regprocedure('public.reverse_minuta_manual_expense_v163(uuid,uuid,uuid,text)') is not null,'read_rpc',to_regprocedure('public.get_minuta_finance_screen_v163(uuid,date,date,uuid,integer,timestamp with time zone,text)') is not null)")"
          jq -e '[.categories,.events,.expenses,.initialize_rpc,.create_category_rpc,.update_category_rpc,.write_rpc,.reverse_rpc,.read_rpc]|all' <<<"$state" >/dev/null
