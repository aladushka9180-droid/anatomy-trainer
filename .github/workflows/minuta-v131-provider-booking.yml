name: PrimeTime v131 provider booking integration
run-name: PrimeTime v131 provider booking integration - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: minuta-test-database
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact commit
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_SHA" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: node --check minuta-online-booking/provider.js
      - run: node --check minuta-online-booking/tests/provider-booking-v131-postgres-test.mjs
      - run: node --test minuta-online-booking/tests/provider-booking-v131-static-test.mjs minuta-online-booking/tests/provider-booking-v131-browser-test.mjs minuta-online-booking/tests/provider-booking-integrity-test.mjs
      - run: node minuta-online-booking/smoke-test.mjs

  postgres:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
      MINUTA_TEST_PG_TLS_NO_VERIFY: MIGRATION_TEST_ONLY
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact commit
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_SHA" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Install isolated PostgreSQL client module
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v131-pg"
          npm install --prefix "$RUNNER_TEMP/v131-pg" --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
          echo "MINUTA_PG_MODULE=$RUNNER_TEMP/v131-pg/node_modules/pg/lib/index.js" >> "$GITHUB_ENV"
      - run: node minuta-online-booking/tests/provider-booking-v131-postgres-test.mjs
