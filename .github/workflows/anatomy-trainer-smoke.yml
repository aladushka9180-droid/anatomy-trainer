name: Anatomy trainer smoke test

on:
  push:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.mjs"
      - "*.webmanifest"
      - "anatomy-motion-v8/**"
      - ".github/workflows/anatomy-trainer-smoke.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.mjs"
      - "*.webmanifest"
      - "anatomy-motion-v8/**"
      - ".github/workflows/anatomy-trainer-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - name: Check trainer structure and safety gates
        run: node trainer-smoke-test.mjs
