name: Minuta booking recovery regression

on:
  push:
    paths:
      - 'minuta-online-booking/group-bookings.js'
      - 'minuta-online-booking/benefit-management.js'
      - 'minuta-online-booking/tests/group-bookings-recovery-test.mjs'
      - 'minuta-online-booking/tests/benefit-expiry-boundary-test.mjs'
      - 'minuta-online-booking/benefit-management-controller-test.mjs'
      - 'minuta-online-booking/tests/group-bookings-recovery-browser-test.mjs'
      - 'minuta-online-booking/tests/pwa-resource-update-browser-test.mjs'
      - 'minuta-online-booking/sw.js'
      - 'minuta-online-booking/provider.html'
      - 'minuta-online-booking/index.html'
      - '.github/workflows/minuta-booking-recovery.yml'
  pull_request:
    paths:
      - 'minuta-online-booking/group-bookings.js'
      - 'minuta-online-booking/benefit-management.js'
      - 'minuta-online-booking/tests/group-bookings-recovery-test.mjs'
      - 'minuta-online-booking/tests/benefit-expiry-boundary-test.mjs'
      - 'minuta-online-booking/benefit-management-controller-test.mjs'
      - 'minuta-online-booking/tests/group-bookings-recovery-browser-test.mjs'
      - 'minuta-online-booking/tests/pwa-resource-update-browser-test.mjs'
      - 'minuta-online-booking/sw.js'
      - 'minuta-online-booking/provider.html'
      - 'minuta-online-booking/index.html'
      - '.github/workflows/minuta-booking-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check minuta-online-booking/group-bookings.js
      - run: node --check minuta-online-booking/benefit-management.js
      - run: node minuta-online-booking/tests/group-bookings-recovery-test.mjs
      - run: node minuta-online-booking/tests/benefit-expiry-boundary-test.mjs
      - run: node minuta-online-booking/benefit-management-controller-test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/group-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/group-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "MINUTA_PLAYWRIGHT_MODULE=$RUNNER_TEMP/group-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: node minuta-online-booking/tests/group-bookings-recovery-browser-test.mjs
      - name: Load pinned previous release for resource update verification
        run: git fetch --depth=1 origin 87721c45697036776a31b064908f87fd35b6377a
      - name: Verify real service worker update and failed-install recovery
        env:
          MINUTA_BASELINE_REF: 87721c45697036776a31b064908f87fd35b6377a
        run: node minuta-online-booking/tests/pwa-resource-update-browser-test.mjs
