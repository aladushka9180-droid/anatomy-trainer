name: Minuta booking integration test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minuta-test-database
  cancel-in-progress: false

jobs:
  notification-outbox-v125:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify v125 static contract
        run: node minuta-online-booking/notification-outbox-v125-static-test.mjs
      - name: Refuse production and verify isolated test project
        shell: bash
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          guard_count="$(psql "$db" -X -v ON_ERROR_STOP=1 -At \
            -v expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$guard_count")" = 1
      - name: Repair tenant-aware notification enqueue in test only
        shell: bash
        run: |
          set -euo pipefail
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          psql "$db" -X -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v125.sql
      - name: Race two authenticated accounts without disabling triggers
        shell: bash
        run: |
          set -euo pipefail
          export MINUTA_TEST_DATABASE_URL="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          bash minuta-online-booking/tests/real-slot-concurrency-v125-integration.sh
