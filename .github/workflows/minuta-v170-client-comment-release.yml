name: Minuta v170 client comment safe release
run-name: Minuta v170 — ${{ inputs.phase }} — ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options: [test-v170, validate-production-v170, apply-production-v170]
      commit_sha:
        description: Exact current main SHA
        required: true
        type: string
      test_run_id:
        required: false
        default: ""
        type: string
      validation_run_id:
        required: false
        default: ""
        type: string
      backup_run_id:
        required: false
        default: ""
        type: string
      restore_run_id:
        required: false
        default: ""
        type: string
      confirmation:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.phase == 'test-v170' && 'minuta-test-database' || 'minuta-production-database' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - name: Pin exact main state and scope
        env:
          SHA: ${{ inputs.commit_sha }}
          PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v170|validate-production-v170) ;;
            apply-production-v170) test "$CONFIRMATION" = BACKUP_RESTORE_ROLLBACK_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/booking-client-comment-v170-static-test.mjs

  test-v170:
    if: inputs.phase == 'test-v170'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply twice, prove privileges, rollback and reapply
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v170.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v170.sql
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('exists',to_regprocedure('public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)') is not null,'anon',has_function_privilege('anon','public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)','EXECUTE'),'authenticated',has_function_privilege('authenticated','public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)','EXECUTE'),'serviceRole',has_function_privilege('service_role','public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)','EXECUTE'))")"
          jq -e '.exists and .anon and .authenticated and (.serviceRole|not)' <<<"$state" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v170-rollback.sql
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)') is null")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v170.sql
      - name: Record isolated rollback proof
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v170.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v170-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v170",commitSha:$sha,runId:$run,isolatedDatabase:true,applyTwice:true,rollbackVerified:true,reapplied:true,migrationSha256:$migration,rollbackSha256:$rollback,productionWritten:false}' \
            > "$RUNNER_TEMP/v170-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v170-test-${{ github.run_id }}
          path: ${{ runner.temp }}/v170-test.json
          if-no-files-found: error
          retention-days: 35

  validate-production-v170:
    if: inputs.phase == 'validate-production-v170'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate exact production prerequisites read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('v2',to_regprocedure('public.book_minuta_appointment_v2(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer)') is not null,'bookings',to_regclass('public.bookings') is not null,'providerNote',exists(select 1 from information_schema.columns where table_schema='public' and table_name='bookings' and column_name='provider_note'),'v170AlreadyPresent',to_regprocedure('public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)') is not null)")"
          jq -e '.v2 and .bookings and .providerNote' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v170",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v170-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v170-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/v170-validation.json
          if-no-files-found: error
          retention-days: 35

  apply-production-v170:
    if: inputs.phase == 'apply-production-v170'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify rollback proof, read-only validation, fresh backup and offline restore
        env:
          SHA: ${{ inputs.commit_sha }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v170-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v170-client-comment-release.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v170-test-$TEST" -D "$RUNNER_TEMP/v170-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and .rollbackVerified and .reapplied and (.productionWritten|not)' "$RUNNER_TEMP/v170-evidence/test/v170-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v170-client-comment-release.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v170-validation-$VALIDATION" -D "$RUNNER_TEMP/v170-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and .state.v2 and .state.bookings and .state.providerNote and (.productionWritten|not)' "$RUNNER_TEMP/v170-evidence/validation/v170-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"; [[ "$artifact" == minuta-* ]]
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v170-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v170-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply atomically with automatic rollback on failed postflight
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c 'select count(*) from public.bookings')"
          applied=0
          rollback_on_error(){ if test "$applied" = 1; then psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v170-rollback.sql || true; fi; }
          trap rollback_on_error ERR
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v170.sql
          applied=1
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('exists',to_regprocedure('public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)') is not null,'anon',has_function_privilege('anon','public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)','EXECUTE'),'authenticated',has_function_privilege('authenticated','public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)','EXECUTE'),'serviceRole',has_function_privilege('service_role','public.book_minuta_appointment_v3(uuid,text,uuid,uuid,date,time without time zone,text,text,integer,integer,text)','EXECUTE'))")"
          jq -e '.exists and .anon and .authenticated and (.serviceRole|not)' <<<"$state" >/dev/null
          after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c 'select count(*) from public.bookings')"
          test "$before" = "$after"
          trap - ERR
          jq -n --arg sha "${{ inputs.commit_sha }}" --argjson state "$state" --arg count "$after" '{status:"success",phase:"apply-production-v170",commitSha:$sha,state:$state,bookingCount:$count,productionWritten:true,businessRowsChanged:false,automaticRollbackArmed:true}' > "$RUNNER_TEMP/v170-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v170-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/v170-apply.json
          if-no-files-found: error
          retention-days: 90
