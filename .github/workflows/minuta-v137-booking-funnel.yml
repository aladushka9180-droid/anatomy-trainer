name: Minuta v137 booking funnel safe release
run-name: Minuta v137 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v137
        required: true
        default: test-v137
        type: choice
        options: [test-v137, validate-production-v137, apply-production-v137, observe-production-v137]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v137 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v137 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v137 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter APPLY_V137_TO_PRODUCTION for apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: "${{ inputs.phase == 'test-v137' && 'minuta-test-database' || 'minuta-production-database' }}", cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env:
          SHA: ${{ inputs.commit_sha }}
          PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v137|validate-production-v137|observe-production-v137) ;;
            apply-production-v137) test "$CONFIRMATION" = APPLY_V137_TO_PRODUCTION ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/booking-funnel-v137-static-test.mjs

  test-v137:
    if: inputs.phase == 'test-v137'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply, test, rollback and reapply v137 in the isolated database
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          if test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)') is null")" = t; then
            psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v107.sql
          fi
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v137.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/booking-funnel-v137-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v137-rollback.sql
          legacy="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select position('service.organization_id' in lower(pg_get_functiondef('public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)'::regprocedure)))>0")"
          test "$(tr -d '[:space:]' <<<"$legacy")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v137.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/booking-funnel-v137-integration.sql
      - name: Create test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v137.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v137-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v137",commitSha:$sha,runId:$run,isolatedDatabase:true,
              cycle:["apply","integration","rollback","reapply","integration"],migrationSha256:$migration,
              rollbackSha256:$rollback,productionWritten:false}' > "$RUNNER_TEMP/v137-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v137-test-${{ github.run_id }}", path: "${{ runner.temp }}/v137-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v137:
    if: inputs.phase == 'validate-production-v137'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate v137 production state read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          with definition as(
            select lower(pg_get_functiondef('public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)'::regprocedure)) body)
          select json_build_object(
            'mode',case when position('service.organization_id' in body)>0 then 'legacy'
              when position('join public.organization_memberships membership' in body)>0 then 'full' else 'partial' end,
            'anonExecute',has_function_privilege('anon','public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)','EXECUTE'),
            'anonTableWrite',has_table_privilege('anon','public.booking_funnel_events','INSERT,UPDATE,DELETE')) from definition;
          rollback;
          SQL
          )"
          jq -e '(.mode=="legacy" or .mode=="full") and .anonExecute and (.anonTableWrite|not)' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v137",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v137-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v137-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v137-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v137:
    if: inputs.phase == 'apply-production-v137'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify exact test, validation, encrypted backup and linked restore
        env:
          SHA: ${{ inputs.commit_sha }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"
            test "$(jq -r .conclusion <<<"$run")" = success
            test "$(jq -r .head_sha <<<"$run")" = "$SHA"
            test "$(jq -r .head_branch <<<"$run")" = main
            test "$(jq -r .event <<<"$run")" = workflow_dispatch
            test "$(jq -r .path <<<"$run")" = "$2"
          }
          mkdir -p "$RUNNER_TEMP/v137-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v137-booking-funnel.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v137 - test-v137 - $SHA"
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v137-test-$TEST" -D "$RUNNER_TEMP/v137-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and (.productionWritten|not)' "$RUNNER_TEMP/v137-evidence/test/v137-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v137-booking-funnel.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v137 - validate-production-v137 - $SHA"
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v137-validation-$VALIDATION" -D "$RUNNER_TEMP/v137-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and (.state.mode=="legacy" or .state.mode=="full")' "$RUNNER_TEMP/v137-evidence/validation/v137-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s) - $(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"
          [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v137-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v137-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v137-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v137-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v137-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v137 and verify a rolled-back source event
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v137.sql
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          with target as(select public_slug from public.organizations where status='active' and public_booking_enabled order by id limit 1),
          called as(select public.track_public_booking_funnel_event(public_slug,gen_random_uuid(),'page_opened',null,null,'campaign','primetime_external_test','embed','booking_widget','general',null,'htmlpreview.github.io') ok from target)
          select json_build_object('functionReady',position('service.organization_id' in lower(pg_get_functiondef('public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)'::regprocedure)))=0,
            'membershipScopeReady',position('join public.organization_memberships membership' in lower(pg_get_functiondef('public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)'::regprocedure)))>0,
            'rolledBackProbe',coalesce((select ok from called),false));
          rollback;
          SQL
          )"
          state="$(grep '^{' <<<"$state" | tail -n 1)"
          jq -e '.functionReady and .membershipScopeReady and .rolledBackProbe' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"apply-production-v137",commitSha:$sha,state:$state,productionWritten:true,businessRowsChanged:false}' > "$RUNNER_TEMP/v137-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v137-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v137-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v137:
    if: inputs.phase == 'observe-production-v137'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply evidence and observe v137 read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v137-booking-funnel.yml
          mkdir -p "$RUNNER_TEMP/v137-apply-evidence"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v137-apply-$APPLY" -D "$RUNNER_TEMP/v137-apply-evidence"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .productionWritten and (.businessRowsChanged|not)' "$RUNNER_TEMP/v137-apply-evidence/v137-apply.json" >/dev/null
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('functionReady',position('service.organization_id' in lower(pg_get_functiondef('public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)'::regprocedure)))=0,'membershipScopeReady',position('join public.organization_memberships membership' in lower(pg_get_functiondef('public.track_public_booking_funnel_event(text,uuid,text,uuid,uuid,text,text,text,text,text,text,text)'::regprocedure)))>0)")"
          jq -e '.functionReady and .membershipScopeReady' <<<"$state" >/dev/null
          MINUTA_EXPECT_IDEMPOTENCY=1 node minuta-online-booking/production-health-check.mjs
          jq -n --arg sha "$SHA" --arg apply "$APPLY" --argjson state "$state" '{status:"success",phase:"observe-production-v137",commitSha:$sha,applyRunId:$apply,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v137-observe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v137-observe-${{ github.run_id }}", path: "${{ runner.temp }}/v137-observe.json", if-no-files-found: error, retention-days: 90 }
