name: Eldion A04 shift substitution isolated PostgreSQL
on:
  push:
    branches: [codex/pro-a04-shifts-contract-20260930]
    paths:
      - '.github/workflows/eldion-shift-substitution-v190-isolated.yml'
      - 'minuta-online-booking/supabase-migration-v190.sql'
      - 'minuta-online-booking/recovery/rollback-shift-substitution-v190.sql'
      - 'minuta-online-booking/tests/shift-substitution-v190-*.sql'
      - 'minuta-online-booking/tests/shift-substitution-v190-*.mjs'
permissions:
  contents: read
concurrency:
  group: minuta-test-database
  cancel-in-progress: false
jobs:
  full-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: minuta-test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: a04-shifts-fixture
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Install test-only PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/a04-deps" --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Copy only the guarded test schema to an empty temporary server
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/codex/pro-a04-shifts-contract-20260930
          node minuta-online-booking/scripts/migration-config-guard.mjs
          export MINUTA_TEST_DATABASE_URL="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(docker exec -i -e TEST_DSN="$MINUTA_TEST_DATABASE_URL" -e TEST_REF="$MINUTA_TEST_PROJECT_REF" "$PG_CONTAINER" sh -c 'psql "$TEST_DSN" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$TEST_REF"' 2>"$RUNNER_TEMP/a04-private.log" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$marker" = 1
          docker exec -e TEST_DSN="$MINUTA_TEST_DATABASE_URL" "$PG_CONTAINER" sh -c 'pg_dump "$TEST_DSN" --schema-only --schema=public --no-owner --file=/tmp/source-schema.sql' 2>"$RUNNER_TEMP/a04-private.log"
          docker cp "$PG_CONTAINER:/tmp/source-schema.sql" "$RUNNER_TEMP/a04-private-schema.sql"
          node minuta-online-booking/tests/booking-delete-dialog-import.mjs prepare "$RUNNER_TEMP/a04-private-schema.sql" "$RUNNER_TEMP/a04-private-filtered.sql"
          docker cp minuta-online-booking/scripts/crm-snapshot-offline-bootstrap.sql "$PG_CONTAINER:/tmp/bootstrap.sql"
          docker cp minuta-online-booking/tests/shift-substitution-v190-bootstrap.sql "$PG_CONTAINER:/tmp/fixture-bootstrap.sql"
          docker cp "$RUNNER_TEMP/a04-private-filtered.sql" "$PG_CONTAINER:/tmp/schema.sql"
          for stage in bootstrap fixture-bootstrap schema-import; do
            file="$stage"
            if test "$stage" = schema-import; then file=schema; fi
            if ! docker exec "$PG_CONTAINER" psql -U postgres -d a04-shifts-fixture -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -f "/tmp/$file.sql" >"$RUNNER_TEMP/a04-private.log" 2>&1; then
              node minuta-online-booking/tests/booking-delete-dialog-import.mjs diagnose "$stage" "$RUNNER_TEMP/a04-private.log"
              exit 1
            fi
          done
      - name: Apply, rollback, reapply and test synthetic substitutions
        env:
          MINUTA_TEST_DATABASE_URL: postgresql://postgres:ephemeral-fixture-only@127.0.0.1:55432/a04-shifts-fixture
          MINUTA_TEST_PROJECT_REF: a04-shifts-fixture
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: MIGRATE_ONLY_ISOLATED_TEST_DATABASE
          MINUTA_A04_EPHEMERAL_CONFIRM: SCHEMA_ONLY_EMPTY_DATABASE
        run: |
          set -euo pipefail
          export MINUTA_PG_MODULE="$RUNNER_TEMP/a04-deps/node_modules/pg/lib/index.js"
          node minuta-online-booking/tests/shift-substitution-v190-full-schema-test.mjs
      - name: Remove private schema and logs
        if: always()
        run: rm -f -- "$RUNNER_TEMP/a04-private-schema.sql" "$RUNNER_TEMP/a04-private-filtered.sql" "$RUNNER_TEMP/a04-private.log"
