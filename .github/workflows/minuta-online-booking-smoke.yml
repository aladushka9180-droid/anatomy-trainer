name: Minuta booking smoke test

on:
  push:
    paths:
      - "minuta-online-booking/**"
      - ".github/workflows/minuta-*.yml"
  pull_request:
    paths:
      - "minuta-online-booking/**"
      - ".github/workflows/minuta-*.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check minuta-online-booking/app.js && node --check minuta-online-booking/booking.js && node --check minuta-online-booking/provider.js && node --check minuta-online-booking/organization.js && node --check minuta-online-booking/my-bookings.js && node --check minuta-online-booking/waitlist.js && node --check minuta-online-booking/reliability.js && node --check minuta-online-booking/sw.js && node --check minuta-online-booking/production-health-check.mjs && node --check minuta-online-booking/notify-health-failure.mjs && node --check minuta-online-booking/idempotency-integration-test.mjs && node --check minuta-online-booking/provider-delete-v64-static-test.mjs && node --check minuta-online-booking/multi-tenant-v65-static-test.mjs && node --check minuta-online-booking/multi-tenant-v66-static-test.mjs && node --check minuta-online-booking/multi-tenant-v67-static-test.mjs && node --check minuta-online-booking/scripts/migration-safety-guard.mjs && bash -n minuta-online-booking/multi-tenant-v66-concurrency-test.sh
      - run: node minuta-online-booking/provider-delete-v64-static-test.mjs && node minuta-online-booking/multi-tenant-v65-static-test.mjs && node minuta-online-booking/multi-tenant-v66-static-test.mjs && node minuta-online-booking/multi-tenant-v67-static-test.mjs && node minuta-online-booking/organization-controller-test.mjs && node minuta-online-booking/scripts/migration-safety-guard.mjs && node minuta-online-booking/smoke-test.mjs
