name: Minuta booking smoke test

on:
  push:
    paths:
      - "minuta-online-booking/**"
      - ".github/workflows/minuta-*.yml"
  pull_request:
    paths:
      - "minuta-online-booking/**"
      - ".github/workflows/minuta-*.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
