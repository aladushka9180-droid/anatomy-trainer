name: Organization genuine Supabase test acceptance
on:
  push:
    branches: [codex/pro-organization-overview]
    paths:
      - .github/workflows/minuta-organization-supabase-acceptance.yml
      - minuta-online-booking/tests/organization-supabase-acceptance.mjs
permissions:
  contents: read
concurrency:
  group: minuta-test-database
  cancel-in-progress: false
jobs:
  isolated-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 05204730f217023883d61b31c914d3517d5b2b39
          path: acceptance-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install pinned acceptance dependencies
        run: npm install --prefix "$RUNNER_TEMP/org-acceptance-deps" --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3 playwright@1.58.2
      - name: Genuine test Supabase preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_ACCEPTANCE_DEPS: ${{ runner.temp }}/org-acceptance-deps/node_modules
          MINUTA_ACCEPTANCE_SOURCE: acceptance-source/minuta-online-booking
          MINUTA_ACCEPTANCE_OUT: organization-supabase-evidence
        run: node minuta-online-booking/tests/organization-supabase-acceptance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: organization-genuine-supabase-evidence
          path: organization-supabase-evidence
          retention-days: 7
