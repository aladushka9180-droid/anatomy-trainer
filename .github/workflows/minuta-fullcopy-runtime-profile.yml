name: Minuta isolated full-copy runtime profile

on:
  pull_request:
    paths:
      - .github/workflows/minuta-fullcopy-runtime-profile.yml
      - operations/fullcopy/runtime-profile-probe.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullcopy-runtime-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  runtime-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Qualify the image and baseline prestart isolation using synthetic data only
        run: node operations/fullcopy/runtime-profile-probe.mjs --run --prestart-isolation
      - name: Retain the bounded synthetic result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fullcopy-runtime-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eldion-fullcopy-runtime-profile.json
          retention-days: 14
          if-no-files-found: error
