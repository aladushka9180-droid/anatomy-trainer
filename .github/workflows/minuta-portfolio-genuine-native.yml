name: Portfolio genuine Auth and transport test
on:
  push:
    branches: [codex/pro-public-review-binding-20261002]
    paths:
      - '.github/workflows/minuta-portfolio-genuine-native.yml'
      - 'minuta-online-booking/tests/portfolio-genuine-native.mjs'
permissions:
  contents: read
concurrency:
  group: minuta-test-database
  cancel-in-progress: false
jobs:
  native-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: minuta-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fb986d408b9afed2299e471ffd96298866c21e9f
          path: acceptance-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned native test dependencies
        run: npm install --prefix "$RUNNER_TEMP/portfolio-native" --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3 playwright@1.58.2
      - name: Install test Chromium
        run: node "$RUNNER_TEMP/portfolio-native/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Genuine native Portfolio test on pinned isolated Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_ACCEPTANCE_DEPS: ${{ runner.temp }}/portfolio-native/node_modules
          MINUTA_ACCEPTANCE_SOURCE: acceptance-source/minuta-online-booking
          MINUTA_ACCEPTANCE_OUT: portfolio-native-evidence
        run: node minuta-online-booking/tests/portfolio-genuine-native.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portfolio-genuine-native-evidence
          path: portfolio-native-evidence
          retention-days: 7
