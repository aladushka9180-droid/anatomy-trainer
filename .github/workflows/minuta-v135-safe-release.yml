name: Minuta v135 safe release
run-name: Minuta v135 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v135
        required: true
        default: test-v135
        type: choice
        options: [test-v135, validate-production-v135, apply-production-v135, observe-production-v135]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked successful offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Fresh successful isolated v135 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v135 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v135 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter APPLY_V135_TO_PRODUCTION for apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: "${{ inputs.phase == 'test-v135' && 'minuta-test-database' || 'minuta-production-database' }}", cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env:
          SHA: ${{ inputs.commit_sha }}
          PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v135|validate-production-v135|observe-production-v135) ;;
            apply-production-v135) test "$CONFIRMATION" = APPLY_V135_TO_PRODUCTION ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/scripts/v135-release-static-check.mjs

  test-v135:
    if: inputs.phase == 'test-v135'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply, test, rollback and reapply v135 in the isolated database
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          bundle="$RUNNER_TEMP/v135-test-cycle.sql"
          printf 'begin;\n' > "$bundle"
          cat minuta-online-booking/tests/client-profile-v134-test-stack.sql >> "$bundle"
          printf '\nalter table public.organization_imported_clients add column if not exists birthday date;\n' >> "$bundle"
          sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v134.sql >> "$bundle"
          sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v135.sql >> "$bundle"
          cat minuta-online-booking/tests/client-profile-v135-integration.sql >> "$bundle"
          sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v135-rollback.sql >> "$bundle"
          printf '\nselect pg_temp.check_client_profile_v135_rollback();\n' >> "$bundle"
          sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v135.sql >> "$bundle"
          cat >> "$bundle" <<'SQL'
          select pg_temp.check_client_profile_v135_reapply();
          select case when
            to_regprocedure('public.save_minuta_client_identity_v134(uuid,text,text,text)') is not null
            and
            to_regprocedure('public.get_minuta_client_profile_v135(uuid,text)') is not null
            and to_regprocedure('public.set_minuta_client_online_booking_block_v135(uuid,text,boolean,text)') is not null
            and exists(select 1 from information_schema.columns where table_schema='public' and table_name='organization_client_profiles' and column_name='online_booking_block_reason')
          then 'v135_test_cycle_ok' else 'v135_test_cycle_failed' end;
          rollback;
          SQL
          result="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f "$bundle" | tail -n 1)"
          test "$(tr -d '[:space:]' <<<"$result")" = v135_test_cycle_ok
      - name: Create test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v135.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v135-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v135",commitSha:$sha,runId:$run,isolatedDatabase:true,
              cycle:["apply","integration","rollback","reapply"],migrationSha256:$migration,
              rollbackSha256:$rollback,productionWritten:false}' > "$RUNNER_TEMP/v135-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v135-test-${{ github.run_id }}", path: "${{ runner.temp }}/v135-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v135:
    if: inputs.phase == 'validate-production-v135'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate v135 production state read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          with s as(select
            exists(select 1 from information_schema.columns where table_schema='public' and table_name='organization_client_profiles' and column_name='online_booking_block_reason') column_ready,
            to_regprocedure('public.get_minuta_client_profile_v135(uuid,text)') is not null read_ready,
            to_regprocedure('public.set_minuta_client_online_booking_block_v135(uuid,text,boolean,text)') is not null write_ready,
            exists(select 1 from pg_constraint where conname='organization_client_profiles_block_reason_v135_check' and conrelid='public.organization_client_profiles'::regclass) constraint_ready)
          select json_build_object('v119Ready',to_regprocedure('public.get_minuta_client_profile_v119(uuid,text)') is not null,
            'v134Ready',to_regprocedure('public.save_minuta_client_identity_v134(uuid,text,text,text)') is not null,
            'mode',case when not column_ready and not read_ready and not write_ready and not constraint_ready then 'absent'
              when column_ready and read_ready and write_ready and constraint_ready then 'full' else 'partial' end) from s;
          rollback;
          SQL
          )"
          jq -e '.v119Ready and .v134Ready and (.mode=="absent" or .mode=="full")' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v135",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v135-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v135-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v135-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v135:
    if: inputs.phase == 'apply-production-v135'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify exact test, validation, encrypted backup and linked restore
        env:
          SHA: ${{ inputs.commit_sha }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"
            test "$(jq -r .conclusion <<<"$run")" = success
            test "$(jq -r .head_sha <<<"$run")" = "$SHA"
            test "$(jq -r .head_branch <<<"$run")" = main
            test "$(jq -r .event <<<"$run")" = workflow_dispatch
            test "$(jq -r .path <<<"$run")" = "$2"
          }
          mkdir -p "$RUNNER_TEMP/v135-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v135-safe-release.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v135 - test-v135 - $SHA"
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v135-test-$TEST" -D "$RUNNER_TEMP/v135-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and (.productionWritten|not)' "$RUNNER_TEMP/v135-evidence/test/v135-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v135-safe-release.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v135 - validate-production-v135 - $SHA"
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v135-validation-$VALIDATION" -D "$RUNNER_TEMP/v135-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and (.state.mode=="absent" or .state.mode=="full")' "$RUNNER_TEMP/v135-evidence/validation/v135-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s) - $(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"
          [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v135-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v135-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v135-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v135-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v135-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v135 idempotently and verify postconditions
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=10000' psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v135.sql
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'columnReady',exists(select 1 from information_schema.columns where table_schema='public' and table_name='organization_client_profiles' and column_name='online_booking_block_reason'),
            'readReady',to_regprocedure('public.get_minuta_client_profile_v135(uuid,text)') is not null,
            'writeReady',to_regprocedure('public.set_minuta_client_online_booking_block_v135(uuid,text,boolean,text)') is not null,
            'constraintReady',exists(select 1 from pg_constraint where conname='organization_client_profiles_block_reason_v135_check' and conrelid='public.organization_client_profiles'::regclass));
          SQL
          )"
          jq -e '.columnReady and .readReady and .writeReady and .constraintReady' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"apply-production-v135",commitSha:$sha,state:$state,productionWritten:true,clientRowsChanged:false}' > "$RUNNER_TEMP/v135-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v135-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v135-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v135:
    if: inputs.phase == 'observe-production-v135'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply and observe v135 read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v135-safe-release.yml
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'columnReady',exists(select 1 from information_schema.columns where table_schema='public' and table_name='organization_client_profiles' and column_name='online_booking_block_reason'),
            'readReady',to_regprocedure('public.get_minuta_client_profile_v135(uuid,text)') is not null,
            'writeReady',to_regprocedure('public.set_minuta_client_online_booking_block_v135(uuid,text,boolean,text)') is not null,
            'constraintReady',exists(select 1 from pg_constraint where conname='organization_client_profiles_block_reason_v135_check' and conrelid='public.organization_client_profiles'::regclass));
          SQL
          )"
          jq -e '.columnReady and .readReady and .writeReady and .constraintReady' <<<"$state" >/dev/null
          node minuta-online-booking/production-health-check.mjs
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"observe-production-v135",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v135-observe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v135-observe-${{ github.run_id }}", path: "${{ runner.temp }}/v135-observe.json", if-no-files-found: error, retention-days: 90 }
