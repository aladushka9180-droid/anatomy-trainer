name: Minuta v124 safe release
run-name: Minuta v124 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Safe release phase for v124
        required: true
        default: test-v124
        type: choice
        options: [test-v124, validate-production-v124, apply-production-v124, observe-production-v124]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful test-v124 run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter APPLY_V124_TO_PRODUCTION for apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency:
  group: ${{ inputs.phase == 'test-v124' && 'minuta-test-database' || 'minuta-production-database' }}
  cancel-in-progress: false
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact main commit and phase
        env: { SHA: "${{ inputs.commit_sha }}", PHASE: "${{ inputs.phase }}", CONFIRM: "${{ inputs.confirmation }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$SHA" = "$GITHUB_SHA" && test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v124|validate-production-v124|observe-production-v124) ;;
            apply-production-v124) test "$CONFIRM" = APPLY_V124_TO_PRODUCTION ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: node minuta-online-booking/visit-outcome-defaults-v124-static-test.mjs

  test-v124:
    if: inputs.phase == 'test-v124'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Guard isolated test database
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
      - name: Apply, integrate, rollback and reapply
        env: { PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=10000" }
        run: |
          set -euo pipefail
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v124.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/visit-outcome-defaults-v124-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v124-rollback.sql
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select position('auto_complete_payment_method' in pg_get_functiondef('public.process_minuta_auto_completed_visits_v106(integer)'::regprocedure))=0")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v124.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/visit-outcome-defaults-v124-integration.sql
      - name: Attest test cycle
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" '{status:"success",phase:"test-v124",commitSha:$sha,runId:$run,cycle:["apply","integration","rollback","reapply"],productionWritten:false}' > "$RUNNER_TEMP/v124-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v124-test-${{ github.run_id }}", path: "${{ runner.temp }}/v124-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v124:
    if: inputs.phase == 'validate-production-v124'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000"
    steps:
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Read-only production baseline and clean-state validation
        run: |
          set -euo pipefail
          [[ "$MINUTA_PRODUCTION_PROJECT_REF" =~ ^[a-z0-9-]{6,64}$ ]]
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="${SUPABASE_DB_URL/:6543/:5432}"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('base',to_regprocedure('public.process_minuta_auto_completed_visits_v106(integer)') is not null and to_regclass('public.booking_policies') is not null,'clean',not exists(select 1 from information_schema.columns where table_schema='public' and table_name='booking_policies' and column_name='auto_complete_payment_method'))")"
          jq -e '.base and .clean' <<<"$state" >/dev/null
          printf '%s\n' "$state" > "$RUNNER_TEMP/v124-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v124-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v124-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v124:
    if: inputs.phase == 'apply-production-v124'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - name: Verify pinned test, validation, encrypted backup and current main
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ inputs.commit_sha }}", BACKUP: "${{ inputs.backup_run_id }}", TEST: "${{ inputs.test_run_id }}", VALIDATION: "${{ inputs.validation_run_id }}" }
        run: |
          set -euo pipefail
          for id in "$BACKUP" "$TEST" "$VALIDATION"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check() { run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          check "$TEST" .github/workflows/minuta-v124-safe-release.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v124 - test-v124 - $SHA"
          check "$VALIDATION" .github/workflows/minuta-v124-safe-release.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v124 - validate-production-v124 - $SHA"
          check "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s) - $(date -d "$(jq -r .created_at <<<"$run")" +%s) ))
          test "$age" -ge 0 && test "$age" -le 7200
          mkdir -p "$RUNNER_TEMP/v124-evidence/backup" "$RUNNER_TEMP/v124-evidence/test" "$RUNNER_TEMP/v124-evidence/validation"
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v124-test-$TEST" -D "$RUNNER_TEMP/v124-evidence/test"
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v124-validation-$VALIDATION" -D "$RUNNER_TEMP/v124-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .phase=="test-v124" and .commitSha==$sha and .productionWritten==false and .cycle==["apply","integration","rollback","reapply"]' "$RUNNER_TEMP/v124-evidence/test/v124-test.json" >/dev/null
          jq -e '.base and .clean' "$RUNNER_TEMP/v124-evidence/validation/v124-validation.json" >/dev/null
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts")"
          jq -e '[.artifacts[]|select(.expired==false and .size_in_bytes>0)]|length==1' <<<"$artifacts" >/dev/null
          artifact="$(jq -r '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name' <<<"$artifacts")"
          [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v124-evidence/backup"
          shopt -s nullglob
          journals=("$RUNNER_TEMP/v124-evidence/backup/"*.json)
          encrypted=("$RUNNER_TEMP/v124-evidence/backup/"*.dump.gpg)
          checksums=("$RUNNER_TEMP/v124-evidence/backup/"*.dump.gpg.sha256)
          test "${#journals[@]}" = 1 && test "${#encrypted[@]}" = 1 && test "${#checksums[@]}" = 1
          jq -e --arg run "$BACKUP" --arg repo "$GITHUB_REPOSITORY" '.operation=="backup" and .status=="success" and .workflowRunId==$run and .repository==$repo and .encryption=="OpenPGP symmetric AES-256" and .archiveFormat=="PostgreSQL custom" and .archiveEntries>0' "${journals[0]}" >/dev/null
          test "$(sha256sum "${encrypted[0]}" | cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          test "$(tr -d '[:space:]' < "${checksums[0]}")" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          test "$(stat -c %s "${encrypted[0]}")" = "$(jq -r .encryptedBytes "${journals[0]}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Repeat read-only guard, atomically apply v124 only, verify
        env: { PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=10000", GH_TOKEN: "${{ github.token }}", SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="${SUPABASE_DB_URL/:6543/:5432}"
          test "$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select not exists(select 1 from information_schema.columns where table_schema='public' and table_name='booking_policies' and column_name='auto_complete_payment_method')")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v124.sql
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('column',exists(select 1 from information_schema.columns where table_schema='public' and table_name='booking_policies' and column_name='auto_complete_payment_method'),'function',position('auto_complete_payment_method' in pg_get_functiondef('public.process_minuta_auto_completed_visits_v106(integer)'::regprocedure))>0)")"
          jq -e '.column and .function' <<<"$state" >/dev/null
          printf '%s\n' "$state" > "$RUNNER_TEMP/v124-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v124-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v124-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v124:
    if: inputs.phase == 'observe-production-v124'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - name: Verify exact apply run
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v124-safe-release.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v124 - apply-production-v124 - $SHA"
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Observe v124 read-only
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="${SUPABASE_DB_URL/:6543/:5432}"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('column',exists(select 1 from information_schema.columns where table_schema='public' and table_name='booking_policies' and column_name='auto_complete_payment_method'),'constraint',exists(select 1 from pg_constraint where conrelid='public.booking_policies'::regclass and conname='booking_policies_auto_complete_payment_method_check' and convalidated),'function',position('auto_complete_payment_method' in pg_get_functiondef('public.process_minuta_auto_completed_visits_v106(integer)'::regprocedure))>0)")"
          jq -e '.column and .constraint and .function' <<<"$state" >/dev/null
          printf '%s\n' "$state" > "$RUNNER_TEMP/v124-observation.json"
      - run: node minuta-online-booking/production-health-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v124-observation-${{ github.run_id }}", path: "${{ runner.temp }}/v124-observation.json", if-no-files-found: error, retention-days: 90 }
