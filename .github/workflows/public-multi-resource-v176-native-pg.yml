name: Public multi-resource v176 native PostgreSQL

on:
  push:
    branches: [codex/pro-multi-resource-v176-rebase-20260929]
    paths:
      - '.github/workflows/public-multi-resource-v176-native-pg.yml'
      - 'minuta-online-booking/supabase-migration-v188*.sql'
      - 'minuta-online-booking/tests/public-multi-resource-v176-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: minuta-v176-fixture
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Install test-only PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/v176-pg-deps" --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Verify v176 contract on empty disposable PostgreSQL 17
        env:
          MINUTA_V176_EPHEMERAL_CONFIRM: EMPTY_LOCAL_POSTGRES
          MINUTA_V176_EPHEMERAL_DATABASE_URL: postgresql://postgres:ephemeral-fixture-only@127.0.0.1:55432/minuta-v176-fixture
          MINUTA_V176_NATIVE_CONCURRENCY: '1'
        run: |
          set -euo pipefail
          export MINUTA_PG_MODULE="$RUNNER_TEMP/v176-pg-deps/node_modules/pg/lib/index.js"
          export MINUTA_PGLITE_MODULE="$GITHUB_WORKSPACE/minuta-online-booking/tests/public-multi-resource-v176-native-pg-adapter.mjs"
          node minuta-online-booking/tests/public-multi-resource-v176-pglite-test.mjs

  full-schema-clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: minuta-test
    concurrency:
      group: minuta-v176-schema-read
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: minuta-v176-fixture
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Install test-only PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/v176-pg-deps" --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Clone only isolated test schema into empty temporary PostgreSQL
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/codex/pro-multi-resource-v176-rebase-20260929
          node minuta-online-booking/scripts/migration-config-guard.mjs
          export MINUTA_TEST_DATABASE_URL="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(docker exec -i -e TEST_DSN="$MINUTA_TEST_DATABASE_URL" -e TEST_REF="$MINUTA_TEST_PROJECT_REF" "$PG_CONTAINER" sh -c 'psql "$TEST_DSN" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$TEST_REF"' 2>"$RUNNER_TEMP/v176-private.log" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$marker" = 1
          docker exec -e TEST_DSN="$MINUTA_TEST_DATABASE_URL" "$PG_CONTAINER" sh -c 'pg_dump "$TEST_DSN" --schema-only --schema=public --no-owner --file=/tmp/source-schema.sql' 2>"$RUNNER_TEMP/v176-private.log"
          docker cp "$PG_CONTAINER:/tmp/source-schema.sql" "$RUNNER_TEMP/v176-private-schema.sql"
          node minuta-online-booking/tests/booking-delete-dialog-import.mjs prepare "$RUNNER_TEMP/v176-private-schema.sql" "$RUNNER_TEMP/v176-private-filtered.sql"
          docker cp minuta-online-booking/scripts/crm-snapshot-offline-bootstrap.sql "$PG_CONTAINER:/tmp/bootstrap.sql"
          docker cp minuta-online-booking/tests/booking-delete-dialog-bootstrap.sql "$PG_CONTAINER:/tmp/fixture-bootstrap.sql"
          docker cp "$RUNNER_TEMP/v176-private-filtered.sql" "$PG_CONTAINER:/tmp/schema.sql"
          for stage in bootstrap fixture-bootstrap schema-import; do
            file="$stage"
            if test "$stage" = schema-import; then file=schema; fi
            if ! docker exec "$PG_CONTAINER" psql -U postgres -d minuta-v176-fixture -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -f "/tmp/$file.sql" >"$RUNNER_TEMP/v176-private.log" 2>&1; then
              node minuta-online-booking/tests/booking-delete-dialog-import.mjs diagnose "$stage" "$RUNNER_TEMP/v176-private.log"
              exit 1
            fi
          done
          docker exec "$PG_CONTAINER" psql -U postgres -d minuta-v176-fixture -X -q -v ON_ERROR_STOP=1 -c "update minuta_migration_guard.target set project_ref='minuta-v176-fixture' where project_ref='eldion-delete-fixture'"
      - name: Rehearse v176 migration and rollback on full schema
        env:
          MINUTA_TEST_DATABASE_URL: postgresql://postgres:ephemeral-fixture-only@127.0.0.1:55432/minuta-v176-fixture
          MINUTA_TEST_PROJECT_REF: minuta-v176-fixture
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_V176_EPHEMERAL_CONFIRM: SCHEMA_ONLY_EMPTY_DATABASE
        run: |
          set -euo pipefail
          export MINUTA_PG_MODULE="$RUNNER_TEMP/v176-pg-deps/node_modules/pg/lib/index.js"
          node minuta-online-booking/tests/public-multi-resource-v176-full-schema-test.mjs
      - name: Verify existing v153 and v167 booking paths with v188 present
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker cp minuta-online-booking/tests/booking-concurrency-v123-fixture.sql "$PG_CONTAINER:/tmp/v123-fixture.sql"
          docker cp minuta-online-booking/supabase-migration-v188.sql "$PG_CONTAINER:/tmp/v188.sql"
          docker cp minuta-online-booking/tests/booking-atomic-create-v153-integration.sql "$PG_CONTAINER:/tmp/v153-integration.sql"
          docker cp minuta-online-booking/tests/public-multi-service-v167-integration.sql "$PG_CONTAINER:/tmp/v167-integration.sql"
          if ! docker exec "$PG_CONTAINER" psql -U postgres -d minuta-v176-fixture -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -c begin -f /tmp/v123-fixture.sql -c commit >"$RUNNER_TEMP/v176-private.log" 2>&1; then
            echo 'synthetic legacy fixture failed; private SQL details withheld'
            exit 1
          fi
          for stage in v188 v153-integration v167-integration; do
            if ! docker exec "$PG_CONTAINER" psql -U postgres -d minuta-v176-fixture -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -f "/tmp/$stage.sql" >"$RUNNER_TEMP/v176-private.log" 2>&1; then
              echo "$stage failed; private SQL details withheld"
              exit 1
            fi
          done
          echo 'PASS: v153 and v167 full-schema integration with v188 installed'
      - name: Remove private schema and logs
        if: always()
        run: rm -f -- "$RUNNER_TEMP/v176-private-schema.sql" "$RUNNER_TEMP/v176-private-filtered.sql" "$RUNNER_TEMP/v176-private.log"
