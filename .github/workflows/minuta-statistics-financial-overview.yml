name: Minuta statistics financial overview
on:
  push:
    branches: [main]
    paths: ['minuta-online-booking/finance-center*', 'minuta-online-booking/statistics-audit*', 'minuta-online-booking/tests/statistics-financial-*', '.github/workflows/minuta-statistics-financial-overview.yml']
  pull_request:
    branches: [main]
    paths: ['minuta-online-booking/finance-center*', 'minuta-online-booking/statistics-audit*', 'minuta-online-booking/tests/statistics-financial-*', '.github/workflows/minuta-statistics-financial-overview.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  financial-scenarios:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --ignore-scripts playwright@1.58.2
      - run: node minuta-online-booking/tests/statistics-financial-scenarios-test.mjs
      - run: node minuta-online-booking/tests/statistics-financial-all-bounds-test.mjs
      - run: node minuta-online-booking/tests/statistics-financial-shared-period-test.mjs
      - run: node minuta-online-booking/tests/statistics-financial-period-propagation-test.mjs
      - run: node minuta-online-booking/tests/statistics-financial-master-summary-test.mjs
      - run: node minuta-online-booking/tests/statistics-financial-overview-browser-test.mjs
        env:
          MINUTA_VISUAL_OUTPUT: /tmp/statistics-overview-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-financial-overview
          path: /tmp/statistics-overview-evidence
          if-no-files-found: ignore
