name: Minuta delete diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Проверить удаление с откатом
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SUPABASE_DB_URL" in
            *cawexmmrqjvothcbgjxr*) ;;
            *) exit 1 ;;
          esac
          DB_URL="${SUPABASE_DB_URL/:6543/:5432}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config(
            'request.jwt.claim.sub',
            (select performer_id::text from public.bookings order by created_at desc limit 1),
            true
          );
          set local role authenticated;
          select public.provider_delete_booking(
            (select id from public.bookings where performer_id = auth.uid() order by created_at desc limit 1)
          );
          rollback;
          SQL
