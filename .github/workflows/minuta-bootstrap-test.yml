name: Minuta bootstrap isolated test database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Для пересоздания public-схемы тестовой БД введите RESET_ISOLATED_TEST_SCHEMA
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: minuta-test-database
  cancel-in-progress: false

jobs:
  export-production-schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      PGSSLMODE: require
    steps:
      - name: Проверить явное разрешение и production-адрес
        env:
          BOOTSTRAP_CONFIRM: ${{ inputs.confirm }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BOOTSTRAP_CONFIRM" = "RESET_ISOLATED_TEST_SCHEMA"
          test -n "$SUPABASE_DB_URL"
          test "$MINUTA_PRODUCTION_PROJECT_REF" != "$MINUTA_TEST_PROJECT_REF"
          node <<'NODE'
          const url = new URL(process.env.SUPABASE_DB_URL);
          const ref = String(process.env.MINUTA_PRODUCTION_PROJECT_REF || '').toLowerCase();
          const host = url.hostname.toLowerCase();
          const user = decodeURIComponent(url.username).toLowerCase();
          const direct = host === `db.${ref}.supabase.co` && user === 'postgres';
          const pooler = host.endsWith('.pooler.supabase.com') && user === `postgres.${ref}`;
          if (!/^[a-z0-9]{20}$/.test(ref) || (!direct && !pooler)) {
            throw new Error('SUPABASE_DB_URL не соответствует точному production project ref');
          }
          NODE

      - name: Установить PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl gnupg
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Собрать безопасный public schema-only SQL без данных и production-вебхуков
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          production_url="${SUPABASE_DB_URL/:6543/:5432}"
          archive="$RUNNER_TEMP/minuta-production-public-schema.dump"
          toc="$RUNNER_TEMP/minuta-production-public-schema.toc"
          filtered_toc="$RUNNER_TEMP/minuta-production-public-schema.filtered.toc"
          next_toc="$RUNNER_TEMP/minuta-production-public-schema.next.toc"
          external_triggers="$RUNNER_TEMP/minuta-production-external-triggers.tsv"
          schema_sql="$RUNNER_TEMP/minuta-production-public-schema.sql"
          constraints="$RUNNER_TEMP/minuta-production-public-constraints.tsv"
          checksum="$RUNNER_TEMP/minuta-production-public-schema.sql.sha256"
          metadata="$RUNNER_TEMP/minuta-production-public-schema.meta"
          trap 'rm -f "$archive" "$toc" "$filtered_toc" "$next_toc" "$external_triggers"' EXIT

          PGOPTIONS='-c default_transaction_read_only=on -c lock_timeout=5s' \
            /usr/lib/postgresql/17/bin/pg_dump \
              --dbname="$production_url" \
              --format=custom \
              --schema=public \
              --schema-only \
              --no-owner \
              --no-comments \
              --no-publications \
              --no-subscriptions \
              --no-blobs \
              --file="$archive"
          /usr/lib/postgresql/17/bin/pg_restore --list "$archive" > "$toc"
          if grep -E 'TABLE DATA|SEQUENCE SET|BLOB|LARGE OBJECT|DATABASE|ALTER SYSTEM' "$toc"; then
            echo "Schema-only архив содержит запрещённые секции" >&2
            exit 1
          fi
          if grep -E ' EXTENSION ' "$toc" | grep -v 'btree_gist'; then
            echo "Schema-only архив содержит расширение вне allowlist" >&2
            exit 1
          fi
          PGOPTIONS='-c default_transaction_read_only=on -c lock_timeout=5s' \
            /usr/lib/postgresql/17/bin/psql "$production_url" \
              --set=ON_ERROR_STOP=1 --tuples-only --no-align --field-separator=$'\t' \
              > "$external_triggers" <<'SQL'
          select relation.relname, trigger_info.tgname
          from pg_trigger trigger_info
          join pg_class relation on relation.oid=trigger_info.tgrelid
          join pg_namespace relation_schema on relation_schema.oid=relation.relnamespace
          join pg_proc handler on handler.oid=trigger_info.tgfoid
          join pg_namespace handler_schema on handler_schema.oid=handler.pronamespace
          where relation_schema.nspname='public'
            and handler_schema.nspname <> 'public'
            and not trigger_info.tgisinternal
          order by relation.relname, trigger_info.tgname;
          SQL
          awk '
            / DEFAULT ACL / { print ";" $0; next }
            { print }
          ' "$toc" > "$filtered_toc"
          while IFS=$'\t' read -r table_name trigger_name; do
            test -n "$table_name"
            test -n "$trigger_name"
            awk -v needle=" TRIGGER public $table_name $trigger_name " '
              index($0, needle) { print ";" $0; found=1; next }
              { print }
              END { if (!found) exit 4 }
            ' "$filtered_toc" > "$next_toc"
            mv "$next_toc" "$filtered_toc"
          done < "$external_triggers"
          /usr/lib/postgresql/17/bin/pg_restore \
            --use-list="$filtered_toc" \
            --no-owner \
            --schema=public \
            --file="$schema_sql" \
            "$archive"
          test -s "$schema_sql"
          if grep -Eiq '(^|[^a-z0-9_])supabase_functions([^a-z0-9_]|$)|new_booking_telegram|ALTER DEFAULT PRIVILEGES' "$schema_sql" \
            || grep -Fqi "$MINUTA_PRODUCTION_PROJECT_REF" "$schema_sql"; then
            echo "Безопасный schema-only SQL содержит production-вебхук или production ref" >&2
            exit 1
          fi
          if grep -Eq '^(COPY|INSERT INTO)[[:space:]]' "$schema_sql"; then
            echo "Безопасный schema-only SQL содержит данные" >&2
            exit 1
          fi
          PGOPTIONS='-c default_transaction_read_only=on -c lock_timeout=5s' \
            /usr/lib/postgresql/17/bin/psql "$production_url" \
              --set=ON_ERROR_STOP=1 --tuples-only --no-align --field-separator=$'\t' \
              > "$constraints" <<'SQL'
          select relation_schema.nspname,
                 relation.relname,
                 constraint_info.conname,
                 constraint_info.contype,
                 pg_get_constraintdef(constraint_info.oid, true)
          from pg_constraint constraint_info
          join pg_class relation on relation.oid=constraint_info.conrelid
          join pg_namespace relation_schema on relation_schema.oid=relation.relnamespace
          where relation_schema.nspname='public'
          order by relation.relname, constraint_info.conname;
          SQL
          test -s "$constraints"
          schema_entries="$(awk '!/^;/ && NF { count++ } END { print count + 0 }' "$filtered_toc")"
          test "$schema_entries" -gt 0
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$schema_sql")" "$(basename "$constraints")" > "$(basename "$checksum")"
          )
          {
            echo "client_version=$(/usr/lib/postgresql/17/bin/pg_dump --version)"
            echo "server_version=$(/usr/lib/postgresql/17/bin/psql "$production_url" -X -Atc 'show server_version')"
            echo "schema_entries=$schema_entries"
            echo "excluded_external_triggers=$(wc -l < "$external_triggers" | tr -d '[:space:]')"
          } > "$metadata"

      - name: Передать безопасный schema-only SQL изолированному test-job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minuta-production-schema-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/minuta-production-public-schema.sql
            ${{ runner.temp }}/minuta-production-public-constraints.tsv
            ${{ runner.temp }}/minuta-production-public-schema.sql.sha256
            ${{ runner.temp }}/minuta-production-public-schema.meta
          if-no-files-found: error
          retention-days: 1

  bootstrap-test:
    needs: export-production-schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Установить PostgreSQL 17 и OpenPGP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl gnupg
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Получить проверенный schema-only архив
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: minuta-production-schema-${{ github.run_id }}
          path: ${{ runner.temp }}/production-schema

      - name: Проверить test-цель и архив
        env:
          BOOTSTRAP_CONFIRM: ${{ inputs.confirm }}
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BOOTSTRAP_CONFIRM" = "RESET_ISOLATED_TEST_SCHEMA"
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          node minuta-online-booking/scripts/migration-config-guard.mjs
          cd "$RUNNER_TEMP/production-schema"
          sha256sum --check minuta-production-public-schema.sql.sha256
          test -s minuta-production-public-schema.sql
          if grep -Eiq '(^|[^a-z0-9_])supabase_functions([^a-z0-9_]|$)|new_booking_telegram' minuta-production-public-schema.sql \
            || grep -Fqi "$MINUTA_PRODUCTION_PROJECT_REF" minuta-production-public-schema.sql; then
            echo "Полученный schema-only SQL содержит production-вебхук или production ref" >&2
            exit 1
          fi

          test_url="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          guard_count="$(/usr/lib/postgresql/17/bin/psql "$test_url" \
            --set=ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" \
            --tuples-only --no-align <<'SQL'
          select count(*)
          from minuta_migration_guard.target
          where project_ref = :'expected_ref'
            and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$guard_count")" = "1"
          test "$(/usr/lib/postgresql/17/bin/psql "$test_url" -X -Atc 'show server_version' | cut -d. -f1)" = "17"
          test "$(grep '^server_version=' minuta-production-public-schema.meta | cut -d= -f2 | cut -d. -f1)" = "17"

      - name: Создать зашифрованную копию test до замены
        id: backup
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          name="minuta-test-before-bootstrap-$stamp"
          plain="$RUNNER_TEMP/$name.dump"
          verified="$RUNNER_TEMP/$name.verified.dump"
          encrypted="$RUNNER_TEMP/$name.dump.gpg"
          checksum="$RUNNER_TEMP/$name.dump.gpg.sha256"
          trap 'rm -f "$plain" "$verified"' EXIT

          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname="${MINUTA_TEST_DATABASE_URL/:6543/:5432}" \
            --format=custom \
            --no-owner \
            --file="$plain"
          /usr/lib/postgresql/17/bin/pg_restore --list "$plain" >/dev/null
          printf '%s' "$BACKUP_ENCRYPTION_PASSWORD" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 \
            --output "$encrypted" "$plain"
          printf '%s' "$BACKUP_ENCRYPTION_PASSWORD" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output "$verified" --decrypt "$encrypted"
          cmp --silent "$plain" "$verified"
          sha256sum "$encrypted" | awk '{print $1}' > "$checksum"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "encrypted=$encrypted" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Восстановить production-структуру и test-only baseline
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test_url="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          production_sql="$RUNNER_TEMP/production-schema/minuta-production-public-schema.sql"
          production_constraints="$RUNNER_TEMP/production-schema/minuta-production-public-constraints.tsv"

          guard_count="$(/usr/lib/postgresql/17/bin/psql "$test_url" \
            --set=ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" \
            --tuples-only --no-align <<'SQL'
          select count(*)
          from minuta_migration_guard.target
          where project_ref = :'expected_ref'
            and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$guard_count")" = "1"

          /usr/lib/postgresql/17/bin/psql "$test_url" --set=ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          do $jobs$
          declare v_job bigint;
          begin
            select jobid into v_job from cron.job where jobname='telegram-client-reminders-hourly';
            if v_job is not null then
              perform cron.unschedule(v_job);
            end if;
          end
          $jobs$;
          SQL

          reset_sql="$RUNNER_TEMP/minuta-test-public-reset.sql"
          {
            echo '\set ON_ERROR_STOP on'
            echo 'begin;'
            echo 'drop extension if exists btree_gist cascade;'
            echo 'drop schema if exists public cascade;'
            echo 'create schema public authorization pg_database_owner;'
            echo 'grant usage on schema public to anon, authenticated, service_role;'
            echo 'create extension btree_gist with schema public;'
            cat "$production_sql"
            cat <<'SQL'
          create event trigger ensure_rls
          on ddl_command_end
          when tag in ('CREATE TABLE', 'CREATE TABLE AS', 'SELECT INTO')
          execute function public.rls_auto_enable();
          alter event trigger ensure_rls enable;
          create trigger on_auth_user_created
          after insert on auth.users
          for each row execute function public.handle_new_performer();
          SQL
            echo 'commit;'
          } > "$reset_sql"
          /usr/lib/postgresql/17/bin/psql "$test_url" \
            --set=ON_ERROR_STOP=1 \
            --file="$reset_sql"

          test_archive="$RUNNER_TEMP/minuta-test-public-schema.dump"
          test_sql="$RUNNER_TEMP/minuta-test-public-schema.sql"
          test_toc="$RUNNER_TEMP/minuta-test-public-schema.toc"
          test_filtered_toc="$RUNNER_TEMP/minuta-test-public-schema.filtered.toc"
          test_constraints="$RUNNER_TEMP/minuta-test-public-constraints.tsv"
          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname="$test_url" \
            --format=custom \
            --schema=public \
            --schema-only \
            --no-owner \
            --no-comments \
            --no-publications \
            --no-subscriptions \
            --no-blobs \
            --file="$test_archive"
          /usr/lib/postgresql/17/bin/pg_restore --list "$test_archive" > "$test_toc"
          awk '
            / DEFAULT ACL / { print ";" $0; next }
            { print }
          ' "$test_toc" > "$test_filtered_toc"
          /usr/lib/postgresql/17/bin/pg_restore \
            --use-list="$test_filtered_toc" \
            --no-owner \
            --schema=public \
            --file="$test_sql" \
            "$test_archive"
          sed -E '/^--/d;/^\\(un)?restrict /d;/^[[:space:]]*CONSTRAINT .* CHECK /d;/^[[:space:]]*$/d' "$production_sql" \
            > "$production_sql.normalized"
          sed -E '/^--/d;/^\\(un)?restrict /d;/^[[:space:]]*CONSTRAINT .* CHECK /d;/^[[:space:]]*$/d' "$test_sql" \
            > "$test_sql.normalized"
          diff --unified=3 "$production_sql.normalized" "$test_sql.normalized"
          /usr/lib/postgresql/17/bin/psql "$test_url" \
            --set=ON_ERROR_STOP=1 --tuples-only --no-align --field-separator=$'\t' \
            > "$test_constraints" <<'SQL'
          select relation_schema.nspname,
                 relation.relname,
                 constraint_info.conname,
                 constraint_info.contype,
                 pg_get_constraintdef(constraint_info.oid, true)
          from pg_constraint constraint_info
          join pg_class relation on relation.oid=constraint_info.conrelid
          join pg_namespace relation_schema on relation_schema.oid=relation.relnamespace
          where relation_schema.nspname='public'
          order by relation.relname, constraint_info.conname;
          SQL
          diff --unified=3 "$production_constraints" "$test_constraints"

          /usr/lib/postgresql/17/bin/psql "$test_url" --set=ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $empty$
          begin
            if (select count(*) from public.performer_profiles) <> 0
              or (select count(*) from public.services) <> 0
              or (select count(*) from public.bookings) <> 0
              or (select count(*) from public.provider_schedule) <> 0 then
              raise exception 'Schema-only восстановление неожиданно перенесло production-данные';
            end if;
            if to_regprocedure('public.handle_new_performer()') is null then
              raise exception 'В production-схеме отсутствует базовый auth-trigger handler';
            end if;
          end
          $empty$;

          delete from auth.users
          where id='abeb5b13-ca1d-45c6-a2ad-b0e4119b2e1f'
            and email='minuta-fixture@example.invalid'
            and raw_user_meta_data @> '{"fixture":true}'::jsonb;
          do $fixture_conflict$
          begin
            if exists (
              select 1 from auth.users
              where id='abeb5b13-ca1d-45c6-a2ad-b0e4119b2e1f'
                 or email='minuta-fixture@example.invalid'
            ) then
              raise exception 'UUID или email тестовой фикстуры уже занят посторонней записью';
            end if;
          end
          $fixture_conflict$;
          set local session_replication_role = replica;
          insert into auth.users (
            instance_id, id, aud, role, email, email_confirmed_at,
            raw_app_meta_data, raw_user_meta_data, created_at, updated_at
          ) values (
            '00000000-0000-0000-0000-000000000000',
            'abeb5b13-ca1d-45c6-a2ad-b0e4119b2e1f',
            'authenticated', 'authenticated', 'minuta-fixture@example.invalid', now(),
            '{"provider":"email","providers":["email"]}'::jsonb,
            '{"fixture":true}'::jsonb, now(), now()
          );
          set local session_replication_role = origin;
          insert into public.performer_profiles (id, display_name)
          values ('abeb5b13-ca1d-45c6-a2ad-b0e4119b2e1f', 'Тестовый мастер');
          insert into public.services (
            id, performer_id, name, duration_minutes, price_rub, active
          ) values (
            '00000000-0000-4000-8000-000000000001',
            'abeb5b13-ca1d-45c6-a2ad-b0e4119b2e1f',
            'Тестовая услуга', 60, 1500, true
          );
          insert into public.provider_schedule (
            performer_id, weekday, enabled, start_time, end_time, slot_interval_minutes
          )
          select
            'abeb5b13-ca1d-45c6-a2ad-b0e4119b2e1f',
            weekday, true, time '09:00', time '21:00', 30
          from generate_series(1, 7) as weekday;
          -- The fixture profile can activate current organization triggers. The
          -- isolated baseline must stay unused so every structural rollback is testable.
          delete from public.organization_audit_log;
          delete from public.organization_invitations;
          commit;
          SQL

      - name: Проверить изоляцию и готовность baseline
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test_url="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          /usr/lib/postgresql/17/bin/psql "$test_url" \
            --set=ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" \
            --set=production_ref="$MINUTA_PRODUCTION_PROJECT_REF" -X -At <<'SQL' \
            | grep -qx t
          select to_regclass('public.bookings') is not null
              and to_regclass('public.services') is not null
              and to_regclass('public.provider_schedule') is not null
              and to_regclass('public.performer_profiles') is not null
              and (select count(*) from public.performer_profiles) = 1
              and (select count(*) from public.bookings) = 0
              and (select count(*) from public.services where active and price_rub > 0) = 1
              and (select count(*) from public.provider_schedule where enabled) = 7
              and (select count(*) from public.organization_audit_log) = 0
              and (select count(*) from public.organization_invitations) = 0
              and has_schema_privilege('anon','public','USAGE')
              and has_schema_privilege('authenticated','public','USAGE')
              and has_schema_privilege('service_role','public','USAGE')
              and exists (
                select 1 from minuta_migration_guard.target
                where project_ref = :'expected_ref' and allow_migrations is true
              )
              and exists (select 1 from pg_extension where extname='pg_cron')
              and exists (select 1 from pg_extension where extname='pg_net')
              and exists (
                select 1
                from pg_extension extension_info
                join pg_namespace extension_schema on extension_schema.oid=extension_info.extnamespace
                where extension_info.extname='btree_gist'
                  and extension_schema.nspname='public'
              )
              and exists (
                select 1
                from pg_event_trigger event_trigger
                join pg_proc handler on handler.oid=event_trigger.evtfoid
                join pg_namespace handler_schema on handler_schema.oid=handler.pronamespace
                where event_trigger.evtname='ensure_rls'
                  and event_trigger.evtevent='ddl_command_end'
                  and event_trigger.evtenabled='O'
                  and event_trigger.evttags @> array['CREATE TABLE','CREATE TABLE AS','SELECT INTO']::text[]
                  and cardinality(event_trigger.evttags)=3
                  and handler_schema.nspname='public'
                  and handler.proname='rls_auto_enable'
              )
              and (select count(*)
                   from pg_trigger trigger_info
                   join pg_proc handler on handler.oid=trigger_info.tgfoid
                   join pg_namespace handler_schema on handler_schema.oid=handler.pronamespace
                   where trigger_info.tgrelid='auth.users'::regclass
                     and trigger_info.tgname='on_auth_user_created'
                     and not trigger_info.tgisinternal
                     and trigger_info.tgenabled='O'
                     and trigger_info.tgtype=5
                     and trigger_info.tgqual is null
                     and handler_schema.nspname='public'
                     and handler.proname='handle_new_performer') = 1
              and not exists (
                select 1 from cron.job
                where jobname='telegram-client-reminders-hourly'
                   or command like '%' || :'production_ref' || '%'
              );
          SQL

      - name: Сохранить зашифрованную копию исходного test
        if: always() && steps.backup.outputs.encrypted != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.backup.outputs.name }}
          path: |
            ${{ steps.backup.outputs.encrypted }}
            ${{ steps.backup.outputs.checksum }}
          if-no-files-found: error
          retention-days: 35
