name: Minuta v142 integration Edge release
run-name: Minuta v142 Edge - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character current main commit SHA
        required: true
        type: string
      evidence_commit_sha:
        description: Exact v142 commit SHA proven by the apply and observe runs
        required: true
        type: string
      apply_run_id:
        description: Successful v142 production apply run ID
        required: true
        type: string
      observe_run_id:
        description: Successful v142 production observation run ID
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY_DISABLED_V142_EDGE
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: minuta-production-database
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      SHA: ${{ inputs.commit_sha }}
      EVIDENCE_SHA: ${{ inputs.evidence_commit_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact current main commit and disabled release intent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          [[ "$EVIDENCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$EVIDENCE_SHA" "$SHA"
          git diff --quiet "$EVIDENCE_SHA" "$SHA" -- \
            minuta-online-booking/supabase-migration-v142.sql \
            minuta-online-booking/supabase-migration-v142-rollback.sql \
            supabase/functions/primetime-integration-api \
            supabase/functions/primetime-webhook-dispatcher
          test "$CONFIRMATION" = DEPLOY_DISABLED_V142_EDGE
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$PROJECT_REF" = cawexmmrqjvothcbgjxr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - name: Verify both adapters without external side effects
        run: |
          set -euo pipefail
          node minuta-online-booking/integration-contour-v142-static-test.mjs
          node --test minuta-online-booking/tests/primetime-integration-edge-test.mjs minuta-online-booking/tests/primetime-webhook-dispatcher-test.mjs
          deno check supabase/functions/primetime-integration-api/index.ts supabase/functions/primetime-webhook-dispatcher/index.ts
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v1
        with: { version: 2.117.0 }
      - name: Verify the applied and observed empty production contour
        env:
          APPLY: ${{ inputs.apply_run_id }}
          OBSERVE: ${{ inputs.observe_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in "$APPLY" "$OBSERVE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$EVIDENCE_SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v142-integration-contour.yml; }
          mkdir -p "$RUNNER_TEMP/v142-edge-evidence"/{apply,observe}
          check_run "$APPLY"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v142-apply-$APPLY" -D "$RUNNER_TEMP/v142-edge-evidence/apply"
          jq -e --arg sha "$EVIDENCE_SHA" '.status=="success" and .commitSha==$sha and .productionWritten and (.businessRowsChanged|not) and (.realIntegrationsEnabled|not) and .state.ready and .state.connections==0 and .state.enabledConnections==0' "$RUNNER_TEMP/v142-edge-evidence/apply/v142-apply.json" >/dev/null
          check_run "$OBSERVE"
          gh run download "$OBSERVE" -R "$GITHUB_REPOSITORY" -n "v142-observe-$OBSERVE" -D "$RUNNER_TEMP/v142-edge-evidence/observe"
          jq -e --arg sha "$EVIDENCE_SHA" --arg apply "$APPLY" '.status=="success" and .commitSha==$sha and .applyRunId==$apply and .readOnly and (.productionWritten|not) and (.realIntegrationsEnabled|not) and .state.ready and .state.connections==0 and .state.enabledConnections==0' "$RUNNER_TEMP/v142-edge-evidence/observe/v142-observe.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - name: Attempt to force both production adapters off before deployment
        id: disable
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          supabase secrets set PRIMETIME_INTEGRATION_ENABLED=false PRIMETIME_WEBHOOK_DISPATCH_ENABLED=false --project-ref "$PROJECT_REF"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - name: Deploy only the v142 integration adapters
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          supabase functions deploy primetime-webhook-dispatcher --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          supabase functions deploy primetime-integration-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - name: Prove both production adapters remain disabled
        run: |
          set -euo pipefail
          api_url="https://$PROJECT_REF.supabase.co/functions/v1/primetime-integration-api/v1/calendar"
          dispatcher_url="https://$PROJECT_REF.supabase.co/functions/v1/primetime-webhook-dispatcher"
          api_status="$(curl --silent --show-error --output "$RUNNER_TEMP/api-disabled.json" --write-out '%{http_code}' \
            --header 'Accept: application/json' "$api_url")"
          dispatcher_status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatcher-disabled.json" --write-out '%{http_code}' \
            --request POST "$dispatcher_url")"
          test "$api_status" = 503
          test "$dispatcher_status" = 503
          jq -e '.code == "NOT_CONFIGURED"' "$RUNNER_TEMP/api-disabled.json" >/dev/null
          jq -e '.code == "NOT_CONFIGURED"' "$RUNNER_TEMP/dispatcher-disabled.json" >/dev/null
          jq -n --arg sha "$SHA" --arg api "$api_url" --arg dispatcher "$dispatcher_url" \
            --arg secretWrite "${{ steps.disable.outcome }}" \
            '{status:"success",commitSha:$sha,apiRoute:$api,dispatcherRoute:$dispatcher,
              enabled:false,configurationStatus:"NOT_CONFIGURED",secretWriteOutcome:$secretWrite,productionWritten:true,
              externalRequestsSent:false,realIntegrationsEnabled:false,realBookingsCreated:false}' \
            > "$RUNNER_TEMP/v142-edge-release.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v142-edge-release-${{ github.run_id }}
          path: ${{ runner.temp }}/v142-edge-release.json
          if-no-files-found: error
          retention-days: 90
