name: Minuta v152-v153 booking atomic release
run-name: Minuta v152-v153 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v152-v153
        required: true
        default: test-v152-v153
        type: choice
        options: [test-v152-v153, validate-production-v152-v153, apply-production-v152-v153, observe-production-v152-v153]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v152-v153 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v152-v153 apply run ID, required: false, default: "", type: string }
      observation_minutes:
        description: Read-only production observation duration
        required: false
        default: "30"
        type: choice
        options: ["30", "60"]
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency:
  group: "${{ inputs.phase == 'test-v152-v153' && 'minuta-test-database' || 'minuta-production-database' }}"
  cancel-in-progress: false
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env:
          SHA: "${{ inputs.commit_sha }}"
          PHASE: "${{ inputs.phase }}"
          CONFIRMATION: "${{ inputs.confirmation }}"
          MINUTES: "${{ inputs.observation_minutes }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v152-v153|validate-production-v152-v153) ;;
            apply-production-v152-v153) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            observe-production-v152-v153) case "$MINUTES" in 30|60) ;; *) exit 1 ;; esac ;;
            *) exit 1 ;;
          esac
          for file in \
            minuta-online-booking/supabase-migration-v152.sql \
            minuta-online-booking/supabase-migration-v152-rollback.sql \
            minuta-online-booking/tests/booking-recovery-v152-integration.sql \
            minuta-online-booking/supabase-migration-v153.sql \
            minuta-online-booking/supabase-migration-v153-rollback.sql \
            minuta-online-booking/tests/booking-atomic-create-v153-integration.sql; do
            test -s "$file"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/tests/booking-atomic-v152-v153-release-static-test.mjs
      - run: node minuta-online-booking/scripts/booking-atomic-v152-v153-contract.mjs >/dev/null

  test-v152-v153:
    if: inputs.phase == 'test-v152-v153'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: MIGRATE_ONLY_ISOLATED_TEST_DATABASE
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply twice, integrate, reverse rollback and reapply
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          expected="$(node minuta-online-booking/scripts/booking-atomic-v152-v153-contract.mjs)"
          counts_before="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-business-counts-v152-v153.sql | grep '^{' | tail -n 1)"

          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v152.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v153.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v152.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v153.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/booking-recovery-v152-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/booking-atomic-create-v153-integration.sql

          applied="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-atomic-v152-v153-state.sql | grep '^{' | tail -n 1)"
          jq -e --argjson expected "$expected" '.classification=="exact" and .exact
            and .layers.v152.sourceHash==$expected.v152.sourceHash
            and .layers.v153.sourceHash==$expected.v153.sourceHash' <<<"$applied" >/dev/null

          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v153-rollback.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v152-rollback.sql
          absent="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-atomic-v152-v153-state.sql | grep '^{' | tail -n 1)"
          jq -e '.classification=="absent" and .presentCount==0' <<<"$absent" >/dev/null

          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v152.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v153.sql
          reapplied="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-atomic-v152-v153-state.sql | grep '^{' | tail -n 1)"
          jq -e --argjson expected "$expected" '.classification=="exact" and .exact
            and .layers.v152.sourceHash==$expected.v152.sourceHash
            and .layers.v153.sourceHash==$expected.v153.sourceHash' <<<"$reapplied" >/dev/null
          counts_after="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-business-counts-v152-v153.sql | grep '^{' | tail -n 1)"
          test "$(jq -S . <<<"$counts_after")" = "$(jq -S . <<<"$counts_before")"

          jq -n --arg sha "$SHA" --argjson contracts "$expected" --argjson before "$counts_before" --argjson after "$counts_after" \
            '{status:"success",phase:"test-v152-v153",commitSha:$sha,isolatedDatabase:true,
              productionWritten:false,businessRowsChanged:false,externalMessagesSent:false,paymentsCharged:false,
              contracts:$contracts,before:$before,after:$after,
              coverage:["apply-twice","v152-integration","v153-integration","reverse-rollback","reapply","acl","business-counts"]}' \
            > "$RUNNER_TEMP/v152-v153-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "v152-v153-test-${{ github.run_id }}"
          path: "${{ runner.temp }}/v152-v153-test.json"
          if-no-files-found: error
          retention-days: 90

  validate-production-v152-v153:
    if: inputs.phase == 'validate-production-v152-v153'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate production prerequisites read-only
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          expected="$(node minuta-online-booking/scripts/booking-atomic-v152-v153-contract.mjs)"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-atomic-v152-v153-state.sql | grep '^{' | tail -n 1)"
          jq -e --argjson expected "$expected" '
            .classification=="absent" or
            (.classification=="v152-only-exact" and .layers.v152.sourceHash==$expected.v152.sourceHash) or
            (.classification=="exact" and .layers.v152.sourceHash==$expected.v152.sourceHash and .layers.v153.sourceHash==$expected.v153.sourceHash)
          ' <<<"$state" >/dev/null
          counts="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-business-counts-v152-v153.sql | grep '^{' | tail -n 1)"
          v151="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '.classification=="exact" and .exact and .criticalSchemaExact' <<<"$v151" >/dev/null
          jq -n --arg sha "$SHA" --argjson contracts "$expected" --argjson state "$state" --argjson counts "$counts" \
            '{status:"success",phase:"validate-production-v152-v153",commitSha:$sha,readOnly:true,
              productionWritten:false,contracts:$contracts,state:$state,counts:$counts,v151Exact:true}' \
            > "$RUNNER_TEMP/v152-v153-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "v152-v153-validation-${{ github.run_id }}"
          path: "${{ runner.temp }}/v152-v153-validation.json"
          if-no-files-found: error
          retention-days: 90

  apply-production-v152-v153:
    if: inputs.phase == 'apply-production-v152-v153'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Verify isolated test, validation, fresh encrypted backup and linked offline restore
        env:
          SHA: "${{ inputs.commit_sha }}"
          TEST: "${{ inputs.test_run_id }}"
          VALIDATION: "${{ inputs.validation_run_id }}"
          BACKUP: "${{ inputs.backup_run_id }}"
          RESTORE: "${{ inputs.restore_run_id }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          expected="$(node minuta-online-booking/scripts/booking-atomic-v152-v153-contract.mjs)"
          mkdir -p "$RUNNER_TEMP/v152-v153-evidence"/{test,validation,backup,restore}

          check_run "$TEST" .github/workflows/minuta-v152-v153-booking-atomic-release.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v152-v153-test-$TEST" -D "$RUNNER_TEMP/v152-v153-evidence/test"
          jq -e --arg sha "$SHA" --argjson expected "$expected" '.status=="success" and .commitSha==$sha and .isolatedDatabase
            and (.productionWritten|not) and (.businessRowsChanged|not) and (.externalMessagesSent|not) and (.paymentsCharged|not)
            and .contracts==$expected and (.coverage|index("apply-twice"))!=null and (.coverage|index("reverse-rollback"))!=null
            and (.coverage|index("reapply"))!=null' "$RUNNER_TEMP/v152-v153-evidence/test/v152-v153-test.json" >/dev/null

          check_run "$VALIDATION" .github/workflows/minuta-v152-v153-booking-atomic-release.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v152-v153-validation-$VALIDATION" -D "$RUNNER_TEMP/v152-v153-evidence/validation"
          jq -e --arg sha "$SHA" --argjson expected "$expected" '.status=="success" and .commitSha==$sha and .readOnly
            and (.productionWritten|not) and .contracts==$expected and .v151Exact
            and (.state.classification=="absent" or .state.classification=="v152-only-exact" or .state.classification=="exact")' "$RUNNER_TEMP/v152-v153-evidence/validation/v152-v153-validation.json" >/dev/null

          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          backup_created="$(jq -r .created_at <<<"$run")"
          age=$(( $(date +%s)-$(date -d "$backup_created" +%s) ))
          test "$age" -ge 0 && test "$age" -le 7200
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts")"
          test "$(jq '[.artifacts[]|select(.expired==false and .size_in_bytes>0)]|length' <<<"$artifacts")" = 1
          artifact="$(jq -r '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name' <<<"$artifacts")"
          [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v152-v153-evidence/backup"
          shopt -s nullglob
          encrypted=("$RUNNER_TEMP/v152-v153-evidence/backup/"*.dump.gpg)
          journals=("$RUNNER_TEMP/v152-v153-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}" | cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          jq -e --arg run "$BACKUP" --arg repository "$GITHUB_REPOSITORY" '.operation=="backup" and .status=="success"
            and .workflowRunId==$run and .repository==$repository and .encryptedBytes>0 and .archiveEntries>0
            and .archiveFormat=="PostgreSQL custom" and .encryption=="OpenPGP symmetric AES-256"' "${journals[0]}" >/dev/null

          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          restore_created="$(jq -r .created_at <<<"$run")"
          restore_age=$(( $(date +%s)-$(date -d "$restore_created" +%s) ))
          test "$restore_age" -ge 0 && test "$restore_age" -le 7200
          test "$(date -d "$restore_created" +%s)" -ge "$(date -d "$backup_created" +%s)"
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v152-v153-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none"
            and .ephemeralContainerDestroyed and (.productionWritten|not)
            and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v152-v153-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply only v152 and v153 without business-row writes
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          expected="$(node minuta-online-booking/scripts/booking-atomic-v152-v153-contract.mjs)"
          before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-business-counts-v152-v153.sql | grep '^{' | tail -n 1)"
          state_before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-atomic-v152-v153-state.sql | grep '^{' | tail -n 1)"
          jq -e --argjson expected "$expected" '.classification=="absent" or
            (.classification=="v152-only-exact" and .layers.v152.sourceHash==$expected.v152.sourceHash) or
            (.classification=="exact" and .layers.v152.sourceHash==$expected.v152.sourceHash and .layers.v153.sourceHash==$expected.v153.sourceHash)' <<<"$state_before" >/dev/null

          initial="$(jq -r .classification <<<"$state_before")"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v152.sql
          if ! psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v153.sql; then
            if test "$initial" = absent; then
              psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v152-rollback.sql
            fi
            exit 1
          fi

          after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-business-counts-v152-v153.sql | grep '^{' | tail -n 1)"
          test "$(jq -S . <<<"$after")" = "$(jq -S . <<<"$before")"
          state_after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-atomic-v152-v153-state.sql | grep '^{' | tail -n 1)"
          jq -e --argjson expected "$expected" '.classification=="exact" and .exact
            and .layers.v152.sourceHash==$expected.v152.sourceHash
            and .layers.v153.sourceHash==$expected.v153.sourceHash' <<<"$state_after" >/dev/null
          jq -n --arg sha "$SHA" --argjson contracts "$expected" --argjson before "$before" --argjson after "$after" --argjson stateBefore "$state_before" --argjson stateAfter "$state_after" \
            '{status:"success",phase:"apply-production-v152-v153",commitSha:$sha,productionWritten:true,
              businessRowsChanged:false,externalMessagesSent:false,paymentsCharged:false,
              contracts:$contracts,before:$before,after:$after,stateBefore:$stateBefore,stateAfter:$stateAfter}' \
            > "$RUNNER_TEMP/v152-v153-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "v152-v153-apply-${{ github.run_id }}"
          path: "${{ runner.temp }}/v152-v153-apply.json"
          if-no-files-found: error
          retention-days: 90

  observe-production-v152-v153:
    if: inputs.phase == 'observe-production-v152-v153'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Observe exact production state read-only
        env:
          SHA: "${{ inputs.commit_sha }}"
          APPLY: "${{ inputs.apply_run_id }}"
          MINUTES: "${{ inputs.observation_minutes }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          case "$MINUTES" in 30|60) ;; *) exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v152-v153-booking-atomic-release.yml
          mkdir -p "$RUNNER_TEMP/v152-v153-apply"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v152-v153-apply-$APPLY" -D "$RUNNER_TEMP/v152-v153-apply"
          expected="$(node minuta-online-booking/scripts/booking-atomic-v152-v153-contract.mjs)"
          jq -e --arg sha "$SHA" --argjson expected "$expected" '.status=="success" and .commitSha==$sha and .productionWritten
            and (.businessRowsChanged|not) and (.externalMessagesSent|not) and (.paymentsCharged|not)
            and .contracts==$expected and .stateAfter.classification=="exact"' "$RUNNER_TEMP/v152-v153-apply/v152-v153-apply.json" >/dev/null

          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          observe(){
            state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-atomic-v152-v153-state.sql | grep '^{' | tail -n 1)"
            jq -e --argjson expected "$expected" '.classification=="exact" and .exact
              and .layers.v152.sourceHash==$expected.v152.sourceHash
              and .layers.v153.sourceHash==$expected.v153.sourceHash' <<<"$state" >/dev/null
            counts="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/booking-business-counts-v152-v153.sql | grep '^{' | tail -n 1)"
          }
          observe
          state_start="$state"
          counts_start="$counts"
          sleep "$((MINUTES*60))"
          observe
          state_end="$state"
          counts_end="$counts"
          test "$(jq -S . <<<"$counts_end")" = "$(jq -S . <<<"$counts_start")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          jq -n --arg sha "$SHA" --arg apply "$APPLY" --arg minutes "$MINUTES" --argjson stateStart "$state_start" --argjson stateEnd "$state_end" --argjson countsStart "$counts_start" --argjson countsEnd "$counts_end" \
            '{status:"success",phase:"observe-production-v152-v153",commitSha:$sha,applyRunId:$apply,
              observationMinutes:($minutes|tonumber),readOnly:true,productionWritten:false,
              businessRowsChanged:false,externalMessagesSent:false,paymentsCharged:false,
              stateStart:$stateStart,stateEnd:$stateEnd,countsStart:$countsStart,countsEnd:$countsEnd}' \
            > "$RUNNER_TEMP/v152-v153-observation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "v152-v153-observation-${{ github.run_id }}"
          path: "${{ runner.temp }}/v152-v153-observation.json"
          if-no-files-found: error
          retention-days: 90
