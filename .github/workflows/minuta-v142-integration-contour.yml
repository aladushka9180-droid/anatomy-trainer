name: Minuta v142 integration contour safe release
run-name: Minuta v142 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v142
        required: true
        default: test-v142
        type: choice
        options: [test-v142, validate-production-v142, apply-production-v142, observe-production-v142]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v142 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v142 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v142 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: "${{ inputs.phase == 'test-v142' && 'minuta-test-database' || 'minuta-production-database' }}", cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env:
          SHA: ${{ inputs.commit_sha }}
          PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v142|validate-production-v142|observe-production-v142) ;;
            apply-production-v142) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - run: node minuta-online-booking/integration-contour-v142-static-test.mjs
      - run: node --test minuta-online-booking/tests/primetime-integration-edge-test.mjs minuta-online-booking/tests/primetime-webhook-dispatcher-test.mjs
      - run: deno check supabase/functions/primetime-integration-api/index.ts supabase/functions/primetime-webhook-dispatcher/index.ts

  test-v142:
    if: inputs.phase == 'test-v142'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply twice, test isolation, rollback and reapply
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v142.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v142.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/integration-contour-v142-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v142-rollback.sql
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.integration_connections_v142') is null")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v142.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/integration-contour-v142-integration.sql
      - name: Create isolated test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v142.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v142-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v142",commitSha:$sha,runId:$run,isolatedDatabase:true,
              cycle:["apply","apply","authorization","tenant-isolation","idempotency","revision-guards","webhook-outbox","rollback","reapply"],
              migrationSha256:$migration,rollbackSha256:$rollback,productionWritten:false,realIntegrationsEnabled:false}' \
            > "$RUNNER_TEMP/v142-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v142-test-${{ github.run_id }}", path: "${{ runner.temp }}/v142-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v142:
    if: inputs.phase == 'validate-production-v142'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate production prerequisites and v142 state read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          with flags as(select
            to_regclass('public.organizations') is not null
              and to_regclass('public.organization_memberships') is not null
              and to_regclass('public.locations') is not null
              and to_regclass('public.services') is not null
              and to_regclass('public.bookings') is not null
              and to_regclass('public.notification_outbox') is not null
              and to_regprocedure('public.cancel_minuta_booking_core(uuid,text,text)') is not null prerequisites_ready,
            to_regclass('public.integration_connections_v142') is not null connections_table,
            to_regclass('public.integration_api_keys_v142') is not null keys_table,
            to_regclass('public.integration_rate_limits_v142') is not null limits_table,
            to_regclass('public.integration_booking_revisions_v142') is not null revisions_table,
            to_regclass('public.integration_calendar_events_v142') is not null events_table,
            to_regclass('public.integration_request_receipts_v142') is not null receipts_table,
            to_regclass('public.integration_webhook_subscriptions_v142') is not null subscriptions_table,
            to_regclass('public.integration_webhook_outbox_v142') is not null outbox_table,
            to_regprocedure('public.configure_minuta_integration_connection_v142(uuid,uuid,text,text,text,boolean)') is not null configure_rpc,
            to_regprocedure('public.authenticate_minuta_integration_key_v142(uuid,text,text,text)') is not null authenticate_rpc,
            to_regprocedure('public.get_minuta_integration_calendar_v142(uuid,timestamptz,timestamptz,integer,timestamptz,uuid)') is not null read_rpc,
            to_regprocedure('public.upsert_minuta_integration_calendar_event_v142(uuid,text,text,text,uuid,uuid,timestamptz,timestamptz,text,text)') is not null write_rpc,
            to_regprocedure('public.lease_minuta_integration_webhooks_v142(integer,uuid)') is not null lease_rpc,
            to_regprocedure('public.settle_minuta_integration_webhook_v142(uuid,uuid,text,integer,text)') is not null settle_rpc)
          select json_build_object('prerequisitesReady',prerequisites_ready,'mode',case
            when prerequisites_ready and not connections_table and not keys_table and not limits_table and not revisions_table
              and not events_table and not receipts_table and not subscriptions_table and not outbox_table
              and not configure_rpc and not authenticate_rpc and not read_rpc and not write_rpc and not lease_rpc and not settle_rpc then 'ready'
            when prerequisites_ready and connections_table and keys_table and limits_table and revisions_table
              and events_table and receipts_table and subscriptions_table and outbox_table
              and configure_rpc and authenticate_rpc and read_rpc and write_rpc and lease_rpc and settle_rpc then 'full'
            else 'partial' end) from flags;
          rollback;
          SQL
          )"
          state="$(grep '^{' <<<"$state"|tail -n 1)"
          jq -e '.prerequisitesReady and (.mode=="ready" or .mode=="full")' <<<"$state" >/dev/null
          if test "$(jq -r .mode <<<"$state")" = full; then
            counts="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('connections',count(*),'enabledConnections',count(*) filter(where enabled)) from public.integration_connections_v142")"
            jq -e '.connections==0 and .enabledConnections==0' <<<"$counts" >/dev/null
            state="$(jq --argjson counts "$counts" '. + {rowCounts:$counts}' <<<"$state")"
          fi
          jq -n --arg sha "$SHA" --argjson state "$state" \
            '{status:"success",phase:"validate-production-v142",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' \
            > "$RUNNER_TEMP/v142-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v142-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v142-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v142:
    if: inputs.phase == 'apply-production-v142'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify isolated test, validation, encrypted backup and linked restore
        env:
          SHA: ${{ inputs.commit_sha }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v142-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v142-integration-contour.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v142-test-$TEST" -D "$RUNNER_TEMP/v142-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and (.productionWritten|not) and (.realIntegrationsEnabled|not)' "$RUNNER_TEMP/v142-evidence/test/v142-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v142-integration-contour.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v142-validation-$VALIDATION" -D "$RUNNER_TEMP/v142-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and (.state.mode=="ready" or .state.mode=="full")' "$RUNNER_TEMP/v142-evidence/validation/v142-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"; [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v142-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v142-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v142-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v142-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v142-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v142 and verify the contour remains empty and disabled
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v142.sql
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('ready',to_regclass('public.integration_booking_revisions_v142') is not null and to_regprocedure('public.touch_minuta_integration_booking_revision_v142()') is not null and to_regprocedure('public.configure_minuta_integration_connection_v142(uuid,uuid,text,text,text,boolean)') is not null and to_regprocedure('public.get_minuta_integration_calendar_v142(uuid,timestamptz,timestamptz,integer,timestamptz,uuid)') is not null and to_regprocedure('public.lease_minuta_integration_webhooks_v142(integer,uuid)') is not null,'connections',count(*),'enabledConnections',count(*) filter(where enabled)) from public.integration_connections_v142")"
          jq -e '.ready and .connections==0 and .enabledConnections==0' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" \
            '{status:"success",phase:"apply-production-v142",commitSha:$sha,state:$state,productionWritten:true,businessRowsChanged:false,realIntegrationsEnabled:false,secretsExposed:false}' \
            > "$RUNNER_TEMP/v142-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v142-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v142-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v142:
    if: inputs.phase == 'observe-production-v142'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply evidence and observe v142 read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v142-integration-contour.yml
          mkdir -p "$RUNNER_TEMP/v142-apply-evidence"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v142-apply-$APPLY" -D "$RUNNER_TEMP/v142-apply-evidence"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .productionWritten and (.businessRowsChanged|not) and (.realIntegrationsEnabled|not)' "$RUNNER_TEMP/v142-apply-evidence/v142-apply.json" >/dev/null
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('ready',to_regclass('public.integration_booking_revisions_v142') is not null and to_regprocedure('public.touch_minuta_integration_booking_revision_v142()') is not null and to_regprocedure('public.configure_minuta_integration_connection_v142(uuid,uuid,text,text,text,boolean)') is not null and to_regprocedure('public.get_minuta_integration_calendar_v142(uuid,timestamptz,timestamptz,integer,timestamptz,uuid)') is not null and to_regprocedure('public.lease_minuta_integration_webhooks_v142(integer,uuid)') is not null,'connections',count(*),'enabledConnections',count(*) filter(where enabled)) from public.integration_connections_v142")"
          jq -e '.ready and .connections==0 and .enabledConnections==0' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --arg apply "$APPLY" --argjson state "$state" \
            '{status:"success",phase:"observe-production-v142",commitSha:$sha,applyRunId:$apply,readOnly:true,productionWritten:false,realIntegrationsEnabled:false,state:$state}' \
            > "$RUNNER_TEMP/v142-observe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v142-observe-${{ github.run_id }}", path: "${{ runner.temp }}/v142-observe.json", if-no-files-found: error, retention-days: 90 }
