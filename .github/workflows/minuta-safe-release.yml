  production-migration:
    if: inputs.phase == 'production-migration' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: minuta-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Подтвердить test-migration, свежий backup и откатываемую проверку совместимого commit
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTA_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          MINUTA_VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          MINUTA_TEST_RUN_ID: ${{ inputs.test_run_id }}
          MINUTA_MIGRATION_TARGET: ${{ inputs.migration_target }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MINUTA_BACKUP_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$MINUTA_VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$MINUTA_TEST_RUN_ID" =~ ^[0-9]+$ ]]
          check_run() {
            local run_id="$1" expected_path="$2" expected_title="$3" max_age="$4" scope="$5" expected_job="$6"
            local run_json jobs_json run_sha created now
            run_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
            run_sha="$(jq -r '.head_sha' <<<"$run_json")"
            test "$run_sha" = "$GITHUB_SHA"
            test "$(jq -r '.path' <<<"$run_json")" = "$expected_path"
            jq -er --arg title "$expected_title" '.display_title | contains($title)' <<<"$run_json" >/dev/null
            test "$(jq -r '.head_branch' <<<"$run_json")" = "main"
            jobs_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            jq -e --arg job "$expected_job" \
              '[.jobs[] | select(.name==$job and .conclusion=="success")] | length==1' \
              <<<"$jobs_json" >/dev/null
            created="$(date -u -d "$(jq -r '.created_at' <<<"$run_json")" +%s)"
            now="$(date -u +%s)"
            test "$((now-created))" -le "$max_age"
          }
          check_run "$MINUTA_BACKUP_RUN_ID" ".github/workflows/minuta-supabase-backup.yml" "Minuta Supabase encrypted backup" 21600 backup backup
          check_run "$MINUTA_VALIDATION_RUN_ID" ".github/workflows/minuta-safe-release.yml" "validate-production-rollback — $MINUTA_MIGRATION_TARGET" 21600 validation validate-production-rollback
          check_run "$MINUTA_TEST_RUN_ID" ".github/workflows/minuta-safe-release.yml" "test-migration — $MINUTA_MIGRATION_TARGET" 21600 test test-migration
          artifacts="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
