name: Minuta safe release gate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Этап безопасного выпуска
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - test-migration
          - production-migration
          - diagnose-client-links
          - observe-production
      expected_version:
        description: Ожидаемая версия ресурсов; пусто — определить автоматически
        required: false
        default: ""
        type: string
      observation_minutes:
        description: Длительность наблюдения production
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "60"
      backup_confirm:
        description: Для production-migration введите BACKUP_VERIFIED после проверки свежей копии
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: minuta-safe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Проверить JavaScript, уведомления и платёжные границы
        run: |
          node --check minuta-online-booking/scripts/migration-config-guard.mjs
          node --check minuta-online-booking/scripts/migration-safety-guard.mjs
          node --check minuta-online-booking/notification-outbox-static-test.mjs
          node --check minuta-online-booking/payment-foundation-static-test.mjs
          node --check minuta-online-booking/provider-delete-v64-static-test.mjs
          node --check minuta-online-booking/multi-tenant-v65-static-test.mjs
          node --check minuta-online-booking/multi-tenant-v66-static-test.mjs
          node --check minuta-online-booking/multi-tenant-v67-static-test.mjs
          node --check minuta-online-booking/multi-tenant-v68-static-test.mjs
          node --check minuta-online-booking/multi-tenant-v69-static-test.mjs
          node --check minuta-online-booking/multi-tenant-v70-static-test.mjs
          node --check minuta-online-booking/multi-tenant-v71-static-test.mjs
          node --check minuta-online-booking/organization.js
          node --check minuta-online-booking/team-calendar.js
          node --check minuta-online-booking/resource-management.js
          node --check minuta-online-booking/shift-management.js
          node --check minuta-online-booking/resource-management-controller-test.mjs
          node --check supabase/functions/payment-webhook/index.ts
          node --check supabase/functions/payment-webhook/provider-adapter.ts
          deno check supabase/functions/process-notifications/index.ts
          deno check supabase/functions/payment-webhook/index.ts
          deno check minuta-online-booking/supabase/functions/telegram-client-notify/index.ts
          node minuta-online-booking/notification-outbox-static-test.mjs
          node minuta-online-booking/payment-foundation-static-test.mjs
          node minuta-online-booking/provider-delete-v64-static-test.mjs
          node minuta-online-booking/multi-tenant-v65-static-test.mjs
          node minuta-online-booking/multi-tenant-v66-static-test.mjs
          node minuta-online-booking/multi-tenant-v67-static-test.mjs
          node minuta-online-booking/multi-tenant-v68-static-test.mjs
          node minuta-online-booking/multi-tenant-v69-static-test.mjs
          node minuta-online-booking/multi-tenant-v70-static-test.mjs
          node minuta-online-booking/multi-tenant-v71-static-test.mjs
          node minuta-online-booking/organization-controller-test.mjs
          node minuta-online-booking/team-calendar-controller-test.mjs
          node minuta-online-booking/resource-management-controller-test.mjs
          bash -n minuta-online-booking/multi-tenant-v69-concurrency-test.sh
          node minuta-online-booking/scripts/migration-safety-guard.mjs
          node minuta-online-booking/scripts/package4-static-test.mjs
          node minuta-online-booking/smoke-test.mjs

  test-migration:
    if: inputs.phase == 'test-migration'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Установить клиент PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Запретить миграцию production
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
        shell: bash
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          guard_count="$(psql "$MINUTA_TEST_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --set=expected_ref="$MINUTA_TEST_PROJECT_REF" \
            --tuples-only --no-align <<'SQL'
          select count(*)
          from minuta_migration_guard.target
          where project_ref = :'expected_ref'
            and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$guard_count")" = "1"
      - name: Применить миграции к отдельной тестовой базе
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v46.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v47.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v48.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v49.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v50.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v51.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v52.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v53.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v54.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v55.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v56.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v57.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v58.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v60.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v62.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v63.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v61.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v64.sql
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.resource_groups') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-resource-scheduling-v69.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.get_minuta_team_calendar(uuid,date,date,uuid,uuid)') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-team-calendar-v68.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.get_public_minuta_catalog(text)') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-multi-tenant-v67.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_invitations') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-multi-tenant-v66.sql
          fi
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/recovery/rollback-multi-tenant-v65.sql
          legacy_snapshot="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|', (select count(*) from public.performer_profiles), (select md5(coalesce(string_agg(to_jsonb(profile)::text, ',' order by profile.id), '')) from public.performer_profiles profile), (select count(*) from public.services), (select md5(coalesce(string_agg(to_jsonb(service)::text, ',' order by service.id), '')) from public.services service), (select count(*) from public.bookings), (select md5(coalesce(string_agg(to_jsonb(booking)::text, ',' order by booking.id), '')) from public.bookings booking), (select count(*) from public.provider_schedule), (select md5(coalesce(string_agg(to_jsonb(schedule)::text, ',' order by schedule.performer_id, schedule.weekday), '')) from public.provider_schedule schedule));")"
          test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select count(*) > 0 from public.performer_profiles;")" = "t"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v65.sql
          v65_snapshot="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|', (select md5(coalesce(string_agg(to_jsonb(organization)::text, ',' order by organization.id), '')) from public.organizations organization), (select md5(coalesce(string_agg(to_jsonb(location)::text, ',' order by location.id), '')) from public.locations location), (select md5(coalesce(string_agg(to_jsonb(membership)::text, ',' order by membership.organization_id, membership.user_id), '')) from public.organization_memberships membership));")"
          legacy_snapshot_after="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|', (select count(*) from public.performer_profiles), (select md5(coalesce(string_agg(to_jsonb(profile)::text, ',' order by profile.id), '')) from public.performer_profiles profile), (select count(*) from public.services), (select md5(coalesce(string_agg(to_jsonb(service)::text, ',' order by service.id), '')) from public.services service), (select count(*) from public.bookings), (select md5(coalesce(string_agg(to_jsonb(booking)::text, ',' order by booking.id), '')) from public.bookings booking), (select count(*) from public.provider_schedule), (select md5(coalesce(string_agg(to_jsonb(schedule)::text, ',' order by schedule.performer_id, schedule.weekday), '')) from public.provider_schedule schedule));")"
          test "$legacy_snapshot" = "$legacy_snapshot_after"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v65.sql
          v65_snapshot_after="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|', (select md5(coalesce(string_agg(to_jsonb(organization)::text, ',' order by organization.id), '')) from public.organizations organization), (select md5(coalesce(string_agg(to_jsonb(location)::text, ',' order by location.id), '')) from public.locations location), (select md5(coalesce(string_agg(to_jsonb(membership)::text, ',' order by membership.organization_id, membership.user_id), '')) from public.organization_memberships membership));")"
          test "$v65_snapshot" = "$v65_snapshot_after"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/multi-tenant-v65-integration.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v66.sql
          v66_snapshot="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|', (select md5(coalesce(string_agg(to_jsonb(invitation)::text, ',' order by invitation.id), '')) from public.organization_invitations invitation), (select md5(coalesce(string_agg(to_jsonb(audit)::text, ',' order by audit.id), '')) from public.organization_audit_log audit), (select md5(coalesce(string_agg(to_jsonb(organization)::text, ',' order by organization.id), '')) from public.organizations organization), (select md5(coalesce(string_agg(to_jsonb(location)::text, ',' order by location.id), '')) from public.locations location), (select md5(coalesce(string_agg(to_jsonb(membership)::text, ',' order by membership.organization_id, membership.user_id), '')) from public.organization_memberships membership));")"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v66.sql
          v66_snapshot_after="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|', (select md5(coalesce(string_agg(to_jsonb(invitation)::text, ',' order by invitation.id), '')) from public.organization_invitations invitation), (select md5(coalesce(string_agg(to_jsonb(audit)::text, ',' order by audit.id), '')) from public.organization_audit_log audit), (select md5(coalesce(string_agg(to_jsonb(organization)::text, ',' order by organization.id), '')) from public.organizations organization), (select md5(coalesce(string_agg(to_jsonb(location)::text, ',' order by location.id), '')) from public.locations location), (select md5(coalesce(string_agg(to_jsonb(membership)::text, ',' order by membership.organization_id, membership.user_id), '')) from public.organization_memberships membership));")"
          test "$v66_snapshot" = "$v66_snapshot_after"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/multi-tenant-v66-integration.sql
          bash minuta-online-booking/multi-tenant-v66-concurrency-test.sh
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v67.sql
          protected_booking_rpcs_before="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select md5(string_agg(pg_get_functiondef(p.oid) || coalesce(p.proacl::text,''), E'\\n' order by p.oid::regprocedure::text)) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.oid in ('public.provider_delete_booking(uuid)'::regprocedure,'public.book_appointment(uuid,uuid,date,time without time zone,text,text)'::regprocedure,'public.get_available_slots(uuid,date,date,uuid)'::regprocedure));")"
          v67_definition="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select md5(pg_get_functiondef('public.get_public_minuta_catalog(text)'::regprocedure));")"
          v67_org_snapshot="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|', public_booking_enabled::text, updated_at::text) from public.organizations where public_slug='minuta-abeb5b13ca1d45c6a2adb0e4119b2e1f';")"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v67.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v68.sql
          v68_snapshot="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|',(select md5(coalesce(string_agg(to_jsonb(booking)::text,',' order by booking.id),'')) from public.bookings booking),(select md5(pg_get_functiondef('public.get_minuta_team_calendar(uuid,date,date,uuid,uuid)'::regprocedure))),(select md5(pg_get_functiondef('public.book_minuta_appointment(uuid,text,uuid,uuid,date,time without time zone,text,text)'::regprocedure))));")"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v68.sql
          v68_snapshot_after="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|',(select md5(coalesce(string_agg(to_jsonb(booking)::text,',' order by booking.id),'')) from public.bookings booking),(select md5(pg_get_functiondef('public.get_minuta_team_calendar(uuid,date,date,uuid,uuid)'::regprocedure))),(select md5(pg_get_functiondef('public.book_minuta_appointment(uuid,text,uuid,uuid,date,time without time zone,text,text)'::regprocedure))));")"
          test "$v68_snapshot" = "$v68_snapshot_after"
          protected_booking_rpcs_after="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select md5(string_agg(pg_get_functiondef(p.oid) || coalesce(p.proacl::text,''), E'\\n' order by p.oid::regprocedure::text)) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.oid in ('public.provider_delete_booking(uuid)'::regprocedure,'public.book_appointment(uuid,uuid,date,time without time zone,text,text)'::regprocedure,'public.get_available_slots(uuid,date,date,uuid)'::regprocedure));")"
          test "$protected_booking_rpcs_before" = "$protected_booking_rpcs_after"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/multi-tenant-v68-integration.sql
          bash minuta-online-booking/multi-tenant-v68-concurrency-test.sh
          v68_contract_before_v69="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|',(select md5(coalesce(string_agg(to_jsonb(booking)::text,',' order by booking.id),'')) from public.bookings booking),(select md5(string_agg(pg_get_functiondef(p.oid)||coalesce(p.proacl::text,''),E'\\n' order by p.oid::regprocedure::text)) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.oid in ('public.get_minuta_team_calendar(uuid,date,date,uuid,uuid)'::regprocedure,'public.book_minuta_appointment(uuid,text,uuid,uuid,date,time without time zone,text,text)'::regprocedure,'public.get_public_minuta_catalog_v2(text)'::regprocedure,'public.provider_delete_booking(uuid)'::regprocedure,'public.book_appointment(uuid,uuid,date,time without time zone,text,text)'::regprocedure,'public.get_available_slots(uuid,date,date,uuid)'::regprocedure))); ")"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v69.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v70.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select to_regclass('public.client_avatars') is not null and (select relrowsecurity from pg_class where oid='public.client_avatars'::regclass) and not has_table_privilege('anon','public.client_avatars','SELECT') and has_table_privilege('authenticated','public.client_avatars','SELECT') and exists(select 1 from storage.buckets where id='client-avatars' and not public and file_size_limit=2097152 and allowed_mime_types=array['image/webp']);" \
            | grep -qx t
          v69_snapshot="$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select concat_ws('|',(select md5(coalesce(string_agg(to_jsonb(resource_group)::text,',' order by resource_group.id),'')) from public.resource_groups resource_group),(select md5(coalesce(string_agg(to_jsonb(resource)::text,',' order by resource.id),'')) from public.resources resource),(select md5(coalesce(string_agg(to_jsonb(requirement)::text,',' order by requirement.organization_id,requirement.service_id,requirement.group_id),'')) from public.service_resource_requirements requirement),(select md5(coalesce(string_agg(to_jsonb(allocation)::text,',' order by allocation.booking_id,allocation.resource_id),'')) from public.booking_resource_allocations allocation),(select md5(coalesce(string_agg(to_jsonb(audit)::text,',' order by audit.id),'')) from public.resource_audit_log audit),(select md5(string_agg(pg_get_functiondef(p.oid)||coalesce(p.proacl::text,''),E'\\n' order by p.oid::regprocedure::text)) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('require_minuta_resource_manager','write_minuta_resource_audit','allocate_minuta_booking_resources','sync_minuta_booking_resources','get_minuta_resource_workspace','create_minuta_resource_group','update_minuta_resource_group','create_minuta_resource','update_minuta_resource','replace_minuta_service_resource_requirements','get_public_minuta_available_slots_v3','get_public_minuta_catalog_v3','get_minuta_team_calendar_v2','get_reschedule_slots_v3')),(select md5(string_agg(pg_get_constraintdef(constraint.oid),E'\\n' order by constraint.conname)) from pg_constraint constraint where constraint.conname in ('bookings_id_organization_location_key','booking_resources_active_no_overlap')),(select md5(string_agg(policy.polqual::text||coalesce(policy.polwithcheck::text,''),E'\\n' order by policy.polname)) from pg_policy policy where policy.polrelid in ('public.resource_groups'::regclass,'public.resources'::regclass,'public.service_resource_requirements'::regclass,'public.booking_resource_allocations'::regclass,'public.resource_audit_log'::regclass))); ")"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
