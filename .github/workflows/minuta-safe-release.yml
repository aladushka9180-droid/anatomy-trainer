name: Minuta safe release gate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Этап безопасного выпуска
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - test-migration
          - production-migration
          - diagnose-client-links
          - observe-production
      expected_version:
        description: Ожидаемая версия опубликованных ресурсов
        required: true
        default: "88"
        type: string
      observation_minutes:
        description: Длительность наблюдения production
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "60"

permissions:
  contents: read

concurrency:
  group: minuta-safe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Проверить JavaScript, уведомления и платёжные границы
        run: |
          node --check minuta-online-booking/scripts/migration-config-guard.mjs
          node --check minuta-online-booking/notification-outbox-static-test.mjs
          node --check minuta-online-booking/payment-foundation-static-test.mjs
          node --check supabase/functions/payment-webhook/index.ts
          node --check supabase/functions/payment-webhook/provider-adapter.ts
          deno check supabase/functions/process-notifications/index.ts
          deno check supabase/functions/payment-webhook/index.ts
          deno check minuta-online-booking/supabase/functions/telegram-client-notify/index.ts
          node minuta-online-booking/notification-outbox-static-test.mjs
          node minuta-online-booking/payment-foundation-static-test.mjs
          node minuta-online-booking/scripts/package4-static-test.mjs
          node minuta-online-booking/smoke-test.mjs

  test-migration:
    if: inputs.phase == 'test-migration'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Установить клиент PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Запретить миграцию production
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
        shell: bash
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          guard_count="$(psql "$MINUTA_TEST_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --set=expected_ref="$MINUTA_TEST_PROJECT_REF" \
            --tuples-only --no-align <<'SQL'
          select count(*)
          from minuta_migration_guard.target
          where project_ref = :'expected_ref'
            and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$guard_count")" = "1"
      - name: Применить миграции к отдельной тестовой базе
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v46.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v47.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v48.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v49.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v50.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v51.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v52.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v53.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v54.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v55.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v56.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v60.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v62.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v63.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v61.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select to_regclass('public.notification_outbox') is not null and to_regclass('public.payments') is not null and to_regclass('public.payment_events') is not null and to_regclass('public.client_labels') is not null and to_regclass('public.booking_session_items') is not null and to_regclass('public.booking_session_revisions') is not null and to_regclass('public.client_accounts') is not null and to_regclass('public.client_device_sessions') is not null and exists (select 1 from information_schema.columns where table_schema='public' and table_name='client_labels' and column_name='favorite_note') and exists (select 1 from information_schema.columns where table_schema='public' and table_name='client_labels' and column_name='vip_note') and exists (select 1 from information_schema.columns where table_schema='public' and table_name='booking_policies' and column_name='auto_complete_visits') and exists (select 1 from information_schema.columns where table_schema='public' and table_name='booking_outcomes' and column_name='completion_source') and exists (select 1 from information_schema.columns where table_schema='public' and table_name='bookings' and column_name='total_price_rub') and exists (select 1 from information_schema.columns where table_schema='public' and table_name='bookings' and column_name='client_account_id') and to_regprocedure('public.process_payment_webhook(text,text,text,text,text,bigint,text,timestamp with time zone,text)') is not null and to_regprocedure('public.set_booking_note(uuid,text)') is not null and to_regprocedure('public.save_booking_session(uuid,jsonb)') is not null and to_regprocedure('public.login_client_access(text,text,text)') is not null and to_regprocedure('public.get_client_bookings(text)') is not null;" \
            | grep -qx t
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select to_regclass('public.booking_reviews') is not null and to_regprocedure('public.provider_delete_booking(uuid)') is not null and to_regprocedure('public.submit_booking_review(text,uuid,integer,text)') is not null and to_regprocedure('public.get_client_bookings_v2(text)') is not null and to_regprocedure('public.get_public_booking_reviews()') is not null and to_regprocedure('public.get_provider_booking_reviews()') is not null and to_regprocedure('public.set_booking_review_published(uuid,boolean)') is not null;" \
            | grep -qx t

  production-migration:
    if: inputs.phase == 'production-migration'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Установить клиент PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Применить миграции production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          case "$SUPABASE_DB_URL" in
            *cawexmmrqjvothcbgjxr*) ;;
            *) echo "Строка подключения не соответствует production проекту" >&2; exit 1 ;;
          esac
          MIGRATION_DB_URL="${SUPABASE_DB_URL/:6543/:5432}"
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v54.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v55.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v56.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v57.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v60.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v62.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v63.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v61.sql
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config(
            'request.jwt.claim.sub',
            (select performer_id::text from public.bookings order by created_at desc limit 1),
            true
          );
          set local role authenticated;
          select public.provider_delete_booking(
            (select id from public.bookings where performer_id = auth.uid() order by created_at desc limit 1)
          );
          rollback;
          SQL
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select to_regclass('public.client_accounts') is not null and to_regclass('public.client_device_sessions') is not null and exists (select 1 from information_schema.columns where table_schema='public' and table_name='booking_outcomes' and column_name='actual_duration_minutes') and exists (select 1 from information_schema.columns where table_schema='public' and table_name='booking_outcomes' and column_name='calculated_amount_rub') and to_regprocedure('public.bootstrap_client_access(uuid,text)') is not null and to_regprocedure('public.login_client_access(text,text,text)') is not null and to_regprocedure('public.get_client_bookings(text)') is not null;" \
            | grep -qx t
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select to_regclass('public.booking_reviews') is not null and to_regprocedure('public.provider_delete_booking(uuid)') is not null and to_regprocedure('public.submit_booking_review(text,uuid,integer,text)') is not null and to_regprocedure('public.get_client_bookings_v2(text)') is not null and to_regprocedure('public.get_public_booking_reviews()') is not null and to_regprocedure('public.get_provider_booking_reviews()') is not null and to_regprocedure('public.set_booking_review_published(uuid,boolean)') is not null;" \
            | grep -qx t

  diagnose-client-links:
    if: inputs.phase == 'diagnose-client-links'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Установить клиент PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Проверить связи клиентских записей без персональных данных
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          case "$SUPABASE_DB_URL" in
            *cawexmmrqjvothcbgjxr*) ;;
            *) echo "Строка подключения не соответствует production проекту" >&2; exit 1 ;;
          esac
          MIGRATION_DB_URL="${SUPABASE_DB_URL/:6543/:5432}"
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 -X -P pager=off <<'SQL'
          select
            count(*) as bookings_total,
            count(*) filter (where client_phone <> '0000000000') as eligible_phone_total,
            count(*) filter (where client_account_id is not null) as linked_total,
            count(*) filter (
              where client_account_id is null
                and client_phone <> '0000000000'
                and public.normalize_client_phone(client_phone) ~ '^7[0-9]{10}$'
            ) as linkable_unlinked_total
          from public.bookings;

          select
            count(*) as accounts_total,
            count(*) filter (where linked_bookings = 0) as accounts_without_bookings,
            count(*) filter (where matching_bookings > linked_bookings) as accounts_with_missing_links,
            coalesce(sum(linked_bookings), 0) as linked_bookings_total,
            coalesce(sum(matching_bookings), 0) as matching_bookings_total
          from (
            select
              account.id,
              count(booking.id) filter (where booking.client_account_id = account.id) as linked_bookings,
              count(booking.id) filter (
                where booking.client_phone <> '0000000000'
                  and public.normalize_client_phone(booking.client_phone) = account.normalized_phone
              ) as matching_bookings
            from public.client_accounts account
            left join public.bookings booking
              on booking.client_account_id = account.id
              or (
                booking.client_account_id is null
                and booking.client_phone <> '0000000000'
                and public.normalize_client_phone(booking.client_phone) = account.normalized_phone
              )
            group by account.id
          ) diagnostics;

          select count(*) as mismatched_links_total
          from public.bookings booking
          join public.client_accounts account on account.id = booking.client_account_id
          where public.normalize_client_phone(booking.client_phone) is distinct from account.normalized_phone;

          select
            count(*) as active_sessions_total,
            count(distinct session.client_account_id) as accounts_with_active_sessions,
            count(*) filter (where linked.id is null) as active_sessions_without_linked_bookings
          from public.client_device_sessions session
          left join lateral (
            select booking.id
            from public.bookings booking
            where booking.client_account_id = session.client_account_id
            limit 1
          ) linked on true
          where session.revoked_at is null
            and session.expires_at > now();

          begin;
          create temporary table client_rpc_diagnostics (
            client_account_id uuid primary key,
            session_token text not null
          ) on commit drop;
          insert into client_rpc_diagnostics (client_account_id, session_token)
          select account.id, encode(digest('client-rpc-diagnostic:' || account.id::text, 'sha256'), 'hex')
          from public.client_accounts account;
          insert into public.client_device_sessions (client_account_id, token_hash, device_name, expires_at)
          select diagnostic.client_account_id,
                 encode(digest(diagnostic.session_token, 'sha256'), 'hex'),
                 'production-diagnostic',
                 now() + interval '5 minutes'
          from client_rpc_diagnostics diagnostic;
          select
            count(*) as rpc_accounts_tested,
            count(*) filter (where expected.rows <> actual.rows) as rpc_account_mismatches,
            coalesce(sum(expected.rows), 0) as rpc_expected_rows,
            coalesce(sum(actual.rows), 0) as rpc_actual_rows
          from client_rpc_diagnostics diagnostic
          cross join lateral (
            select count(*) as rows
            from public.bookings booking
            where booking.client_account_id = diagnostic.client_account_id
          ) expected
          cross join lateral (
            select count(*) as rows
            from public.get_client_bookings(diagnostic.session_token)
          ) actual;
          rollback;
          SQL

  observe-production:
    if: inputs.phase == 'observe-production'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Наблюдать production без записи данных
        env:
          MINUTA_EXPECT_VERSION: ${{ inputs.expected_version }}
          MINUTA_EXPECT_IDEMPOTENCY: "1"
          OBSERVATION_MINUTES: ${{ inputs.observation_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          checks=$((OBSERVATION_MINUTES / 5))
          for ((attempt=1; attempt<=checks; attempt++)); do
            node minuta-online-booking/production-health-check.mjs
            if [ "$attempt" -lt "$checks" ]; then sleep 300; fi
          done
