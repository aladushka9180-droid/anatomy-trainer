name: Minuta safe release gate
run-name: Minuta safe release — ${{ inputs.phase }} — ${{ inputs.migration_target }} — ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Этап безопасного выпуска
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - test-migration
          - validate-production-rollback
          - production-migration
          - diagnose-client-links
          - observe-production
      expected_version:
        description: Ожидаемая версия ресурсов; пусто — определить автоматически
        required: false
        default: ""
        type: string
      observation_minutes:
        description: Длительность наблюдения production
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "60"
      backup_confirm:
        description: Для production-migration введите BACKUP_VERIFIED после проверки свежей копии
        required: false
        default: ""
        type: string
      backup_run_id:
        description: ID успешного свежего запуска Minuta Supabase encrypted backup на этом commit
        required: false
        default: ""
        type: string
      validation_run_id:
        description: ID успешной validate-production-rollback на этом commit
        required: false
        default: ""
        type: string
      test_run_id:
        description: ID успешной test-migration на этом commit
        required: false
        default: ""
        type: string
      migration_target:
        description: Последний слой схемы для production-migration
        required: true
        default: latest
        type: choice
        options:
          - latest
          - employee-analytics-v97
          - client-avatars-v70

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.phase == 'test-migration' && 'minuta-test-database' || 'minuta-production-database' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Запретить доступ к production не из main
        env:
          MINUTA_PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MINUTA_PHASE" in
            validate-production-rollback|production-migration|diagnose-client-links|observe-production)
              test "$GITHUB_REF" = "refs/heads/main"
              ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Проверить JavaScript, уведомления и платёжные границы
        run: |
          node --check minuta-online-booking/scripts/migration-config-guard.mjs
          node --check minuta-online-booking/scripts/migration-safety-guard.mjs
          node --check minuta-online-booking/notification-outbox-static-test.mjs
