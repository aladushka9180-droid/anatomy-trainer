          node minuta-online-booking/readiness-v78-static-test.mjs
          node minuta-online-booking/recurring-series-v79-static-test.mjs
          node minuta-online-booking/loyalty-v81-static-test.mjs
          node minuta-online-booking/inventory-v82-static-test.mjs
          node minuta-online-booking/retention-v83-static-test.mjs
