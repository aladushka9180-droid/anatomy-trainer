  diagnose-client-links:
    if: inputs.phase == 'diagnose-client-links' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: minuta-production
    steps:
      - name: Установить клиент PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Проверить связи клиентских записей без персональных данных
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          case "$SUPABASE_DB_URL" in
            *cawexmmrqjvothcbgjxr*) ;;
            *) echo "Строка подключения не соответствует production проекту" >&2; exit 1 ;;
          esac
          MIGRATION_DB_URL="${SUPABASE_DB_URL/:6543/:5432}"
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 -X -P pager=off <<'SQL'
          select
            count(*) as bookings_total,
            count(*) filter (where client_phone <> '0000000000') as eligible_phone_total,
            count(*) filter (where client_account_id is not null) as linked_total,
            count(*) filter (
              where client_account_id is null
                and client_phone <> '0000000000'
                and public.normalize_client_phone(client_phone) ~ '^7[0-9]{10}$'
            ) as linkable_unlinked_total
          from public.bookings;

          select
            count(*) as accounts_total,
            count(*) filter (where linked_bookings = 0) as accounts_without_bookings,
            count(*) filter (where matching_bookings > linked_bookings) as accounts_with_missing_links,
            coalesce(sum(linked_bookings), 0) as linked_bookings_total,
            coalesce(sum(matching_bookings), 0) as matching_bookings_total
          from (
            select
              account.id,
              count(booking.id) filter (where booking.client_account_id = account.id) as linked_bookings,
              count(booking.id) filter (
                where booking.client_phone <> '0000000000'
                  and public.normalize_client_phone(booking.client_phone) = account.normalized_phone
              ) as matching_bookings
            from public.client_accounts account
            left join public.bookings booking
              on booking.client_account_id = account.id
              or (
                booking.client_account_id is null
                and booking.client_phone <> '0000000000'
                and public.normalize_client_phone(booking.client_phone) = account.normalized_phone
              )
            group by account.id
          ) diagnostics;

          select count(*) as mismatched_links_total
          from public.bookings booking
          join public.client_accounts account on account.id = booking.client_account_id
          where public.normalize_client_phone(booking.client_phone) is distinct from account.normalized_phone;

          select
            count(*) as active_sessions_total,
            count(distinct session.client_account_id) as accounts_with_active_sessions,
            count(*) filter (where linked.id is null) as active_sessions_without_linked_bookings
          from public.client_device_sessions session
          left join lateral (
            select booking.id
            from public.bookings booking
            where booking.client_account_id = session.client_account_id
            limit 1
          ) linked on true
          where session.revoked_at is null
            and session.expires_at > now();

          begin;
          create temporary table client_rpc_diagnostics (
            client_account_id uuid primary key,
            session_token text not null
          ) on commit drop;
          insert into client_rpc_diagnostics (client_account_id, session_token)
          select account.id, encode(digest('client-rpc-diagnostic:' || account.id::text, 'sha256'), 'hex')
          from public.client_accounts account;
          insert into public.client_device_sessions (client_account_id, token_hash, device_name, expires_at)
          select diagnostic.client_account_id,
                 encode(digest(diagnostic.session_token, 'sha256'), 'hex'),
                 'production-diagnostic',
                 now() + interval '5 minutes'
          from client_rpc_diagnostics diagnostic;
          select
            count(*) as rpc_accounts_tested,
            count(*) filter (where expected.rows <> actual.rows) as rpc_account_mismatches,
            coalesce(sum(expected.rows), 0) as rpc_expected_rows,
            coalesce(sum(actual.rows), 0) as rpc_actual_rows
          from client_rpc_diagnostics diagnostic
          cross join lateral (
            select count(*) as rows
            from public.bookings booking
            where booking.client_account_id = diagnostic.client_account_id
          ) expected
          cross join lateral (
            select count(*) as rows
            from public.get_client_bookings(diagnostic.session_token)
          ) actual;
          rollback;
          SQL

  observe-production:
    if: inputs.phase == 'observe-production' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: minuta-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Наблюдать production без записи данных
        env:
          MINUTA_EXPECT_IDEMPOTENCY: "1"
          MINUTA_EXPECT_VERSION: ${{ inputs.expected_version }}
          OBSERVATION_MINUTES: ${{ inputs.observation_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          checks=$((OBSERVATION_MINUTES / 5))
          for ((attempt=1; attempt<=checks; attempt++)); do
            node minuta-online-booking/production-health-check.mjs
            if [ "$attempt" -lt "$checks" ]; then sleep 300; fi
          done
