          node --check minuta-online-booking/inventory-v82-static-test.mjs
          node --check minuta-online-booking/retention-v83-static-test.mjs
          node --check minuta-online-booking/benefit-exclusivity-v84-static-test.mjs
          node --check minuta-online-booking/batch-bookings-v85-static-test.mjs
          node --check minuta-online-booking/group-overlap-trigger-v86-static-test.mjs
          node --check minuta-online-booking/yookassa-v87-static-test.mjs
