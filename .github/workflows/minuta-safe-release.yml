          node --check minuta-online-booking/analytics-v92-v94-static-test.mjs
          node --check minuta-online-booking/client-import-v95-static-test.mjs
          node --check minuta-online-booking/employee-analytics-v97-static-test.mjs
          node --check minuta-online-booking/historical-bookings-v98-static-test.mjs
          node --check minuta-online-booking/booking-history-import-v99-static-test.mjs
          node --check minuta-online-booking/authorization-repair-v100-static-test.mjs
          node --check minuta-online-booking/booking-buffer-v101-static-test.mjs
          node --check minuta-online-booking/client-import.js
