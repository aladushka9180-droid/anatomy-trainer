          node minuta-online-booking/telegram-reminder-security-v77-static-test.mjs
          node minuta-online-booking/organization-controller-test.mjs
          node minuta-online-booking/team-calendar-controller-test.mjs
          node minuta-online-booking/resource-management-controller-test.mjs
          node minuta-online-booking/payroll-management-controller-test.mjs
          node minuta-online-booking/benefit-management-controller-test.mjs
          node minuta-online-booking/booking-policy-management-controller-test.mjs
          node minuta-online-booking/voice-assistant-test.mjs
          node minuta-online-booking/voice-assistant-lifecycle-test.mjs
          node minuta-online-booking/provider-responsive-parity-test.mjs
          node minuta-online-booking/demo-statistics-seed-test.mjs
          node minuta-online-booking/analytics-v92-v94-static-test.mjs
          bash -n minuta-online-booking/multi-tenant-v69-concurrency-test.sh
          node minuta-online-booking/scripts/migration-safety-guard.mjs
          node minuta-online-booking/scripts/package4-static-test.mjs
          node --check minuta-online-booking/report-worker.js
          node minuta-online-booking/report-xlsx-test.mjs
          node minuta-online-booking/smoke-test.mjs

  test-migration:
    if: inputs.phase == 'test-migration'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: minuta-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Установить клиент PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Запретить миграцию production
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
          MINUTA_MIGRATION_TARGET: ${{ inputs.migration_target }}
        shell: bash
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          MINUTA_TEST_DATABASE_URL="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          guard_count="$(psql "$MINUTA_TEST_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --set=expected_ref="$MINUTA_TEST_PROJECT_REF" \
            --tuples-only --no-align <<'SQL'
          select count(*)
          from minuta_migration_guard.target
          where project_ref = :'expected_ref'
            and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$guard_count")" = "1"
      - name: Применить миграции к отдельной тестовой базе
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_MIGRATION_TARGET: ${{ inputs.migration_target }}
          PGOPTIONS: -c minuta.telegram_reminder_url=https://${{ vars.MINUTA_TEST_PROJECT_REF }}.supabase.co/functions/v1/telegram-client-notify/reminders
        shell: bash
        run: |
          set -euo pipefail
          MINUTA_TEST_DATABASE_URL="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v46.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v47.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v48.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v49.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v50.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v51.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v52.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v53.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v54.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v55.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v56.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v57.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v58.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v60.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v62.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v63.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v61.sql
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v64.sql
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.get_available_slots_v101(uuid,date,date,uuid)') is not null or exists(select 1 from information_schema.columns where table_schema='public' and table_name='booking_policies' and column_name in ('booking_buffer_enabled','booking_buffer_minutes'));")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/supabase-migration-v101-rollback.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_imported_booking_history') is not null or to_regclass('public.booking_history_import_batches') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-booking-history-import-v99.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.create_minuta_historical_booking(uuid,uuid,date,time without time zone,text,text,integer)') is not null or to_regprocedure('public.create_minuta_historical_booking(uuid,uuid,date,time without time zone,text,text)') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-historical-bookings-v98.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.booking_events') is not null and (to_regprocedure('public.get_minuta_booking_events_v97(uuid,date,date,integer,integer)') is not null or to_regprocedure('public.get_minuta_staff_report_bookings_v97(uuid,date,date,uuid,integer,integer)') is not null);")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-employee-analytics-v97.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_imported_clients') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-client-import-v95.sql
          fi
          psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f minuta-online-booking/supabase-migration-v96-rollback.sql
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.get_minuta_staff_report_bookings(uuid,date,date,uuid,integer,integer)') is not null or to_regprocedure('public.get_minuta_staff_report_bookings(uuid,date,date,uuid)') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/supabase-migration-v94-rollback.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.booking_events') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-booking-events-v93.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.get_minuta_team_analytics(date,date)') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-booking-attribution-v92.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.bootstrap_client_identity_session(text,text,text)') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-social-auth-v91.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.bootstrap_client_sms_session(text)') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-phone-auth-v90.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_client_field_settings') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-client-fields-v89.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_notification_settings') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/recovery/rollback-notification-center-v88.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_payment_provider_settings') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/supabase-migration-v87-rollback.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select exists(select 1 from pg_trigger where tgrelid='public.bookings'::regclass and tgname='zz_bookings_group_event_overlap_v86' and not tgisinternal);")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/supabase-migration-v86-rollback.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_batch_booking_settings') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/supabase-migration-v85-rollback.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regprocedure('public.enforce_minuta_booking_benefit_exclusivity()') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -f minuta-online-booking/supabase-migration-v84-rollback.sql
          fi
          if test "$(psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -Atc "select to_regclass('public.organization_retention_settings') is not null;")" = "t"; then
            psql "$MINUTA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
