  validate-production-rollback:
    if: inputs.phase == 'validate-production-rollback' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: minuta-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Установить клиент PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Проверить v47 и v71–v86 в откатываемой транзакции production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          case "$SUPABASE_DB_URL" in
            *cawexmmrqjvothcbgjxr*) ;;
            *) echo "Строка подключения не соответствует production проекту" >&2; exit 1 ;;
          esac
          MIGRATION_DB_URL="${SUPABASE_DB_URL/:6543/:5432}"
          validation_sql="$(mktemp)"
          trap 'rm -f "$validation_sql"' EXIT
          {
            echo 'begin;'
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v47.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v49.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v71.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v72.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v73.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v74.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v75.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v76.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v77.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v78.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v79.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v80.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v81.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v82.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v83.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v84.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v85.sql
            sed -E '/^[[:space:]]*(begin|commit);[[:space:]]*$/Id' minuta-online-booking/supabase-migration-v86.sql
            sed -E '/^[[:space:]]*(begin|rollback);[[:space:]]*$/Id' minuta-online-booking/booking-policies-v76-integration.sql
            echo 'rollback;'
          } > "$validation_sql"
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 -X -f "$validation_sql"
          psql "$MIGRATION_DB_URL" -v ON_ERROR_STOP=1 -X -Atc \
            "select not exists(select 1 from public.bookings where request_id in ('00000000-0000-4000-8000-000000007201'::uuid,'00000000-0000-4000-8000-000000007301'::uuid,'00000000-0000-4000-8000-000000007601'::uuid));" \
            | grep -qx t

  production-migration:
    if: inputs.phase == 'production-migration' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: minuta-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Подтвердить свежий backup и откатываемую проверку совместимого commit
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTA_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          MINUTA_VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MINUTA_BACKUP_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$MINUTA_VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          check_run() {
            local run_id="$1" expected_path="$2" expected_title="$3" max_age="$4" scope="$5"
            local run_json run_sha created now
            run_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
            run_sha="$(jq -r '.head_sha' <<<"$run_json")"
            git merge-base --is-ancestor "$run_sha" "$GITHUB_SHA"
            if [ "$run_sha" != "$GITHUB_SHA" ]; then
              if [ "$scope" = "backup" ]; then
                git diff --quiet "$run_sha" "$GITHUB_SHA" -- \
                  .github/workflows/minuta-supabase-backup.yml \
                  minuta-online-booking/scripts/backup-config-guard.mjs \
                  minuta-online-booking/scripts/write-backup-journal.mjs
              else
