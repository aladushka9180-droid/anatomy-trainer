name: Minuta v136 payroll safe release
run-name: Minuta v136 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v136
        required: true
        default: test-v136
        type: choice
        options: [test-v136, validate-production-v136, apply-production-v136, observe-production-v136]
      commit_sha:
        description: Exact 40-character main commit SHA to test
        required: true
        type: string
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked successful offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v136 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v136 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v136 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter APPLY_V136_TO_PRODUCTION for apply, required: false, default: "", type: string }

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.phase == 'test-v136' && 'minuta-test-database' || 'minuta-production-database' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  payroll_static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit
        env:
          SHA: "${{ inputs.commit_sha }}"
          PHASE: "${{ inputs.phase }}"
          CONFIRMATION: "${{ inputs.confirmation }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v136|validate-production-v136|observe-production-v136) ;;
            apply-production-v136) test "$CONFIRMATION" = APPLY_V136_TO_PRODUCTION ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node --check minuta-online-booking/payroll-ledger-v136-static-test.mjs
      - run: node minuta-online-booking/payroll-ledger-v136-static-test.mjs

  payroll_integration:
    if: inputs.phase == 'test-v136'
    needs: payroll_static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
      PGSSLMODE: require
      PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=10000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Guard isolated test database
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*)
          from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
      - name: Apply, integrate, rollback and reapply v136
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v136.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/payroll-ledger-v136-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v136-rollback.sql
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.get_minuta_payroll_ledger_workspace_v136(uuid,date,date)') is null")" = t
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select count(*)=0 from pg_class where oid=any(array[to_regclass('public.organization_payroll_ledger_settings'),to_regclass('public.financial_payroll_adjustment_sources'),to_regclass('public.financial_payroll_accrual_sources'),to_regclass('public.financial_payroll_payment_sources'),to_regclass('public.financial_payroll_advance_sources'),to_regclass('public.financial_payroll_advance_offsets')])")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v136.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/payroll-ledger-v136-integration.sql
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" '{
            status:"success",roadmapItem:"D07",phase:"v136-isolated-integration",
            commitSha:$sha,runId:$run,currentMainVerified:true,isolatedDatabase:true,
            productionWritten:false,rollbackReapplyPassed:true,
            checks:["auto_accrual","advance","partial_payment","debt","bonus","deduction","history_preserved","idempotency","concurrency","tenant_acl","balanced_ledger"]
          }' > "$RUNNER_TEMP/v136-payroll-attestation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v136-payroll-attestation-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/v136-payroll-attestation.json
          if-no-files-found: error
          retention-days: 35

  validate-production-v136:
    if: inputs.phase == 'validate-production-v136'
    needs: payroll_static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate v136 production state read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          with state as (
            select
              (select count(*) from pg_class where oid=any(array[
                to_regclass('public.organization_payroll_ledger_settings'),
                to_regclass('public.financial_payroll_adjustment_sources'),
                to_regclass('public.financial_payroll_accrual_sources'),
                to_regclass('public.financial_payroll_payment_sources'),
                to_regclass('public.financial_payroll_advance_sources'),
                to_regclass('public.financial_payroll_advance_offsets')])) table_count,
              (to_regprocedure('public.set_minuta_payroll_ledger_enabled_v136(uuid,boolean)') is not null)::int
              +(to_regprocedure('public.record_minuta_payroll_adjustment_v136(uuid,uuid,uuid,text,bigint,text,uuid)') is not null)::int
              +(to_regprocedure('public.accrue_minuta_payroll_period_v136(uuid,uuid,timestamp with time zone,uuid)') is not null)::int
              +(to_regprocedure('public.pay_minuta_payroll_debt_v136(uuid,uuid,uuid,uuid,bigint,uuid)') is not null)::int
              +(to_regprocedure('public.create_minuta_payroll_advance_v136(uuid,uuid,uuid,bigint,timestamp with time zone,uuid)') is not null)::int
              +(to_regprocedure('public.offset_minuta_payroll_advance_v136(uuid,uuid,uuid,bigint,uuid)') is not null)::int
              +(to_regprocedure('public.reverse_minuta_payroll_transaction_v136(uuid,uuid,uuid,text)') is not null)::int
              +(to_regprocedure('public.get_minuta_payroll_ledger_workspace_v136(uuid,date,date)') is not null)::int function_count)
          select json_build_object(
            'baseReady',to_regprocedure('public.set_minuta_finance_enabled_v133(uuid,boolean)') is not null
              and to_regprocedure('public.set_minuta_payroll_period_status(uuid,uuid,text)') is not null,
            'tableCount',table_count,'functionCount',function_count,
            'mode',case when table_count=0 and function_count=0 then 'absent'
              when table_count=6 and function_count=8 then 'full' else 'partial' end) from state;
          rollback;
          SQL
          )"
          jq -e '.baseReady and (.mode=="absent" or .mode=="full")' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v136",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v136-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v136-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v136-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v136:
    if: inputs.phase == 'apply-production-v136'
    needs: payroll_static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify exact test, validation, encrypted backup and linked restore
        env:
          SHA: ${{ inputs.commit_sha }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"
            test "$(jq -r .conclusion <<<"$run")" = success
            test "$(jq -r .head_sha <<<"$run")" = "$SHA"
            test "$(jq -r .head_branch <<<"$run")" = main
            test "$(jq -r .event <<<"$run")" = workflow_dispatch
            test "$(jq -r .path <<<"$run")" = "$2"
          }
          mkdir -p "$RUNNER_TEMP/v136-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v136-payroll-integration.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v136 - test-v136 - $SHA"
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v136-payroll-attestation-$SHA" -D "$RUNNER_TEMP/v136-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and .rollbackReapplyPassed and (.productionWritten|not)' "$RUNNER_TEMP/v136-evidence/test/v136-payroll-attestation.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v136-payroll-integration.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v136 - validate-production-v136 - $SHA"
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v136-validation-$VALIDATION" -D "$RUNNER_TEMP/v136-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and (.state.mode=="absent" or .state.mode=="full")' "$RUNNER_TEMP/v136-evidence/validation/v136-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s) - $(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"
          [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v136-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v136-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v136-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v136-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v136-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v136 idempotently and verify default-off postconditions
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=10000' psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v136.sql
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'tableCount',(select count(*) from pg_class where oid=any(array[
              to_regclass('public.organization_payroll_ledger_settings'),to_regclass('public.financial_payroll_adjustment_sources'),
              to_regclass('public.financial_payroll_accrual_sources'),to_regclass('public.financial_payroll_payment_sources'),
              to_regclass('public.financial_payroll_advance_sources'),to_regclass('public.financial_payroll_advance_offsets')])),
            'workspaceReady',to_regprocedure('public.get_minuta_payroll_ledger_workspace_v136(uuid,date,date)') is not null,
            'payReady',to_regprocedure('public.pay_minuta_payroll_debt_v136(uuid,uuid,uuid,uuid,bigint,uuid)') is not null,
            'defaultOff',not exists(select 1 from public.organization_payroll_ledger_settings where enabled));
          SQL
          )"
          jq -e '.tableCount==6 and .workspaceReady and .payReady and .defaultOff' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"apply-production-v136",commitSha:$sha,state:$state,productionWritten:true,businessRowsChanged:false,featureDefaultOff:true}' > "$RUNNER_TEMP/v136-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v136-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v136-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v136:
    if: inputs.phase == 'observe-production-v136'
    needs: payroll_static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply and observe v136 read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v136-payroll-integration.yml
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'workspaceReady',to_regprocedure('public.get_minuta_payroll_ledger_workspace_v136(uuid,date,date)') is not null,
            'payReady',to_regprocedure('public.pay_minuta_payroll_debt_v136(uuid,uuid,uuid,uuid,bigint,uuid)') is not null,
            'defaultOff',not exists(select 1 from public.organization_payroll_ledger_settings where enabled),
            'businessRows',
              (select count(*) from public.financial_payroll_adjustment_sources)
              +(select count(*) from public.financial_payroll_accrual_sources)
              +(select count(*) from public.financial_payroll_payment_sources)
              +(select count(*) from public.financial_payroll_advance_sources)
              +(select count(*) from public.financial_payroll_advance_offsets));
          SQL
          )"
          jq -e '.workspaceReady and .payReady and .defaultOff and .businessRows==0' <<<"$state" >/dev/null
          node minuta-online-booking/production-health-check.mjs
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"observe-production-v136",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v136-observe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v136-observe-${{ github.run_id }}", path: "${{ runner.temp }}/v136-observe.json", if-no-files-found: error, retention-days: 90 }
