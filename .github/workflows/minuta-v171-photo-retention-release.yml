name: Minuta v171 photo retention safe release
run-name: Minuta v171 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options: [test-v171, validate-production-v171, apply-production-v171]
      commit_sha:
        description: Exact current main SHA
        required: true
        type: string
      test_run_id:
        required: false
        default: ''
        type: string
      validation_run_id:
        required: false
        default: ''
        type: string
      backup_run_id:
        required: false
        default: ''
        type: string
      restore_run_id:
        required: false
        default: ''
        type: string
      confirmation:
        description: Enter INSTALL_V171_WITH_CLEANUP_DISABLED for production apply
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.phase == 'test-v171' && 'minuta-test-database' || 'minuta-production-database' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.commit_sha }}', fetch-depth: 0, persist-credentials: false }
      - name: Pin exact main state and scope
        env:
          SHA: ${{ inputs.commit_sha }}
          PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v171|validate-production-v171) ;;
            apply-production-v171) test "$CONFIRMATION" = INSTALL_V171_WITH_CLEANUP_DISABLED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/client-result-retention-v171-static-test.mjs
      - run: node minuta-online-booking/tests/client-result-retention-v171-worker-test.mjs
      - name: Rehearse migration and behavior in PGlite
        if: inputs.phase == 'test-v171'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/v171-deps" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          export MINUTA_PGLITE_MODULE="$RUNNER_TEMP/v171-deps/node_modules/@electric-sql/pglite/dist/index.js"
          node minuta-online-booking/tests/client-result-retention-v171-pglite-test.mjs

  test-v171:
    if: inputs.phase == 'test-v171'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.commit_sha }}', persist-credentials: false }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply twice, preserve rows, rollback and reapply
        shell: bash
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          before="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_array((select count(*) from public.client_result_assets),(select count(*) from public.client_record_entries),(select count(*) from storage.objects where bucket_id='minuta-client-records'))")"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v171.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v171.sql
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('policyDisabled',not enabled,'auditEmpty',not exists(select 1 from public.client_result_retention_audit),'claimService',has_function_privilege('service_role','public.claim_minuta_client_result_retention_v171(integer,boolean)','EXECUTE'),'claimAuthenticated',has_function_privilege('authenticated','public.claim_minuta_client_result_retention_v171(integer,boolean)','EXECUTE'),'keepAuthenticated',has_function_privilege('authenticated','public.set_minuta_client_result_media_keep_v171(uuid,boolean)','EXECUTE')) from public.client_result_retention_policy where singleton")"
          jq -e '.policyDisabled and .auditEmpty and .claimService and (.claimAuthenticated|not) and .keepAuthenticated' <<<"$state" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v171-rollback.sql
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.claim_minuta_client_result_retention_v171(integer,boolean)') is null")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v171.sql
          after="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_array((select count(*) from public.client_result_assets),(select count(*) from public.client_record_entries),(select count(*) from storage.objects where bucket_id='minuta-client-records'))")"
          test "$before" = "$after"
      - name: Record isolated proof
        env: { SHA: '${{ inputs.commit_sha }}' }
        shell: bash
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v171.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v171-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v171",commitSha:$sha,runId:$run,applyTwice:true,rollbackVerified:true,reapplied:true,businessRowsChanged:false,storageObjectsChanged:false,cleanupEnabled:false,migrationSha256:$migration,rollbackSha256:$rollback,productionWritten:false}' > "$RUNNER_TEMP/v171-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'v171-test-${{ github.run_id }}', path: '${{ runner.temp }}/v171-test.json', if-no-files-found: error, retention-days: 35 }

  validate-production-v171:
    if: inputs.phase == 'validate-production-v171'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.commit_sha }}', persist-credentials: false }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate production prerequisites read-only
        env: { SHA: '${{ inputs.commit_sha }}' }
        shell: bash
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('v120',to_regclass('public.client_result_assets') is not null and to_regprocedure('public.get_minuta_client_results_v120(uuid,text,integer)') is not null,'outcomes',to_regclass('public.booking_outcomes') is not null,'storage',to_regclass('storage.objects') is not null,'alreadyPresent',to_regprocedure('public.claim_minuta_client_result_retention_v171(integer,boolean)') is not null,'assetCount',(select count(*) from public.client_result_assets),'recordCount',(select count(*) from public.client_record_entries),'storageCount',(select count(*) from storage.objects where bucket_id='minuta-client-records'))")"
          jq -e '.v120 and .outcomes and .storage' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v171",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v171-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'v171-validation-${{ github.run_id }}', path: '${{ runner.temp }}/v171-validation.json', if-no-files-found: error, retention-days: 35 }

  apply-production-v171:
    if: inputs.phase == 'apply-production-v171'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ inputs.commit_sha }}', fetch-depth: 0, persist-credentials: false }
      - name: Verify test, validation, fresh backup and offline restore
        env:
          SHA: ${{ inputs.commit_sha }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v171-evidence"/{test,validation,restore}
          check_run "$TEST" .github/workflows/minuta-v171-photo-retention-release.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v171-test-$TEST" -D "$RUNNER_TEMP/v171-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .rollbackVerified and .reapplied and (.businessRowsChanged|not) and (.storageObjectsChanged|not) and (.cleanupEnabled|not)' "$RUNNER_TEMP/v171-evidence/test/v171-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v171-photo-retention-release.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v171-validation-$VALIDATION" -D "$RUNNER_TEMP/v171-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and .state.v120 and .state.outcomes and .state.storage and (.productionWritten|not)' "$RUNNER_TEMP/v171-evidence/validation/v171-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v171-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v171-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Install v171 with cleanup disabled and prove no photo changed
        shell: bash
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_array((select count(*) from public.client_result_assets),(select count(*) from public.client_record_entries),(select count(*) from storage.objects where bucket_id='minuta-client-records'))")"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v171.sql
          after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_array((select count(*) from public.client_result_assets),(select count(*) from public.client_record_entries),(select count(*) from storage.objects where bucket_id='minuta-client-records'))")"
          test "$before" = "$after"
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('installed',to_regprocedure('public.claim_minuta_client_result_retention_v171(integer,boolean)') is not null,'cleanupEnabled',enabled,'auditCount',(select count(*) from public.client_result_retention_audit)) from public.client_result_retention_policy where singleton")"
          jq -e '.installed and (.cleanupEnabled|not) and .auditCount==0' <<<"$state" >/dev/null
          jq -n --arg sha '${{ inputs.commit_sha }}' --argjson state "$state" '{status:"success",phase:"apply-production-v171",commitSha:$sha,state:$state,productionWritten:true,businessRowsChanged:false,storageObjectsChanged:false,cleanupEnabled:false}' > "$RUNNER_TEMP/v171-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'v171-apply-${{ github.run_id }}', path: '${{ runner.temp }}/v171-apply.json', if-no-files-found: error, retention-days: 90 }
