name: Minuta v169 reminder catch-up safe release
run-name: Minuta v169 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v169
        required: true
        default: test-v169
        type: choice
        options: [test-v169, validate-production-v169, apply-production-v169, observe-production-v169]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked ephemeral restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v169 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v169 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v169 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency:
  group: ${{ inputs.phase == 'test-v169' && 'minuta-test-database' || 'minuta-production-database' }}
  cancel-in-progress: false
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env:
          SHA: ${{ inputs.commit_sha }}
          PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v169|validate-production-v169|observe-production-v169) ;;
            apply-production-v169) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/tests/reminder-catchup-v169-static-test.mjs

  test-v169:
    if: inputs.phase == 'test-v169'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Full-schema apply twice, behavior, rollback and reapply
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v169.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v169.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/reminder-catchup-v169-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v169-rollback.sql
          rolled_back="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select position('between (now() at time zone ''Europe/Samara'')' in pg_get_functiondef('public.enqueue_due_minuta_booking_reminders(integer)'::regprocedure))>0 and position('clock_timestamp()' in pg_get_functiondef('public.enqueue_due_minuta_booking_reminders(integer)'::regprocedure))=0")"
          test "$rolled_back" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v169.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/reminder-catchup-v169-integration.sql
      - name: Create test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v169.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v169-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v169",commitSha:$sha,runId:$run,isolatedDatabase:true,fullSchema:true,syntheticBookings:true,externalMessages:false,cycle:["apply","apply","behavior","rollback","reapply","behavior"],rollbackVerified:true,migrationSha256:$migration,rollbackSha256:$rollback,productionWritten:false}' > "$RUNNER_TEMP/v169-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v169-test-${{ github.run_id }}", path: "${{ runner.temp }}/v169-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v169:
    if: inputs.phase == 'validate-production-v169'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Read-only scheduler baseline
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'schedulerPresent',to_regprocedure('public.enqueue_due_minuta_booking_reminders(integer)') is not null,
            'enqueuePresent',to_regprocedure('public.enqueue_minuta_booking_notification(uuid,text)') is not null,
            'settingsPresent',to_regclass('public.organization_notification_settings') is not null,
            'channelsPresent',to_regclass('public.organization_notification_channels') is not null,
            'outboxPresent',to_regclass('public.notification_outbox') is not null,
            'catchupActive',coalesce(position('clock_timestamp()' in pg_get_functiondef(to_regprocedure('public.enqueue_due_minuta_booking_reminders(integer)')))>0,false),
            'serviceOnly',coalesce(has_function_privilege('service_role',to_regprocedure('public.enqueue_due_minuta_booking_reminders(integer)'),'EXECUTE') and not has_function_privilege('anon',to_regprocedure('public.enqueue_due_minuta_booking_reminders(integer)'),'EXECUTE') and not has_function_privilege('authenticated',to_regprocedure('public.enqueue_due_minuta_booking_reminders(integer)'),'EXECUTE'),false),
            'outboxCount',(select count(*) from public.notification_outbox)
          );
          SQL
          )"
          jq -e '.schedulerPresent and .enqueuePresent and .settingsPresent and .channelsPresent and .outboxPresent and .serviceOnly' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v169",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v169-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v169-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v169-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v169:
    if: inputs.phase == 'apply-production-v169'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Verify test, validation, encrypted backup and linked restore
        env:
          SHA: ${{ inputs.commit_sha }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v169-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v169-reminder-catchup.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v169-test-$TEST" -D "$RUNNER_TEMP/v169-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and .fullSchema and .syntheticBookings and (.externalMessages|not) and .rollbackVerified and (.productionWritten|not)' "$RUNNER_TEMP/v169-evidence/test/v169-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v169-reminder-catchup.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v169-validation-$VALIDATION" -D "$RUNNER_TEMP/v169-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and .state.serviceOnly and (.productionWritten|not)' "$RUNNER_TEMP/v169-evidence/validation/v169-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"; [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v169-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v169-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v169-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v169-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v169-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply atomically with immediate rollback on failed postflight
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('bookings',(select count(*) from public.bookings),'outbox',(select count(*) from public.notification_outbox))")"
          applied=0
          rollback_on_error(){ if test "$applied" = 1; then psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v169-rollback.sql || true; fi; }
          trap rollback_on_error ERR
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v169.sql
          applied=1
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'catchupActive',position('clock_timestamp()' in pg_get_functiondef('public.enqueue_due_minuta_booking_reminders(integer)'::regprocedure))>0,
            'futureGuard',position('booking.booking_date + booking.booking_time >' in pg_get_functiondef('public.enqueue_due_minuta_booking_reminders(integer)'::regprocedure))>0,
            'serviceOnly',has_function_privilege('service_role','public.enqueue_due_minuta_booking_reminders(integer)','EXECUTE') and not has_function_privilege('anon','public.enqueue_due_minuta_booking_reminders(integer)','EXECUTE') and not has_function_privilege('authenticated','public.enqueue_due_minuta_booking_reminders(integer)','EXECUTE')
          );
          SQL
          )"
          jq -e '.catchupActive and .futureGuard and .serviceOnly' <<<"$state" >/dev/null
          after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('bookings',(select count(*) from public.bookings),'outbox',(select count(*) from public.notification_outbox))")"
          test "$before" = "$after"
          trap - ERR
          jq -n --arg sha "$SHA" --argjson state "$state" --argjson counts "$after" '{status:"success",phase:"apply-production-v169",commitSha:$sha,state:$state,businessCounts:$counts,productionWritten:true,businessRowsChanged:false,messagesDispatched:false,automaticRollbackArmed:true}' > "$RUNNER_TEMP/v169-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v169-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v169-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v169:
    if: inputs.phase == 'observe-production-v169'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply evidence and scheduler read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v169-reminder-catchup.yml
          mkdir -p "$RUNNER_TEMP/v169-apply-evidence"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v169-apply-$APPLY" -D "$RUNNER_TEMP/v169-apply-evidence"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .productionWritten and (.businessRowsChanged|not) and (.messagesDispatched|not) and .automaticRollbackArmed' "$RUNNER_TEMP/v169-apply-evidence/v169-apply.json" >/dev/null
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('catchupActive',position('clock_timestamp()' in pg_get_functiondef('public.enqueue_due_minuta_booking_reminders(integer)'::regprocedure))>0,'serviceOnly',has_function_privilege('service_role','public.enqueue_due_minuta_booking_reminders(integer)','EXECUTE') and not has_function_privilege('anon','public.enqueue_due_minuta_booking_reminders(integer)','EXECUTE') and not has_function_privilege('authenticated','public.enqueue_due_minuta_booking_reminders(integer)','EXECUTE'))")"
          jq -e '.catchupActive and .serviceOnly' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --arg apply "$APPLY" --argjson state "$state" '{status:"success",phase:"observe-production-v169",commitSha:$sha,applyRunId:$apply,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v169-observe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v169-observe-${{ github.run_id }}", path: "${{ runner.temp }}/v169-observe.json", if-no-files-found: error, retention-days: 90 }
