name: Minuta v151 commercial sales release
run-name: Minuta v151 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v151
        required: true
        default: test-v151
        type: choice
        options: [test-v151, validate-production-v151, apply-production-v151, observe-production-v151]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v151 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v151 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v151 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: "${{ inputs.phase == 'test-v151' && 'minuta-test-database' || 'minuta-production-database' }}", cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env: { SHA: "${{ inputs.commit_sha }}", PHASE: "${{ inputs.phase }}", CONFIRMATION: "${{ inputs.confirmation }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v151|validate-production-v151|observe-production-v151) ;;
            apply-production-v151) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: node minuta-online-booking/tests/commercial-sales-v151-db-static-test.mjs

  test-v151:
    if: inputs.phase == 'test-v151'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Prove sequential v147 through v151 apply on isolated database
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          psql "$db" -X -q -v ON_ERROR_STOP=1 -v run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -f minuta-online-booking/tests/commercial-sales-v151-durable-cleanup.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          do $recovery$
          declare stale_role record;
          begin
            for stale_role in select rolname from pg_catalog.pg_roles where rolname like 'v151_acl_%' order by rolname
            loop
              if to_regprocedure('public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid)') is not null then
                execute 'alter function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) owner to postgres';
                execute format('revoke all on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) from %I',stale_role.rolname);
              end if;
              if to_regprocedure('public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid)') is not null then
                execute 'alter function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) owner to postgres';
                execute format('revoke all on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) from %I',stale_role.rolname);
              end if;
              execute format('drop role %I',stale_role.rolname);
            end loop;
          end
          $recovery$;
          revoke all on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) from public,anon,authenticated,service_role;
          grant execute on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) to authenticated;
          revoke all on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) from public,anon,authenticated,service_role;
          grant execute on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) to authenticated;
          SQL
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          case "$(jq -r .classification <<<"$state")" in
            exact) touch "$RUNNER_TEMP/v151-test-owned"; psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151-rollback.sql ;;
            absent) touch "$RUNNER_TEMP/v151-test-owned" ;;
            *) jq -c . <<<"$state"; exit 1 ;;
          esac
          prior="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          prior="$(grep '^{' <<<"$prior"|tail -n 1)"
          jq -e '.v148Secure and .classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0 and .expectedBackfill==0' <<<"$prior" >/dev/null
          history="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('applications',(select count(*) from public.benefit_application_requests),'lifecycle',(select count(*) from public.benefit_lifecycle_requests),'freezePeriods',(select count(*) from public.benefit_freeze_periods),'expiredLedger',(select count(*) from public.benefit_ledger where event_type='expired'))")"
          jq -e '.applications==0 and .lifecycle==0 and .freezePeriods==0 and .expiredLedger==0' <<<"$history" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150-rollback.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v149-rollback.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v148-rollback.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v148.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v149.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          exact="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql)"
          exact="$(grep '^{' <<<"$exact"|tail -n 1)"
          jq -e '.classification=="exact" and .exact and .criticalSchemaExact and .authenticatedSaleExecute and .authenticatedWorkspaceExecute and (.anonSaleExecute|not) and (.anonWorkspaceExecute|not)' <<<"$exact" >/dev/null
          prior_after="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql | grep '^{' | tail -n 1)"
          jq -e '.v148Secure and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0' <<<"$prior_after" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/commercial-sales-v151-integration.sql

      - name: Prove committed persistence, mixed-version replay and concurrent submit
        run: bash minuta-online-booking/tests/commercial-sales-v151-durable-concurrency-test.sh "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Prove partial and newer v151 guards
        run: |
          set -euo pipefail
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.get_minuta_commerce_workspace_v151(p_organization uuid)
          returns jsonb language sql stable security definer set search_path to ''
          as $$ select jsonb_build_object('probe','v151-newer-probe') $$;
          SQL
          if psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql; then exit 1; fi
          if psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151-rollback.sql; then exit 1; fi
          psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select position('v151-newer-probe' in pg_get_functiondef('public.get_minuta_commerce_workspace_v151(uuid)'::regprocedure))>0" | grep -qx t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "drop function public.get_minuta_commerce_workspace_v151(uuid); drop function public.sell_minuta_commercial_product_v151(uuid,uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid);"
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          create function public.get_minuta_commerce_workspace_v151(p_organization uuid)
          returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          SQL
          if psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql; then exit 1; fi
          if psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151-rollback.sql; then exit 1; fi
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.get_minuta_commerce_workspace_v151(uuid)') is not null")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "drop function public.get_minuta_commerce_workspace_v151(uuid);"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select pg_get_functiondef('public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid)'::regprocedure)" > "$RUNNER_TEMP/v151-issue-minuta-benefit-restore.sql"
          psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select pg_get_functiondef('public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid)'::regprocedure)" > "$RUNNER_TEMP/v151-apply-stock-movement-restore.sql"
          test -s "$RUNNER_TEMP/v151-issue-minuta-benefit-restore.sql"
          test -s "$RUNNER_TEMP/v151-apply-stock-movement-restore.sql"
          drift_role="v151_acl_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$drift_role" =~ ^v151_acl_[0-9]+_[0-9]+$ ]]
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -v drift_role="$drift_role" -c "select count(*) from pg_catalog.pg_roles where rolname=:'drift_role'")" = 0
          printf '%s\n' "$drift_role" > "$RUNNER_TEMP/v151-runtime-drift-role"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -v drift_role="$drift_role" -c "create role :\"drift_role\" nologin"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "alter table public.financial_transactions drop constraint financial_transactions_shape_v147_check; alter table public.financial_transactions add constraint financial_transactions_shape_v147_check check(true);"
          drift="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.criticalSchemaExact|not) and .criticalSchemaFingerprint!=.criticalSchemaExpectedFingerprint' <<<"$drift" >/dev/null
          if psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql; then exit 1; fi
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "alter table public.financial_accounts drop constraint if exists financial_accounts_account_type_v147_check, drop constraint if exists financial_accounts_system_key_v147_check, drop constraint if exists financial_accounts_system_mapping_v147_check, drop constraint if exists financial_accounts_system_request_v147_check; alter table public.financial_transactions drop constraint if exists financial_transactions_operation_v147_check, drop constraint if exists financial_transactions_source_v147_check, drop constraint if exists financial_transactions_shape_v147_check;"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v148.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v149.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          alter table public.financial_accounts drop constraint financial_accounts_organization_id_system_key_key;
          create index financial_accounts_organization_id_system_key_key
            on public.financial_accounts(organization_id,system_key);
          SQL
          drift="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.criticalSchemaExact|not) and .criticalSchemaFingerprint!=.criticalSchemaExpectedFingerprint' <<<"$drift" >/dev/null
          if failure="$(psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql 2>&1)"; then exit 1; fi
          grep -q 'v151_requires_exact_v147_v148_v149_v150' <<<"$failure"
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          drop index public.financial_accounts_organization_id_system_key_key;
          alter table public.financial_accounts add constraint financial_accounts_organization_id_system_key_key
            unique(organization_id,system_key);
          SQL
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.issue_minuta_benefit(
            p_organization uuid,p_product uuid,p_client_account uuid,p_expires_on date,p_request_id uuid
          )
          returns jsonb language sql security invoker set search_path to ''
          as $$ select jsonb_build_object('probe','v151-issue-benefit-drift') $$;
          SQL
          drift="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.criticalSchemaExact|not) and .criticalSchemaFingerprint!=.criticalSchemaExpectedFingerprint' <<<"$drift" >/dev/null
          if failure="$(psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql 2>&1)"; then exit 1; fi
          grep -q 'v151_requires_exact_v147_v148_v149_v150' <<<"$failure"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/v151-issue-minuta-benefit-restore.sql"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "revoke all on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) from public,anon,authenticated,service_role; grant execute on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) to authenticated;"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.apply_minuta_stock_movement(
            p_organization uuid,p_warehouse uuid,p_item uuid,p_kind text,p_quantity numeric,
            p_counted_quantity numeric,p_reason text,p_request_id uuid
          )
          returns jsonb language sql security invoker set search_path to ''
          as $$ select jsonb_build_object('probe','v151-stock-movement-drift') $$;
          SQL
          drift="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.criticalSchemaExact|not) and .criticalSchemaFingerprint!=.criticalSchemaExpectedFingerprint' <<<"$drift" >/dev/null
          if failure="$(psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql 2>&1)"; then exit 1; fi
          grep -q 'v151_requires_exact_v147_v148_v149_v150' <<<"$failure"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/v151-apply-stock-movement-restore.sql"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "revoke all on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) from public,anon,authenticated,service_role; grant execute on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) to authenticated;"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -v drift_role="$drift_role" -c "grant execute on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) to :\"drift_role\" with grant option"
          drift="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.criticalSchemaExact|not) and .criticalSchemaFingerprint!=.criticalSchemaExpectedFingerprint' <<<"$drift" >/dev/null
          if failure="$(psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql 2>&1)"; then exit 1; fi
          grep -q 'v151_requires_exact_v147_v148_v149_v150' <<<"$failure"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -v drift_role="$drift_role" -c "revoke all on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) from public,anon,authenticated,service_role,:\"drift_role\"; grant execute on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) to authenticated"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -v drift_role="$drift_role" -c "alter function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) owner to :\"drift_role\""
          drift="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.criticalSchemaExact|not) and .criticalSchemaFingerprint!=.criticalSchemaExpectedFingerprint' <<<"$drift" >/dev/null
          if failure="$(psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql 2>&1)"; then exit 1; fi
          grep -q 'v151_requires_exact_v147_v148_v149_v150' <<<"$failure"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -v drift_role="$drift_role" <<'SQL'
          alter function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) owner to postgres;
          revoke all on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid)
            from public,anon,authenticated,service_role,:"drift_role";
          grant execute on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) to authenticated;
          drop role :"drift_role";
          SQL
          rm -f "$RUNNER_TEMP/v151-runtime-drift-role"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.sell_minuta_commercial_product_v147(
            p_organization uuid,p_booking uuid,p_client_account uuid,p_item_kind text,p_benefit_product uuid,
            p_inventory_item uuid,p_warehouse uuid,p_quantity numeric,p_unit_price_minor bigint,p_discount_minor bigint,
            p_payment_method text,p_payment_account uuid,p_request_id uuid
          ) returns jsonb language plpgsql security definer set search_path to '' as $$
          begin
            perform ':commerce:'; perform 'commercial_sale_idempotency_conflict';
            return jsonb_build_object('probe','v147-same-signature-drift');
          end $$;
          revoke all on function public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid) from public,anon,authenticated,service_role;
          grant execute on function public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid) to authenticated;
          SQL
          drift="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.criticalSchemaExact|not) and .criticalSchemaFingerprint!=.criticalSchemaExpectedFingerprint' <<<"$drift" >/dev/null
          if psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql; then exit 1; fi

      - name: Clean durable fixture and restore exact test chain
        if: always()
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -v expected_ref="$MINUTA_TEST_PROJECT_REF" -c "select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true")"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          test -f "$RUNNER_TEMP/v151-test-owned" || exit 0
          psql "$db" -X -q -v ON_ERROR_STOP=1 -v run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -f minuta-online-booking/tests/commercial-sales-v151-durable-cleanup.sql
          if test -s "$RUNNER_TEMP/v151-issue-minuta-benefit-restore.sql"; then
            psql "$db" -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/v151-issue-minuta-benefit-restore.sql"
            psql "$db" -X -q -v ON_ERROR_STOP=1 -c "revoke all on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) from public,anon,authenticated,service_role; grant execute on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) to authenticated;"
          fi
          if test -s "$RUNNER_TEMP/v151-apply-stock-movement-restore.sql"; then
            psql "$db" -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/v151-apply-stock-movement-restore.sql"
            psql "$db" -X -q -v ON_ERROR_STOP=1 -c "revoke all on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) from public,anon,authenticated,service_role; grant execute on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) to authenticated;"
          fi
          if test -s "$RUNNER_TEMP/v151-runtime-drift-role"; then
            drift_role="$(tr -d '\r\n' < "$RUNNER_TEMP/v151-runtime-drift-role")"
            [[ "$drift_role" =~ ^v151_acl_[0-9]+_[0-9]+$ ]]
            if test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -v drift_role="$drift_role" -c "select count(*) from pg_catalog.pg_roles where rolname=:'drift_role'")" = 1; then
              psql "$db" -X -q -v ON_ERROR_STOP=1 -v drift_role="$drift_role" -c "alter function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) owner to postgres; revoke all on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) from public,anon,authenticated,service_role,:\"drift_role\"; grant execute on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) to authenticated; alter function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) owner to postgres; revoke all on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) from public,anon,authenticated,service_role,:\"drift_role\"; grant execute on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) to authenticated; drop role :\"drift_role\";"
            fi
            rm -f "$RUNNER_TEMP/v151-runtime-drift-role"
          fi
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "alter function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) owner to postgres; revoke all on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) from public,anon,authenticated,service_role; grant execute on function public.issue_minuta_benefit(uuid,uuid,uuid,date,uuid) to authenticated; alter function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) owner to postgres; revoke all on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) from public,anon,authenticated,service_role; grant execute on function public.apply_minuta_stock_movement(uuid,uuid,uuid,text,numeric,numeric,text,uuid) to authenticated;"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "drop function if exists public.get_minuta_commerce_workspace_v151(uuid); drop function if exists public.sell_minuta_commercial_product_v151(uuid,uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid);"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "alter table public.financial_accounts drop constraint if exists financial_accounts_organization_id_system_key_key; drop index if exists public.financial_accounts_organization_id_system_key_key; alter table public.financial_accounts add constraint financial_accounts_organization_id_system_key_key unique(organization_id,system_key);"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -c "alter table public.financial_accounts drop constraint if exists financial_accounts_account_type_v147_check, drop constraint if exists financial_accounts_system_key_v147_check, drop constraint if exists financial_accounts_system_mapping_v147_check, drop constraint if exists financial_accounts_system_request_v147_check; alter table public.financial_transactions drop constraint if exists financial_transactions_operation_v147_check, drop constraint if exists financial_transactions_source_v147_check, drop constraint if exists financial_transactions_shape_v147_check;"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v148.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v149.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql | grep '^{' | tail -n 1)"
          jq -e '.classification=="exact" and .criticalSchemaExact' <<<"$state" >/dev/null
      - name: Create isolated test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v151.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v151-rollback.sql|cut -d' ' -f1)" \
            --arg state "$(sha256sum minuta-online-booking/scripts/commercial-sales-v151-state.sql|cut -d' ' -f1)" \
            --arg integration "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-integration.sql|cut -d' ' -f1)" \
            --arg setup "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-durable-setup.sql|cut -d' ' -f1)" \
            --arg durable "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-durable-concurrency-test.sh|cut -d' ' -f1)" \
            --arg cleanup "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-durable-cleanup.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v151",commitSha:$sha,runId:$run,isolatedDatabase:true,
              coverage:["v147-v151-sequential-apply","critical-schema-fingerprint","runtime-owner-acl-drift","runtime-stale-role-recovery","quantity-boundaries","visit-sale","standalone-sale","seller","inventory-atomicity","sale-idempotency","benefit-v149-application","benefit-v150-freeze-unfreeze","benefit-v148-refund","mixed-version-replay-both-directions","committed-rollback-persistence","two-psql-connections","observed-lock-wait","partial-guard","newer-guard","always-cleanup","reapply"],
              migrationSha256:$migration,rollbackSha256:$rollback,stateSha256:$state,integrationSha256:$integration,setupSha256:$setup,durableSha256:$durable,cleanupSha256:$cleanup,productionWritten:false,businessRowsChanged:false}' > "$RUNNER_TEMP/v151-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v151-test-${{ github.run_id }}", path: "${{ runner.temp }}/v151-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v151:
    if: inputs.phase == 'validate-production-v151'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate production prerequisites read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          prior="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          prior="$(grep '^{' <<<"$prior"|tail -n 1)"
          jq -e '.v148Secure and .classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0' <<<"$prior" >/dev/null
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql)"
          state="$(grep '^{' <<<"$state"|tail -n 1)"
          jq -e '.criticalSchemaExact and (.classification=="absent" or (.classification=="exact" and .authenticatedSaleExecute and .authenticatedWorkspaceExecute and (.anonSaleExecute|not) and (.anonWorkspaceExecute|not)))' <<<"$state" >/dev/null
          invariants="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'missingOpen',(select count(*) from public.client_benefit_instruments i where i.status='frozen' and not exists(select 1 from public.benefit_freeze_periods p where p.instrument_id=i.id and p.thawed_at is null)),
            'orphanOpen',(select count(*) from public.benefit_freeze_periods p join public.client_benefit_instruments i on i.id=p.instrument_id where p.thawed_at is null and i.status<>'frozen'),
            'duplicateOpen',(select count(*) from (select instrument_id from public.benefit_freeze_periods where thawed_at is null group by instrument_id having count(*)<>1) duplicate));
          SQL
          )"
          jq -e '.missingOpen==0 and .orphanOpen==0 and .duplicateOpen==0' <<<"$invariants" >/dev/null
          jq -n --arg sha "$SHA" --argjson prior "$prior" --argjson state "$state" --argjson invariants "$invariants" \
            '{status:"success",phase:"validate-production-v151",commitSha:$sha,readOnly:true,productionWritten:false,prior:$prior,state:$state,invariants:$invariants}' > "$RUNNER_TEMP/v151-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v151-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v151-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v151:
    if: inputs.phase == 'apply-production-v151'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify tests, validation, encrypted backup and linked restore
        env: { SHA: "${{ inputs.commit_sha }}", TEST: "${{ inputs.test_run_id }}", VALIDATION: "${{ inputs.validation_run_id }}", BACKUP: "${{ inputs.backup_run_id }}", RESTORE: "${{ inputs.restore_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v151-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v151-commercial-sales.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v151-test-$TEST" -D "$RUNNER_TEMP/v151-evidence/test"
          jq -e --arg sha "$SHA" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v151.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v151-rollback.sql|cut -d' ' -f1)" \
            --arg state "$(sha256sum minuta-online-booking/scripts/commercial-sales-v151-state.sql|cut -d' ' -f1)" \
            --arg integration "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-integration.sql|cut -d' ' -f1)" \
            --arg setup "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-durable-setup.sql|cut -d' ' -f1)" \
            --arg durable "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-durable-concurrency-test.sh|cut -d' ' -f1)" \
            --arg cleanup "$(sha256sum minuta-online-booking/tests/commercial-sales-v151-durable-cleanup.sql|cut -d' ' -f1)" '
            .status=="success" and .commitSha==$sha and .isolatedDatabase
            and (.productionWritten|not) and (.businessRowsChanged|not)
            and .migrationSha256==$migration and .rollbackSha256==$rollback and .stateSha256==$state
            and .integrationSha256==$integration and .setupSha256==$setup and .durableSha256==$durable and .cleanupSha256==$cleanup
            and (.coverage|index("v147-v151-sequential-apply"))!=null
            and (.coverage|index("committed-rollback-persistence"))!=null
            and (.coverage|index("mixed-version-replay-both-directions"))!=null
            and (.coverage|index("two-psql-connections"))!=null
            and (.coverage|index("observed-lock-wait"))!=null
            and (.coverage|index("always-cleanup"))!=null
          ' "$RUNNER_TEMP/v151-evidence/test/v151-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v151-commercial-sales.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v151-validation-$VALIDATION" -D "$RUNNER_TEMP/v151-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly
            and .prior.v148Secure and .prior.v149Exact and .prior.v150Exact
            and (.state.classification=="absent" or .state.classification=="exact")
            and .invariants.missingOpen==0 and .invariants.orphanOpen==0 and .invariants.duplicateOpen==0' "$RUNNER_TEMP/v151-evidence/validation/v151-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"; [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v151-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v151-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v151-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v151-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v151-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v151 without changing business rows
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('sales',(select count(*) from public.commercial_sales),'lines',(select count(*) from public.commercial_sale_lines),'refunds',(select count(*) from public.commercial_sale_refunds),'movements',(select count(*) from public.inventory_movements),'transactions',(select count(*) from public.financial_transactions),'postings',(select count(*) from public.financial_postings),'instruments',(select count(*) from public.client_benefit_instruments),'applications',(select count(*) from public.benefit_application_requests),'lifecycle',(select count(*) from public.benefit_lifecycle_requests),'freezePeriods',(select count(*) from public.benefit_freeze_periods))")"
          prior_before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          prior_before="$(grep '^{' <<<"$prior_before"|tail -n 1)"
          jq -e '.v148Secure and .classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0' <<<"$prior_before" >/dev/null
          state_before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql)"
          state_before="$(grep '^{' <<<"$state_before"|tail -n 1)"
          jq -e '.criticalSchemaExact and (.classification=="absent" or .classification=="exact")' <<<"$state_before" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v151.sql
          after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('sales',(select count(*) from public.commercial_sales),'lines',(select count(*) from public.commercial_sale_lines),'refunds',(select count(*) from public.commercial_sale_refunds),'movements',(select count(*) from public.inventory_movements),'transactions',(select count(*) from public.financial_transactions),'postings',(select count(*) from public.financial_postings),'instruments',(select count(*) from public.client_benefit_instruments),'applications',(select count(*) from public.benefit_application_requests),'lifecycle',(select count(*) from public.benefit_lifecycle_requests),'freezePeriods',(select count(*) from public.benefit_freeze_periods))")"
          test "$(jq -S . <<<"$after")" = "$(jq -S . <<<"$before")"
          state_after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql)"
          state_after="$(grep '^{' <<<"$state_after"|tail -n 1)"
          jq -e '.classification=="exact" and .exact and .criticalSchemaExact and .authenticatedSaleExecute and .authenticatedWorkspaceExecute and (.anonSaleExecute|not) and (.anonWorkspaceExecute|not)' <<<"$state_after" >/dev/null
          prior_after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          prior_after="$(grep '^{' <<<"$prior_after"|tail -n 1)"
          jq -e '.v148Secure and .classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0' <<<"$prior_after" >/dev/null
          jq -n --arg sha "$SHA" --argjson before "$before" --argjson after "$after" --argjson priorBefore "$prior_before" --argjson priorAfter "$prior_after" --argjson stateBefore "$state_before" --argjson stateAfter "$state_after" \
            '{status:"success",phase:"apply-production-v151",commitSha:$sha,before:$before,after:$after,priorBefore:$priorBefore,priorAfter:$priorAfter,stateBefore:$stateBefore,stateAfter:$stateAfter,productionWritten:true,businessRowsChanged:false,secretsExposed:false}' > "$RUNNER_TEMP/v151-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v151-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v151-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v151:
    if: inputs.phase == 'observe-production-v151'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply evidence and observe v151 read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v151-commercial-sales.yml
          mkdir -p "$RUNNER_TEMP/v151-apply"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v151-apply-$APPLY" -D "$RUNNER_TEMP/v151-apply"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .productionWritten and (.businessRowsChanged|not)
            and .stateAfter.classification=="exact" and .stateAfter.criticalSchemaExact and .priorAfter.v148Secure and .priorAfter.v149Exact and .priorAfter.v150Exact' "$RUNNER_TEMP/v151-apply/v151-apply.json" >/dev/null
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          prior="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          prior="$(grep '^{' <<<"$prior"|tail -n 1)"
          jq -e '.v148Secure and .classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0' <<<"$prior" >/dev/null
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/commercial-sales-v151-state.sql)"
          state="$(grep '^{' <<<"$state"|tail -n 1)"
          jq -e '.classification=="exact" and .criticalSchemaExact and .authenticatedSaleExecute and .authenticatedWorkspaceExecute and (.anonSaleExecute|not) and (.anonWorkspaceExecute|not)' <<<"$state" >/dev/null
          invariants="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'missingOpen',(select count(*) from public.client_benefit_instruments i where i.status='frozen' and not exists(select 1 from public.benefit_freeze_periods p where p.instrument_id=i.id and p.thawed_at is null)),
            'orphanOpen',(select count(*) from public.benefit_freeze_periods p join public.client_benefit_instruments i on i.id=p.instrument_id where p.thawed_at is null and i.status<>'frozen'),
            'duplicateOpen',(select count(*) from (select instrument_id from public.benefit_freeze_periods where thawed_at is null group by instrument_id having count(*)<>1) duplicate));
          SQL
          )"
          jq -e '.missingOpen==0 and .orphanOpen==0 and .duplicateOpen==0' <<<"$invariants" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          do $probe$
          declare target record; workspace jsonb;
          begin
            for target in select distinct on (membership.organization_id) membership.organization_id,membership.user_id
              from public.organization_memberships membership
              where membership.active and membership.role in('owner','admin')
              order by membership.organization_id,case membership.role when 'owner' then 0 else 1 end,membership.user_id
            loop
              perform set_config('request.jwt.claim.sub',target.user_id::text,true);
              workspace:=public.get_minuta_commerce_workspace_v151(target.organization_id);
              if workspace->>'organization_id'<>target.organization_id::text or jsonb_typeof(workspace->'sellers')<>'array' then
                raise exception 'v151_production_workspace_mismatch';
              end if;
            end loop;
          end
          $probe$;
          rollback;
          SQL
          jq -n --arg sha "$SHA" --arg apply "$APPLY" --argjson prior "$prior" --argjson state "$state" --argjson invariants "$invariants" \
            '{status:"success",phase:"observe-production-v151",commitSha:$sha,applyRunId:$apply,prior:$prior,state:$state,invariants:$invariants,readOnly:true,productionWritten:false}' > "$RUNNER_TEMP/v151-observation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v151-observation-${{ github.run_id }}", path: "${{ runner.temp }}/v151-observation.json", if-no-files-found: error, retention-days: 90 }
