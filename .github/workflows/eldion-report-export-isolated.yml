# SOURCE ONLY. Not installed in a repository and not authorized for dispatch.
# Same source is independently present as source/observe-owned-ci.py.
name: Eldion CI observation R1
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed forty-character workflow commit; no default.
        required: true
        type: string
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.repository == 'aladushka9180-droid/anatomy-trainer' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Bounded observation only
        id: observe
        timeout-minutes: 1
        shell: bash --noprofile --norc -e {0}
        env:
          EL_EXPECTED_COMMIT: '${{ inputs.expected_commit }}'
          EL_REPOSITORY: '${{ github.repository }}'
          EL_COMMIT: '${{ github.sha }}'
          EL_WORKFLOW_SHA: '${{ github.workflow_sha }}'
          EL_RUN_ID: '${{ github.run_id }}'
          EL_RUN_ATTEMPT: '${{ github.run_attempt }}'
          EL_JOB: '${{ github.job }}'
          EL_EVENT: '${{ github.event_name }}'
          EL_RUNNER_OS: '${{ runner.os }}'
          EL_RUNNER_ARCH: '${{ runner.arch }}'
          EL_OBSERVER_SHA256: 'fa11b72b10c11d4216165cc2bca0fddb73fea5701ac3096207ff95177a2c0c00'
        run: |
          exec /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C \
            EL_EXPECTED_COMMIT="$EL_EXPECTED_COMMIT" \
            EL_REPOSITORY="$EL_REPOSITORY" \
            EL_COMMIT="$EL_COMMIT" \
            EL_WORKFLOW_SHA="$EL_WORKFLOW_SHA" \
            EL_RUN_ID="$EL_RUN_ID" \
            EL_RUN_ATTEMPT="$EL_RUN_ATTEMPT" \
            EL_JOB="$EL_JOB" \
            EL_EVENT="$EL_EVENT" \
            EL_RUNNER_OS="$EL_RUNNER_OS" \
            EL_RUNNER_ARCH="$EL_RUNNER_ARCH" \
            EL_OBSERVER_SHA256="$EL_OBSERVER_SHA256" \
            EL_STAGE_PARENT="$RUNNER_TEMP" \
            /usr/bin/python3 -I -B - <<'ELDION_OBSERVE_BOOTSTRAP'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import sys
          import tempfile
          
          observer_source = r'''import errno
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import time
          
          SCHEMA = "eldion-ci-observation-r1"
          REPOSITORY = "aladushka9180-droid/anatomy-trainer"
          MAX_RECEIPT = 16384
          MAX_EXECUTABLE = 67108864
          SOFT_SECONDS = 10
          START = time.monotonic()
          CGROUP_FILES = ("memory.max", "memory.current", "memory.peak", "cpu.max", "pids.max", "pids.current")
          ENV_NAMES = ("EL_EXPECTED_COMMIT", "EL_REPOSITORY", "EL_COMMIT", "EL_WORKFLOW_SHA",
                       "EL_RUN_ID", "EL_RUN_ATTEMPT", "EL_JOB", "EL_EVENT",
                       "EL_RUNNER_OS", "EL_RUNNER_ARCH", "EL_OBSERVER_SHA256")
          
          
          class Hold(Exception):
              pass
          
          
          def check(value):
              if not value:
                  raise Hold()
          
          
          def tick():
              check(time.monotonic() - START <= SOFT_SECONDS)
          
          
          def bounded(path, maximum):
              tick()
              with open(path, "rb") as handle:
                  data = handle.read(maximum + 1)
              check(len(data) <= maximum)
              tick()
              return data
          
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def emit_frame(frame):
              if not isinstance(frame, bytes) or len(frame) > MAX_RECEIPT + 64:
                  os._exit(2)
              try:
                  if os.write(1, frame) != len(frame):
                      os._exit(2)
              except BaseException:
                  os._exit(2)
          
          
          def scalar(value, pattern):
              check(isinstance(value, str) and re.fullmatch(pattern, value) is not None)
              return value
          
          
          def executable_pin():
              target = os.path.realpath("/proc/self/exe")
              check(len(target) <= 512 and target.isascii())
              before = os.stat("/proc/self/exe")
              check(stat.S_ISREG(before.st_mode) and 0 < before.st_size <= MAX_EXECUTABLE)
              sha = hashlib.sha256()
              total = 0
              with open("/proc/self/exe", "rb") as handle:
                  opened = os.fstat(handle.fileno())
                  check((opened.st_dev, opened.st_ino) == (before.st_dev, before.st_ino))
                  for _ in range(MAX_EXECUTABLE // 65536 + 1):
                      tick()
                      chunk = handle.read(65536)
                      if not chunk:
                          break
                      sha.update(chunk)
                      total += len(chunk)
                      check(total <= MAX_EXECUTABLE)
                  else:
                      raise Hold()
                  after = os.fstat(handle.fileno())
              check(total == before.st_size and
                    (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns) ==
                    (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns))
              return {"path": target, "bytes": total, "sha256": sha.hexdigest(),
                      "dev": before.st_dev, "inode": before.st_ino}
          
          
          def process_identity():
              raw = bounded("/proc/self/stat", 4096)
              cut = raw.rfind(b")")
              check(cut > 0)
              fields = raw[cut + 2:].split()
              check(len(fields) >= 20)
              return {"pid": os.getpid(), "ppid": os.getppid(), "startTicks": int(fields[19]),
                      "uid": os.getuid(), "gid": os.getgid()}
          
          
          def namespaces():
              out = {}
              for name in ("net", "mnt", "pid", "user", "cgroup"):
                  value = os.stat("/proc/self/ns/" + name)
                  out[name] = {"dev": value.st_dev, "inode": value.st_ino}
              return out
          
          
          def fd_snapshot():
              names = os.listdir("/proc/self/fd")
              check(len(names) <= 64)
              counts = {"regular": 0, "directory": 0, "pipe": 0, "socket": 0, "other": 0}
              raced = 0
              for name in names:
                  try:
                      mode = os.fstat(int(name)).st_mode
                  except OSError as error:
                      check(error.errno == errno.EBADF)
                      raced += 1
                      continue
                  kind = ("regular" if stat.S_ISREG(mode) else
                          "directory" if stat.S_ISDIR(mode) else
                          "pipe" if stat.S_ISFIFO(mode) else
                          "socket" if stat.S_ISSOCK(mode) else "other")
                  counts[kind] += 1
              return {"counts": counts, "racedEntries": raced, "authorityProof": False}
          
          
          def cgroup_observation():
              raw = bounded("/proc/self/cgroup", 4096)
              lines = raw.decode("ascii").splitlines()
              unified = [line[3:] for line in lines if line.startswith("0::")]
              out = {"membershipSha256": digest(raw), "unified": len(unified) == 1,
                     "values": {}, "writeOrDelegationTested": False, "ownedCgroupProven": False}
              if len(unified) != 1:
                  return out
              relative = unified[0]
              check(relative.startswith("/") and ".." not in Path(relative).parts)
              base = Path("/sys/fs/cgroup").resolve(strict=True)
              candidate = (base / relative.lstrip("/")).resolve(strict=True)
              check(candidate == base or base in candidate.parents)
              out["membershipPathSha256"] = digest(relative.encode("ascii"))
              node = os.stat(candidate)
              out["directory"] = {"dev": node.st_dev, "inode": node.st_ino,
                                  "writeAccessAdvisory": os.access(candidate, os.W_OK)}
              for name in CGROUP_FILES:
                  try:
                      data = bounded(candidate / name, 256).decode("ascii").strip()
                      scalar(data, r"(?:max|[0-9]+)(?: (?:max|[0-9]+))?")
                      out["values"][name] = {"status": "OBSERVED", "value": data}
                  except FileNotFoundError:
                      out["values"][name] = {"status": "UNAVAILABLE"}
              return out
          
          
          def meminfo():
              out = {}
              for line in bounded("/proc/meminfo", 16384).decode("ascii").splitlines():
                  key, _, value = line.partition(":")
                  if key in ("MemTotal", "MemAvailable"):
                      match = re.fullmatch(r"\s*([0-9]+) kB", value)
                      check(match is not None)
                      out[key + "Bytes"] = int(match.group(1)) * 1024
              check(set(out) == {"MemTotalBytes", "MemAvailableBytes"})
              return out
          
          
          def main():
              check(sys.platform == "linux" and len(sys.argv) == 1)
              values = {name: os.environ.get(name, "") for name in ENV_NAMES}
              check(values["EL_REPOSITORY"] == REPOSITORY and values["EL_EVENT"] == "workflow_dispatch")
              check(values["EL_RUNNER_OS"] == "Linux" and values["EL_RUNNER_ARCH"] == "X64")
              commit = scalar(values["EL_EXPECTED_COMMIT"], r"[0-9a-f]{40}")
              check(values["EL_COMMIT"] == commit and values["EL_WORKFLOW_SHA"] == commit)
              run = scalar(values["EL_RUN_ID"], r"[1-9][0-9]{0,19}")
              check(values["EL_RUN_ATTEMPT"] == "1" and values["EL_JOB"] == "observe")
              expected_source = scalar(values["EL_OBSERVER_SHA256"], r"[0-9a-f]{64}")
              source = Path(__file__).resolve(strict=True)
              source_bytes = bounded(source, 32768)
              check(digest(source_bytes) == expected_source)
              stage = source.parent
              node = os.stat(stage)
              check(node.st_uid == os.getuid() and stat.S_IMODE(node.st_mode) == 0o700)
              before = process_identity()
              ns_before = namespaces()
              descriptors = fd_snapshot()
              interpreter = executable_pin()
              cgroup = cgroup_observation()
              memory = meminfo()
              space = os.statvfs(stage)
              affinity = os.sched_getaffinity(0)
              check(0 < len(affinity) <= 256)
              after = process_identity()
              ns_after = namespaces()
              check(before == after and ns_before == ns_after)
              tick()
              receipt = {
                  "format": SCHEMA, "status": "OBSERVATION_ONLY_NOT_RESOURCE_QUALIFICATION",
                  "repository": REPOSITORY, "commit": commit, "workflowSha": commit,
                  "runId": run, "runAttempt": 1, "jobKey": "observe", "numericJobId": None,
                  "source": {"bytes": len(source_bytes), "sha256": expected_source},
                  "interpreter": interpreter, "pythonVersion": list(sys.version_info[:3]),
                  "selfProcess": before, "namespaces": ns_after, "fdSnapshot": descriptors,
                  "cgroup": cgroup, "memory": memory,
                  "cpu": {"affinityCount": len(affinity), "logicalCount": os.cpu_count()},
                  "stageDirectory": {"name": stage.name, "dev": node.st_dev, "inode": node.st_ino},
                  "stageFilesystem": {"blockSize": space.f_frsize,
                                      "availableBytes": space.f_bavail * space.f_frsize,
                                      "totalBytes": space.f_blocks * space.f_frsize},
                  "elapsedMs": int((time.monotonic() - START) * 1000),
                  "softDeadlineSeconds": SOFT_SECONDS, "hardTimeOrResourceQuota": False,
                  "created": {"children": 0, "threads": 0, "listeners": 0, "containers": 0,
                              "namespaces": 0, "cgroups": 0, "services": 0,
                              "applicationOrSqlWorkloads": 0},
                  "applicableOnlyToThisRunAndJob": True, "futureJobBinding": False,
                  "processExitEofAndLifetimeAccepted": False, "resourceAuthorityAccepted": False,
                  "egressBarrierAccepted": False, "applicationRuntimeAccepted": False,
                  "deletionPerformed": False, "canonicalCountersChanged": False,
                  "rootReadbackRequired": ["immutable workflow bytes at workflowSha", "run/attempt/event/head",
                                           "numeric job identity and completed step conclusion",
                                           "exact bounded receipt; terminal failure/timeout is HOLD_NO_RETRY"]
              }
              encoded = json.dumps(receipt, ensure_ascii=True, separators=(",", ":"), sort_keys=True).encode("ascii")
              check(len(encoded) + 1 <= MAX_RECEIPT)
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
              fd = os.open(stage / "RECEIPT.json", flags, 0o600)
              with os.fdopen(fd, "wb") as handle:
                  handle.write(encoded + b"\n")
                  handle.flush()
              emit_frame(b"ELDION_CI_OBSERVATION_R1:" + encoded + b"\n")
          
          
          if __name__ == "__main__":
              try:
                  main()
              except BaseException:
                  emit_frame(b'ELDION_CI_OBSERVATION_HOLD_R1:{"status":"HOLD_NO_RETRY","detail":"NOT_EXPORTED"}\n')
                  os._exit(2)
          
          '''
          try:
              data = observer_source.encode("utf-8")
              expected = os.environ["EL_OBSERVER_SHA256"]
              if len(data) > 32768 or hashlib.sha256(data).hexdigest() != expected:
                  raise ValueError()
              parent = Path(os.environ["EL_STAGE_PARENT"])
              info = parent.lstat()
              if not parent.is_absolute() or parent == Path("/") or not stat.S_ISDIR(info.st_mode):
                  raise ValueError()
              if stat.S_ISLNK(info.st_mode) or info.st_uid != os.getuid():
                  raise ValueError()
              stage = Path(tempfile.mkdtemp(prefix="eldion-ci-observe-r1-", dir=parent))
              os.chmod(stage, 0o700)
              script = stage / "observe-owned-ci.py"
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
              fd = os.open(script, flags, 0o600)
              with os.fdopen(fd, "wb") as handle:
                  handle.write(data)
                  handle.flush()
              clean = {key: os.environ[key] for key in (
                  "PATH", "LC_ALL", "EL_EXPECTED_COMMIT", "EL_REPOSITORY", "EL_COMMIT",
                  "EL_WORKFLOW_SHA", "EL_RUN_ID", "EL_RUN_ATTEMPT", "EL_JOB", "EL_EVENT",
                  "EL_RUNNER_OS", "EL_RUNNER_ARCH", "EL_OBSERVER_SHA256")}
              os.execve("/usr/bin/python3", ["/usr/bin/python3", "-I", "-B", str(script)], clean)
          except BaseException:
              frame = b'ELDION_CI_OBSERVATION_HOLD_R1:{"status":"HOLD_NO_RETRY","detail":"BOOTSTRAP_NOT_EXPORTED"}' + bytes((10,))
              try:
                  if os.write(1, frame) != len(frame):
                      os._exit(2)
              except BaseException:
                  os._exit(2)
              os._exit(2)
          ELDION_OBSERVE_BOOTSTRAP
