name: Minuta acquisition integration
run-name: Minuta acquisition integration - ${{ inputs.commit_sha || github.sha }}

on:
  push:
    paths:
      - 'minuta-online-booking/booking-widgets.js'
      - 'minuta-online-booking/app.js'
      - 'minuta-online-booking/provider.html'
      - 'minuta-online-booking/provider.js'
      - 'minuta-online-booking/supabase-migration-v107.sql'
      - 'minuta-online-booking/supabase-migration-v137.sql'
      - 'minuta-online-booking/booking-widgets-static-test.mjs'
      - 'minuta-online-booking/acquisition-channels-integration-test.mjs'
      - 'minuta-online-booking/tests/acquisition-channels-v137-integration.sql'
      - 'minuta-online-booking/tests/booking-widgets-browser-test.mjs'
      - '.github/workflows/minuta-acquisition-integration.yml'
  pull_request:
    paths:
      - 'minuta-online-booking/**'
      - '.github/workflows/minuta-acquisition-integration.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character current main commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact requested revision
        env:
          SHA: ${{ inputs.commit_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$GITHUB_REF" = refs/heads/main
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/acquisition-browser" --ignore-scripts --no-save playwright@1.62.1
          "$RUNNER_TEMP/acquisition-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser URL to RPC attribution
        env:
          MINUTA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/acquisition-browser/node_modules/playwright/index.mjs
        run: node minuta-online-booking/tests/booking-widgets-browser-test.mjs

  acquisition_integration:
    name: acquisition_integration
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
      PGSSLMODE: require
      PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=10000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact requested revision
        env:
          SHA: ${{ inputs.commit_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$GITHUB_REF" = refs/heads/main
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify Yandex, Google and conversion attribution contracts
        run: |
          set -euo pipefail
          node minuta-online-booking/booking-widgets-static-test.mjs
          node minuta-online-booking/acquisition-channels-integration-test.mjs
      - name: Guard isolated test database
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
      - name: Verify isolated Yandex and Google conversion rows through v137
        run: |
          set -euo pipefail
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v107.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v137.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/acquisition-channels-v137-integration.sql
