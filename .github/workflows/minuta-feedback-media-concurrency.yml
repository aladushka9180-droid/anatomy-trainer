name: Minuta synthetic feedback media PostgreSQL concurrency
run-name: Synthetic v116 concurrency — ${{ github.event_name == 'push' && github.sha || inputs.release_sha }}
on:
  # A new dispatch-only workflow may not be registered before reaching main.
  # This sole owner-controlled branch can run the synthetic gate without a release.
  push:
    branches: [codex/feedback-media-integration]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed commit containing this gate and frozen v116 SQL
        required: true
        type: string
      reviewed_sql_sha256:
        description: SHA256 of the reviewed git blob supabase-migration-v116.sql
        required: true
        type: string
      confirm:
        description: Enter SYNTHETIC_PG_V116_ONLY; no remote database or release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: minuta-synthetic-media-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  synthetic-postgresql:
    if: github.repository == 'aladushka9180-droid/anatomy-trainer' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/feedback-media-integration'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.release_sha }}
      REVIEWED_SQL_SHA256: ${{ github.event_name == 'push' && '2d7b8dd1a756089e5f567c449c81d61d7e1544d9a241915f6b804d418b033b03' || inputs.reviewed_sql_sha256 }}
      SYNTHETIC_CONFIRM: ${{ github.event_name == 'push' && 'SYNTHETIC_PG_V116_ONLY' || inputs.confirm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.release_sha }}
          persist-credentials: false
      - name: Validate exact checkout and synthetic-only consent
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) ;;
            push)
              test "$GITHUB_REF" = refs/heads/codex/feedback-media-integration
              test "$REVIEWED_SQL_SHA256" = 2d7b8dd1a756089e5f567c449c81d61d7e1544d9a241915f6b804d418b033b03
              ;;
            *) exit 1;;
          esac
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_SQL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$SYNTHETIC_CONFIRM" = SYNTHETIC_PG_V116_ONLY
          test -z "$(git status --porcelain)"
          git show HEAD:minuta-online-booking/supabase-migration-v116.sql | sha256sum | cut -d' ' -f1 | grep -Fx "$REVIEWED_SQL_SHA256"
          bash -n minuta-online-booking/tests/feedback-media-v116-concurrency.sh
      - name: Test actual v109 and v116 in a network-isolated ephemeral PostgreSQL
        run: bash minuta-online-booking/tests/feedback-media-v116-concurrency.sh
