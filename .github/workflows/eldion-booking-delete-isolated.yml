name: Eldion booking deletion isolated PostgreSQL
on:
  push:
    branches: [codex/pro-delete-recovery-20260928]
    paths:
      - '.github/workflows/eldion-booking-delete-isolated.yml'
      - 'minuta-online-booking/recovery/booking-delete-dialog-*.sql'
      - 'minuta-online-booking/tests/booking-delete-dialog-*.mjs'
      - 'minuta-online-booking/tests/booking-delete-dialog-*.sql'
permissions:
  contents: read
concurrency:
  group: minuta-test-database
  cancel-in-progress: false
jobs:
  schema-only-clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: minuta-test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-fixture-only
          POSTGRES_DB: eldion-delete-fixture
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Install test-only PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/eldion-delete-deps" --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Copy only the isolated test schema to an empty temporary server
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/codex/pro-delete-recovery-20260928
          node minuta-online-booking/scripts/migration-config-guard.mjs
          export MINUTA_TEST_DATABASE_URL="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(docker exec -i -e TEST_DSN="$MINUTA_TEST_DATABASE_URL" -e TEST_REF="$MINUTA_TEST_PROJECT_REF" "$PG_CONTAINER" sh -c 'psql "$TEST_DSN" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$TEST_REF"' 2>"$RUNNER_TEMP/eldion-delete-private.log" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$marker" = 1
          docker exec -e TEST_DSN="$MINUTA_TEST_DATABASE_URL" "$PG_CONTAINER" sh -c 'pg_dump "$TEST_DSN" --schema-only --schema=public --no-owner --file=/tmp/source-schema.sql' 2>"$RUNNER_TEMP/eldion-delete-private.log"
          docker cp "$PG_CONTAINER:/tmp/source-schema.sql" "$RUNNER_TEMP/eldion-delete-private-schema.sql"
          node minuta-online-booking/scripts/crm-snapshot-postdata.mjs "$RUNNER_TEMP/eldion-delete-private-schema.sql" "$RUNNER_TEMP/eldion-delete-private-filtered.sql"
          docker cp minuta-online-booking/scripts/crm-snapshot-offline-bootstrap.sql "$PG_CONTAINER:/tmp/bootstrap.sql"
          docker cp minuta-online-booking/tests/booking-delete-dialog-bootstrap.sql "$PG_CONTAINER:/tmp/fixture-bootstrap.sql"
          docker cp "$RUNNER_TEMP/eldion-delete-private-filtered.sql" "$PG_CONTAINER:/tmp/schema.sql"
          docker exec "$PG_CONTAINER" psql -U postgres -d eldion-delete-fixture -X -q -v ON_ERROR_STOP=1 -f /tmp/bootstrap.sql -f /tmp/fixture-bootstrap.sql -f /tmp/schema.sql >"$RUNNER_TEMP/eldion-delete-private.log" 2>&1 || { sed -nE 's/^(psql:[^:]+:[0-9]+: ERROR:).*/\1 schema import failed/p' "$RUNNER_TEMP/eldion-delete-private.log"; exit 1; }
      - name: Full-schema rollback rehearsal and concurrent requests
        env:
          MINUTA_TEST_DATABASE_URL: postgresql://postgres:ephemeral-fixture-only@127.0.0.1:55432/eldion-delete-fixture
          MINUTA_TEST_PROJECT_REF: eldion-delete-fixture
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: MIGRATE_ONLY_ISOLATED_TEST_DATABASE
          MINUTA_DELETE_EPHEMERAL_CONFIRM: SCHEMA_ONLY_EMPTY_DATABASE
        run: |
          set -euo pipefail
          export MINUTA_PG_MODULE="$RUNNER_TEMP/eldion-delete-deps/node_modules/pg/lib/index.js"
          node minuta-online-booking/tests/booking-delete-dialog-full-schema-test.mjs
          node minuta-online-booking/tests/booking-delete-dialog-concurrency-test.mjs
      - name: Remove private schema and logs
        if: always()
        run: rm -f -- "$RUNNER_TEMP/eldion-delete-private-schema.sql" "$RUNNER_TEMP/eldion-delete-private-filtered.sql" "$RUNNER_TEMP/eldion-delete-private.log"
