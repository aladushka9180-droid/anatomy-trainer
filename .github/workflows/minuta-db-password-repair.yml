name: One-time Minuta database credential repair
run-name: Minuta database credential repair

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter ROTATE_MINUTA_DB_PASSWORD
        required: true
        type: string

permissions: { contents: read }
concurrency: { group: minuta-production-database, cancel-in-progress: false }

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: minuta-production
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Validate exact target and rotate database password
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = ROTATE_MINUTA_DB_PASSWORD
          test "$PROJECT_REF" = cawexmmrqjvothcbgjxr
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_URL"
          node <<'NODE'
          const expectedRef = 'cawexmmrqjvothcbgjxr';
          const url = new URL(process.env.SUPABASE_DB_URL);
          const user = decodeURIComponent(url.username).toLowerCase();
          const host = url.hostname.toLowerCase();
          const pooled = /^[a-z0-9-]+\.pooler\.supabase\.com$/.test(host)
            && user === `postgres.${expectedRef}` && url.port === '5432';
          if (process.env.PROJECT_REF !== expectedRef || !pooled || url.pathname !== '/postgres') {
            throw new Error('database credential target does not match the exact production project');
          }
          const password = decodeURIComponent(url.password);
          if (password.length < 32 || /[\r\n]/.test(password)) {
            throw new Error('replacement database password does not meet the repair contract');
          }
          const response = await fetch(`https://api.supabase.com/v1/projects/${expectedRef}/database/password`, {
            method: 'PATCH',
            headers: {
              authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
              'content-type': 'application/json'
            },
            body: JSON.stringify({ password })
          });
          if (!response.ok) throw new Error(`Supabase password rotation failed with HTTP ${response.status}`);
          console.log('Supabase database password rotation accepted');
          NODE
