name: Minuta theme card browser regression
on:
  push:
    branches: [main]
    paths: ['minuta-online-booking/**', '.github/workflows/minuta-theme-cards.yml']
  pull_request:
    branches: [main]
    paths: ['minuta-online-booking/**', '.github/workflows/minuta-theme-cards.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  card-states:
    needs: [card-regressions, layout-regressions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every card regression group
        env:
          CARD_RESULT: ${{ needs.card-regressions.result }}
          LAYOUT_RESULT: ${{ needs.layout-regressions.result }}
        run: test "$CARD_RESULT" = success && test "$LAYOUT_RESULT" = success
  card-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the container checkout and evidence directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "MINUTA_THEME_OUTPUT=$RUNNER_TEMP/theme-regression" >> "$GITHUB_ENV"
          echo "MINUTA_SCREENSHOT_DIR=$RUNNER_TEMP/theme-regression/organization-groups" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.58.2 @electric-sql/pglite@0.3.10
      - name: Install the Chrome channel required by the existing overview test
        run: npx playwright install chrome
      - run: node minuta-online-booking/tests/booking-delete-diagnostic-test.mjs
      - run: node minuta-online-booking/tests/eldion-connection-browser-test.mjs
      - name: Verify one-release PWA update and stale-tab recovery
        run: |
          git fetch --no-tags --depth=1 origin fdae2ae2a4b9f7e65ae9cb5db2ad9126f0e1032d
          node minuta-online-booking/tests/site-update-online-race-test.mjs
          node minuta-online-booking/tests/site-update-notice-retry-test.mjs
          node minuta-online-booking/tests/site-update-notice-browser-test.mjs fdae2ae2a4b9f7e65ae9cb5db2ad9126f0e1032d
      - name: Verify pending navigation cannot block the next worker
        run: node minuta-online-booking/tests/site-update-pending-navigation-browser-test.mjs
      - name: Check theme colours and marked card states
        run: node minuta-online-booking/tests/theme-card-browser-test.mjs
      - name: Keep layout picker geometry independent
        run: node minuta-online-booking/tests/provider-layout-picker-geometry-browser-test.mjs
      - run: node minuta-online-booking/tests/flat-schedule-icons-browser-test.mjs
      - run: node minuta-online-booking/tests/compact-mobile-schedule-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-appearance-layout-browser-test.mjs
      - run: node minuta-online-booking/tests/shift-load-timeout-browser-test.mjs
      - run: node minuta-online-booking/tests/shift-presentation-controller-test.mjs
      - run: node minuta-online-booking/tests/team-schedule-integration-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-master-profile-link-static-test.mjs
      - run: node minuta-online-booking/tests/provider-magnetic-schedule-browser-test.mjs
      - run: node minuta-online-booking/provider-services-organization-browser-test.cjs
      - run: node minuta-online-booking/tests/provider-service-actions-browser-test.mjs
      - run: node minuta-online-booking/tests/client-theme-selection-browser-test.mjs
      - run: node minuta-online-booking/tests/pink-porcelain-catalog-test.mjs
      - run: node minuta-online-booking/tests/pink-personal-theme-browser-test.mjs
      - run: node minuta-online-booking/tests/pink-porcelain-visual-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-porcelain-cabinet-accent-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-porcelain-x15-ordinary-accents-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-porcelain-x15-booking-actions-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-payment-review-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-review-visibility-recovery-test.mjs
      - run: node minuta-online-booking/tests/provider-porcelain-white-text-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-porcelain-editor-browser-test.mjs
      - run: node minuta-online-booking/tests/client-theme-visual-parity-browser-test.mjs
      - run: node minuta-online-booking/tests/client-profile-long-history-hierarchy-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-client-appearance-save-proximity-browser-test.mjs
      - run: node minuta-online-booking/tests/benefit-issue-recovery-browser-test.mjs
      - run: node minuta-online-booking/tests/loyalty-program-v166-browser-test.mjs
      - run: node minuta-online-booking/tests/notification-status-clarity-browser-test.mjs
      - run: node minuta-online-booking/tests/code-scanner-camera-browser-test.mjs
      - run: node minuta-online-booking/tests/client-contact-picker-browser-test.mjs
      - run: node minuta-online-booking/tests/client-profile-from-booking-browser-test.mjs
      - run: node minuta-online-booking/tests/new-booking-card-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-offday-label-browser-test.mjs
      - run: node minuta-online-booking/tests/client-page-settings-v118-pglite-test.mjs
      - run: node minuta-online-booking/tests/pink-porcelain-v177-pglite-test.mjs
      - run: node minuta-online-booking/tests/analytics-reconciliation-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-audit-ui-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-audit-provider-loader-browser-test.mjs
      - run: node minuta-online-booking/tests/report-money-source-visibility-browser-test.mjs
      - run: node minuta-online-booking/tests/finance-warning-n14-browser-test.mjs
      - run: node minuta-online-booking/tests/finance-report-scope-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-heatmap-scroll-hint-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-heatmap-drilldown-browser-test.mjs --project-root .
      - run: node minuta-online-booking/tests/retention-copy-a10-browser-test.mjs
      - run: node minuta-online-booking/tests/organization-roles-a02-browser-test.mjs
      - run: node minuta-online-booking/tests/organization-overview-browser-test.mjs
      - name: Verify organization groups, roles and sticky navigation
        run: node minuta-online-booking/tests/organization-group-navigation-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-typography-n15-browser-test.mjs
      - run: node minuta-online-booking/tests/organization-copy-a05-a08-browser-test.mjs
      - run: node minuta-online-booking/tests/inventory-a11-copy-browser-test.mjs
      - run: node minuta-online-booking/tests/inventory-soft-ui-browser-test.mjs
      - run: node minuta-online-booking/tests/resources-soft-minimalism-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-selects-browser-test.mjs
      - run: node minuta-online-booking/tests/benefit-application-v149-browser-test.mjs
      - run: node minuta-online-booking/tests/commercial-sales-v151-ui-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-connection-guidance-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-theme-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-metric-hierarchy-browser-test.mjs
      - run: node minuta-online-booking/tests/statistics-methodology-v1042-test.mjs
      - run: node minuta-online-booking/tests/free-slots-publication-browser-test.mjs
      - run: node minuta-online-booking/tests/free-slots-porcelain-toggles-browser-test.mjs
      - run: node minuta-online-booking/tests/client-waitlist-browser-test.mjs
      - run: node minuta-online-booking/tests/waitlist-management-browser-test.mjs
      - run: node minuta-online-booking/provider-header-test.mjs
      - run: node minuta-online-booking/tests/provider-brand-signature-browser-test.mjs
      - run: node minuta-online-booking/tests/eldion-messages-brand-browser-test.mjs
      - run: node minuta-online-booking/tests/settings-search-navigation-browser-test.mjs
      - run: node minuta-online-booking/tests/provider-help-workspace-browser-test.mjs
      - run: node minuta-online-booking/tests/contextual-help-labels-browser-test.mjs
      - run: node minuta-online-booking/help/tools/verify-process-visuals.mjs
      - run: node minuta-online-booking/tests/help-knowledge-rose-browser-test.mjs
      - name: Upload visual regression evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minuta-theme-regression
          path: ${{ runner.temp }}/theme-regression
          if-no-files-found: ignore
  layout-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the container checkout and evidence directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "MINUTA_LAYOUT_OUTPUT=$RUNNER_TEMP/theme-regression/layouts" >> "$GITHUB_ENV"
          echo "MINUTA_ORG_FLOW_SCREENSHOTS=$RUNNER_TEMP/theme-regression/organization-flow" >> "$GITHUB_ENV"
          echo "MINUTA_HOURS_SCREENSHOTS=$RUNNER_TEMP/theme-regression/work-hours" >> "$GITHUB_ENV"
          echo "MINUTA_HOURS_OVERFLOW_OUTPUT=$RUNNER_TEMP/theme-regression/work-hours-regressions" >> "$GITHUB_ENV"
          echo "RETENTION_SCREENSHOT_DIR=$RUNNER_TEMP/theme-regression/retention-delta" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.58.2 @electric-sql/pglite@0.3.10
      - name: Check every provider theme, layout and viewport
        run: node minuta-online-booking/provider-layout-browser-test.cjs
      - run: node minuta-online-booking/provider-schedule-minimal-browser-test.cjs
      - run: node minuta-online-booking/tests/client-relationship-appearance-browser-test.mjs
      - run: node minuta-online-booking/tests/organization-flow-browser-test.mjs
      - run: node minuta-online-booking/tests/organization-flow-provider-integration-test.mjs
      - run: node minuta-online-booking/tests/work-hours-soft-browser-test.mjs
      - run: node minuta-online-booking/tests/retention-delta-browser-test.mjs
      - run: node minuta-online-booking/tests/work-hours-weekly-overflow-browser-test.mjs
      - run: node minuta-online-booking/tests/work-hours-save-hit-browser-test.mjs
      - run: node minuta-online-booking/tests/portfolio-soft-ui-browser-test.mjs
      - name: Upload layout regression evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minuta-layout-regression
          path: ${{ runner.temp }}/theme-regression
          if-no-files-found: ignore
  header-states:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        section: [geometry, tools, appearance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.58.2 @electric-sql/pglite@0.3.10
      - run: npx playwright install --with-deps chromium
      - name: Check provider header ${{ matrix.section }}
        env:
          MINUTA_HEADER_SECTIONS: ${{ matrix.section }}
        run: node minuta-online-booking/tests/header-browser-test.mjs
