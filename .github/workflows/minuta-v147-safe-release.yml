name: Minuta v147 commercial finance safe release
run-name: Minuta v147 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v147
        required: true
        default: test-v147
        type: choice
        options: [test-v147, validate-production-v147, apply-production-v147, observe-production-v147]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v147 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v147 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v147 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: "${{ inputs.phase == 'test-v147' && 'minuta-test-database' || 'minuta-production-database' }}", cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env: { SHA: "${{ inputs.commit_sha }}", PHASE: "${{ inputs.phase }}", CONFIRMATION: "${{ inputs.confirmation }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v147|validate-production-v147|observe-production-v147) ;;
            apply-production-v147) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/tests/commercial-finance-v147-static-test.mjs
      - run: node --check minuta-online-booking/commerce-management.js
      - run: node --check minuta-online-booking/provider.js

  test-v147:
    if: inputs.phase == 'test-v147'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply twice, exercise atomic operations, rollback and reapply
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/commercial-finance-v147-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147-rollback.sql
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('salesDropped',to_regclass('public.commercial_sales') is null,'saleRpcDropped',to_regprocedure('public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid)') is null,'v136Restored',exists(select 1 from pg_constraint where conname='financial_transactions_operation_v136_check'))")"
          jq -e '.salesDropped and .saleRpcDropped and .v136Restored' <<<"$state" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/commercial-finance-v147-integration.sql
      - name: Create isolated test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$(sha256sum minuta-online-booking/supabase-migration-v147.sql|cut -d' ' -f1)" \
            --arg rollback "$(sha256sum minuta-online-booking/supabase-migration-v147-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v147",commitSha:$sha,runId:$run,isolatedDatabase:true,
              coverage:["sale","sale-replay","benefit-issue","inventory-write-off","partial-refund","full-refund","monthly-expense-once","client-history","money-dashboard","role-denial","rollback","reapply"],
              migrationSha256:$migration,rollbackSha256:$rollback,productionWritten:false,businessRowsChanged:false}' > "$RUNNER_TEMP/v147-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v147-test-${{ github.run_id }}", path: "${{ runner.temp }}/v147-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v147:
    if: inputs.phase == 'validate-production-v147'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate production prerequisites and v147 state read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          with flags as(select
            to_regclass('public.client_benefit_instruments') is not null and to_regclass('public.inventory_movements') is not null and to_regclass('public.financial_transactions') is not null prerequisites,
            to_regclass('public.commercial_sales') is not null sales_table,
            to_regclass('public.organization_recurring_expenses') is not null recurring_table,
            to_regprocedure('public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid)') is not null sale_rpc,
            to_regprocedure('public.get_minuta_money_dashboard_v147(uuid,date,date)') is not null money_rpc,
            to_regprocedure('public.get_minuta_client_commerce_v147(uuid,uuid)') is not null client_rpc)
          select json_build_object('prerequisitesReady',prerequisites,'mode',case
            when prerequisites and not sales_table and not recurring_table and not sale_rpc and not money_rpc and not client_rpc then 'ready'
            when prerequisites and sales_table and recurring_table and sale_rpc and money_rpc and client_rpc
              and has_function_privilege('authenticated','public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid)','EXECUTE')
              and not has_function_privilege('anon','public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid)','EXECUTE')
              then 'full' else 'partial' end) from flags;
          rollback;
          SQL
          )"
          state="$(grep '^{' <<<"$state"|tail -n 1)"
          jq -e '.prerequisitesReady and (.mode=="ready" or .mode=="full")' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v147",commitSha:$sha,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v147-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v147-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v147-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v147:
    if: inputs.phase == 'apply-production-v147'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify isolated test, validation, encrypted backup and linked restore
        env: { SHA: "${{ inputs.commit_sha }}", TEST: "${{ inputs.test_run_id }}", VALIDATION: "${{ inputs.validation_run_id }}", BACKUP: "${{ inputs.backup_run_id }}", RESTORE: "${{ inputs.restore_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v147-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v147-safe-release.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v147-test-$TEST" -D "$RUNNER_TEMP/v147-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and (.productionWritten|not) and (.businessRowsChanged|not)' "$RUNNER_TEMP/v147-evidence/test/v147-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v147-safe-release.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v147-validation-$VALIDATION" -D "$RUNNER_TEMP/v147-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and (.state.mode=="ready" or .state.mode=="full")' "$RUNNER_TEMP/v147-evidence/validation/v147-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"; [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v147-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v147-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v147-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v147-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v147-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v147 and verify default-empty protected schema
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v147.sql
          state="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('ready',to_regclass('public.commercial_sales') is not null and to_regprocedure('public.get_minuta_money_dashboard_v147(uuid,date,date)') is not null and has_function_privilege('authenticated','public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid)','EXECUTE') and not has_function_privilege('anon','public.sell_minuta_commercial_product_v147(uuid,uuid,uuid,text,uuid,uuid,uuid,numeric,bigint,bigint,text,uuid,uuid)','EXECUTE'),'sales',(select count(*) from public.commercial_sales),'recurring',(select count(*) from public.organization_recurring_expenses))")"
          jq -e '.ready and .sales==0 and .recurring==0' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"apply-production-v147",commitSha:$sha,state:$state,productionWritten:true,businessRowsChanged:false,secretsExposed:false}' > "$RUNNER_TEMP/v147-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v147-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v147-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v147:
    if: inputs.phase == 'observe-production-v147'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply evidence and observe v147 read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v147-safe-release.yml
          mkdir -p "$RUNNER_TEMP/v147-apply-evidence"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v147-apply-$APPLY" -D "$RUNNER_TEMP/v147-apply-evidence"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .productionWritten and (.businessRowsChanged|not)' "$RUNNER_TEMP/v147-apply-evidence/v147-apply.json" >/dev/null
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select json_build_object('ready',to_regclass('public.commercial_sales') is not null and to_regclass('public.organization_recurring_expenses') is not null and to_regprocedure('public.get_minuta_money_dashboard_v147(uuid,date,date)') is not null,'sales',(select count(*) from public.commercial_sales),'recurring',(select count(*) from public.organization_recurring_expenses))")"
          jq -e '.ready and .sales>=0 and .recurring>=0' <<<"$state" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          do $probe$
          declare target record; workspace jsonb; money jsonb;
          begin
            for target in
              select distinct on (membership.organization_id)
                membership.organization_id, membership.user_id
              from public.organization_memberships membership
              where membership.active and membership.role in ('owner','admin')
              order by membership.organization_id,
                case membership.role when 'owner' then 0 else 1 end,
                membership.user_id
            loop
              perform set_config('request.jwt.claim.sub',target.user_id::text,true);
              workspace:=public.get_minuta_commerce_workspace_v147(target.organization_id);
              money:=public.get_minuta_money_dashboard_v147(target.organization_id,current_date-30,current_date);
              if workspace->>'organization_id'<>target.organization_id::text
                or money->>'organization_id'<>target.organization_id::text then
                raise exception 'v147_production_read_probe_context_mismatch';
              end if;
            end loop;
          end
          $probe$;
          rollback;
          SQL
          jq -n --arg sha "$SHA" --arg apply "$APPLY" --argjson state "$state" '{status:"success",phase:"observe-production-v147",commitSha:$sha,applyRunId:$apply,readOnly:true,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v147-observe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v147-observe-${{ github.run_id }}", path: "${{ runner.temp }}/v147-observe.json", if-no-files-found: error, retention-days: 90 }
