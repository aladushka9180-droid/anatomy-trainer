name: Minuta Eldion brand Edge release
run-name: Eldion brand Edge - ${{ inputs.commit_sha }}
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY_ELDION_BRAND
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: minuta-production-edge-functions
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      SHA: ${{ inputs.commit_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin current main and authorized project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          test "$CONFIRMATION" = DEPLOY_ELDION_BRAND
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$PROJECT_REF" = cawexmmrqjvothcbgjxr
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - name: Check templates without sending anything
        run: |
          set -euo pipefail
          node minuta-online-booking/primetime-pro-brand-v598-test.mjs
          node minuta-online-booking/telegram-reminder-security-v77-static-test.mjs
          deno check minuta-online-booking/supabase/functions/assistant-understand/index.ts
          deno check minuta-online-booking/supabase/functions/telegram-client-notify/index.ts
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v1
        with: { version: 2.117.0 }
      - name: Download current sources and reject unrelated changes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eldion-before/supabase"
          cp minuta-online-booking/supabase/config.toml "$RUNNER_TEMP/eldion-before/supabase/config.toml"
          supabase functions list --project-ref "$PROJECT_REF" --output json > "$RUNNER_TEMP/eldion-functions-before.json"
          jq -e 'any(.[]; .slug == "assistant-understand" and .verify_jwt == true)' "$RUNNER_TEMP/eldion-functions-before.json"
          jq -e 'any(.[]; .slug == "telegram-client-notify" and .verify_jwt == false)' "$RUNNER_TEMP/eldion-functions-before.json"
          for name in assistant-understand telegram-client-notify; do
            supabase functions download "$name" --project-ref "$PROJECT_REF" --use-api --workdir "$RUNNER_TEMP/eldion-before"
          done
          node minuta-online-booking/scripts/eldion-edge-brand-guard.mjs "$RUNNER_TEMP/eldion-before" before > "$RUNNER_TEMP/eldion-edge-before.jsonl"
      - name: Deploy only the two matched brand strings
        working-directory: minuta-online-booking
        run: |
          set -euo pipefail
          supabase functions deploy assistant-understand --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy telegram-client-notify --project-ref "$PROJECT_REF" --use-api
      - name: Verify published source and preserve authentication
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eldion-after/supabase"
          cp minuta-online-booking/supabase/config.toml "$RUNNER_TEMP/eldion-after/supabase/config.toml"
          for name in assistant-understand telegram-client-notify; do
            supabase functions download "$name" --project-ref "$PROJECT_REF" --use-api --workdir "$RUNNER_TEMP/eldion-after"
          done
          node minuta-online-booking/scripts/eldion-edge-brand-guard.mjs "$RUNNER_TEMP/eldion-after" after > "$RUNNER_TEMP/eldion-edge-after.jsonl"
          supabase functions list --project-ref "$PROJECT_REF" --output json > "$RUNNER_TEMP/eldion-functions-after.json"
          jq -e 'any(.[]; .slug == "assistant-understand" and .verify_jwt == true)' "$RUNNER_TEMP/eldion-functions-after.json"
          jq -e 'any(.[]; .slug == "telegram-client-notify" and .verify_jwt == false)' "$RUNNER_TEMP/eldion-functions-after.json"
          # OPTIONS returns before business handlers; no notifications or paid AI requests.
          for name in assistant-understand telegram-client-notify; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request OPTIONS --header 'Origin: https://aladushka9180-droid.github.io' "https://$PROJECT_REF.supabase.co/functions/v1/$name")"
            test "$status" = 200 -o "$status" = 204
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eldion-brand-edge-${{ github.run_id }}
          path: ${{ runner.temp }}/eldion-edge-*.jsonl
          if-no-files-found: ignore
          retention-days: 90
