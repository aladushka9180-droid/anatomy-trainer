name: Minuta D06 financial integration
run-name: Minuta D06 financial integration - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to test
        required: true
        type: string

permissions: { contents: read }
concurrency:
  group: minuta-test-database
  cancel-in-progress: false

jobs:
  pglite:
    name: pglite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_SHA" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - name: Static contract
        run: |
          set -euo pipefail
          node minuta-online-booking/financial-ledger-v129-static-test.mjs
          bash -n minuta-online-booking/tests/financial-ledger-v129-concurrency-test.sh
      - name: PGlite contract
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-save --no-package-lock @electric-sql/pglite@0.3.14
          node minuta-online-booking/tests/financial-ledger-v129-pglite-test.mjs

  financial_integration:
    name: financial_integration
    needs: pglite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: minuta-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_SHA" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Guard isolated test database
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
        run: |
          set -euo pipefail
          node minuta-online-booking/scripts/migration-config-guard.mjs
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target
          where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
      - name: Apply twice, integration, real concurrency, rollback and reapply
        env:
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
          MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
          MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
          MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
          PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=10000"
        run: |
          set -euo pipefail
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          export MINUTA_TEST_DATABASE_URL="$db"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v129.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v129.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/financial-ledger-v129-integration.sql
          bash minuta-online-booking/tests/financial-ledger-v129-concurrency-test.sh
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v129-rollback.sql
          test "$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select to_regclass('public.financial_transactions') is null and to_regprocedure('public.post_minuta_visit_finance_v129(uuid,uuid,uuid,uuid)') is null")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v129.sql
      - name: Create exact-SHA D06 test attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
          MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          schema_fingerprint="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/financial-ledger-v129-schema-fingerprint.sql | tr -d '[:space:]')"
          [[ "$schema_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" --arg fingerprint "$schema_fingerprint" '{
            status:"success", phase:"test-v129", commitSha:$sha, workflowRunId:$run,
            isolatedDatabase:true, productionWritten:false, currentMainVerified:true,
            pglitePassed:true, postgresIntegrationPassed:true, rlsAclVerified:true,
            concurrencyPassed:true, rollbackVerified:true, reapplyVerified:true,
            schemaFingerprint:$fingerprint,
            cycle:["apply","apply","integration","concurrency","rollback","reapply"]
          }' > "$RUNNER_TEMP/v129-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v129-test-${{ github.run_id }}
          path: ${{ runner.temp }}/v129-test.json
          if-no-files-found: error
          retention-days: 35
