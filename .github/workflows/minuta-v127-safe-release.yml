name: Minuta v127 safe release
run-name: Minuta v127 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v127
        required: true
        default: audit-production-v127
        type: choice
        options: [audit-production-v127, apply-production-v127]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful booking/concurrency run ID, required: false, default: "", type: string }
      audit_run_id: { description: Successful read-only audit run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: minuta-production-database, cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env:
          SHA: ${{ inputs.commit_sha }}
          PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            audit-production-v127) ;;
            apply-production-v127) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node minuta-online-booking/primetime-handoff-v127-static-test.mjs

  audit-production-v127:
    if: inputs.phase == 'audit-production-v127'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000"
    steps:
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Audit PrimeTime handoff prerequisites and absent target objects
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          [[ "$MINUTA_PRODUCTION_PROJECT_REF" =~ ^[a-z0-9-]{6,64}$ ]]
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="${SUPABASE_DB_URL/:6543/:5432}"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'workspaceFunction',to_regprocedure('public.get_minuta_workspace()') is not null,
            'pgcrypto',to_regprocedure('extensions.gen_random_bytes(integer)') is not null and to_regprocedure('extensions.digest(bytea,text)') is not null,
            'tableExists',to_regclass('public.primetime_handoffs') is not null,
            'createFunction',to_regprocedure('public.create_primetime_handoff(text)') is not null,
            'consumeFunction',to_regprocedure('public.consume_primetime_handoff(text,text)') is not null
          );
          SQL
          )"
          jq -e '.workspaceFunction and .pgcrypto and (.tableExists|not) and (.createFunction|not) and (.consumeFunction|not)' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"audit-production-v127",commitSha:$sha,productionWritten:false,state:$state}' > "$RUNNER_TEMP/v127-audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v127-audit-${{ github.run_id }}", path: "${{ runner.temp }}/v127-audit.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v127:
    if: inputs.phase == 'apply-production-v127'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify same-SHA test, audit, fresh encrypted backup and current main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
          BACKUP: ${{ inputs.backup_run_id }}
          TEST: ${{ inputs.test_run_id }}
          AUDIT: ${{ inputs.audit_run_id }}
        run: |
          set -euo pipefail
          for id in "$BACKUP" "$TEST" "$AUDIT"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run() {
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"
            test "$(jq -r .conclusion <<<"$run")" = success
            test "$(jq -r .head_sha <<<"$run")" = "$SHA"
            test "$(jq -r .head_branch <<<"$run")" = main
            test "$(jq -r .event <<<"$run")" = workflow_dispatch
            test "$(jq -r .path <<<"$run")" = "$2"
          }
          check_run "$TEST" .github/workflows/minuta-booking-integration.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta booking integration test"
          check_run "$AUDIT" .github/workflows/minuta-v127-safe-release.yml
          test "$(jq -r .display_title <<<"$run")" = "Minuta v127 - audit-production-v127 - $SHA"
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s) - $(date -d "$(jq -r .created_at <<<"$run")" +%s) ))
          test "$age" -ge 0 && test "$age" -le 7200
          mkdir -p "$RUNNER_TEMP/v127-evidence/audit" "$RUNNER_TEMP/v127-evidence/backup"
          gh run download "$AUDIT" -R "$GITHUB_REPOSITORY" -n "v127-audit-$AUDIT" -D "$RUNNER_TEMP/v127-evidence/audit"
          jq -e --arg sha "$SHA" '.status=="success" and .phase=="audit-production-v127" and .commitSha==$sha and .productionWritten==false and .state.workspaceFunction and .state.pgcrypto and (.state.tableExists|not) and (.state.createFunction|not) and (.state.consumeFunction|not)' "$RUNNER_TEMP/v127-evidence/audit/v127-audit.json" >/dev/null
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts")"
          jq -e '[.artifacts[]|select(.expired==false and .size_in_bytes>0)]|length==1' <<<"$artifacts" >/dev/null
          artifact="$(jq -r '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name' <<<"$artifacts")"
          [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v127-evidence/backup"
          shopt -s nullglob
          journals=("$RUNNER_TEMP/v127-evidence/backup/"*.json)
          encrypted=("$RUNNER_TEMP/v127-evidence/backup/"*.dump.gpg)
          checksums=("$RUNNER_TEMP/v127-evidence/backup/"*.dump.gpg.sha256)
          test "${#journals[@]}" = 1 && test "${#encrypted[@]}" = 1 && test "${#checksums[@]}" = 1
          jq -e --arg run "$BACKUP" --arg repo "$GITHUB_REPOSITORY" '.operation=="backup" and .status=="success" and .workflowRunId==$run and .repository==$repo and .encryption=="OpenPGP symmetric AES-256" and .archiveFormat=="PostgreSQL custom" and .archiveEntries>0' "${journals[0]}" >/dev/null
          expected="$(jq -r .encryptedSha256 "${journals[0]}")"
          test "$(sha256sum "${encrypted[0]}" | cut -d' ' -f1)" = "$expected"
          test "$(tr -d '[:space:]' < "${checksums[0]}")" = "$expected"
          test "$(stat -c %s "${encrypted[0]}")" = "$(jq -r .encryptedBytes "${journals[0]}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Repeat exact guard, apply v127 atomically and post-verify read-only
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="${SUPABASE_DB_URL/:6543/:5432}"
          before="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'workspaceFunction',to_regprocedure('public.get_minuta_workspace()') is not null,
            'pgcrypto',to_regprocedure('extensions.gen_random_bytes(integer)') is not null and to_regprocedure('extensions.digest(bytea,text)') is not null,
            'tableExists',to_regclass('public.primetime_handoffs') is not null,
            'createFunction',to_regprocedure('public.create_primetime_handoff(text)') is not null,
            'consumeFunction',to_regprocedure('public.consume_primetime_handoff(text,text)') is not null
          );
          SQL
          )"
          jq -e '.workspaceFunction and .pgcrypto and (.tableExists|not) and (.createFunction|not) and (.consumeFunction|not)' <<<"$before" >/dev/null
          PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=10000' psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v127.sql
          after="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'tableExists',to_regclass('public.primetime_handoffs') is not null,
            'rls',coalesce((select c.relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='primetime_handoffs'),false),
            'createFunction',to_regprocedure('public.create_primetime_handoff(text)') is not null,
            'consumeFunction',to_regprocedure('public.consume_primetime_handoff(text,text)') is not null,
            'createGrant',has_function_privilege('authenticated','public.create_primetime_handoff(text)','execute') and not has_function_privilege('anon','public.create_primetime_handoff(text)','execute'),
            'consumeGrant',has_function_privilege('anon','public.consume_primetime_handoff(text,text)','execute'),
            'tableHidden',not has_table_privilege('anon','public.primetime_handoffs','select') and not has_table_privilege('authenticated','public.primetime_handoffs','select')
          );
          SQL
          )"
          jq -e '.tableExists and .rls and .createFunction and .consumeFunction and .createGrant and .consumeGrant and .tableHidden' <<<"$after" >/dev/null
          jq -n --arg sha "$SHA" --argjson before "$before" --argjson after "$after" '{status:"success",phase:"apply-production-v127",commitSha:$sha,before:$before,after:$after}' > "$RUNNER_TEMP/v127-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v127-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v127-apply.json", if-no-files-found: error, retention-days: 90 }
