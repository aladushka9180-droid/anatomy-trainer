name: Minuta v130 inventory integration

on:
  push:
    paths:
      - '.github/workflows/minuta-v130-inventory-transfer.yml'
      - 'minuta-online-booking/supabase-migration-v130.sql'
      - 'minuta-online-booking/supabase-migration-v130-operational-rollback.sql'
      - 'minuta-online-booking/inventory-transfer-v130-static-test.mjs'
      - 'minuta-online-booking/tests/inventory-transfer-v130-postgres-test.mjs'
  workflow_dispatch:
    inputs:
      run_postgres:
        description: Run the guarded two-connection test on the isolated test database
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: minuta-v130-inventory-test-database
  cancel-in-progress: false

jobs:
  inventory_static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check minuta-online-booking/inventory-transfer-v130-static-test.mjs
      - run: node --check minuta-online-booking/tests/inventory-transfer-v130-postgres-test.mjs
      - run: node minuta-online-booking/inventory-transfer-v130-static-test.mjs

  inventory_integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_postgres
    needs: inventory_static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_MIGRATION_CONFIRM: ${{ vars.MINUTA_TEST_MIGRATION_CONFIRM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts pg@8
      - run: node minuta-online-booking/tests/inventory-transfer-v130-postgres-test.mjs
