name: Minuta v149-v150 benefits safe release
run-name: Minuta v149-v150 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v149-v150
        required: true
        default: test-v149-v150
        type: choice
        options: [test-v149-v150, validate-production-v149-v150, apply-production-v149-v150, observe-production-v149-v150]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v149-v150 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v149-v150 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: "${{ inputs.phase == 'test-v149-v150' && 'minuta-test-database' || 'minuta-production-database' }}", cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env: { SHA: "${{ inputs.commit_sha }}", PHASE: "${{ inputs.phase }}", CONFIRMATION: "${{ inputs.confirmation }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v149-v150|validate-production-v149-v150|observe-production-v149-v150) ;;
            apply-production-v149-v150) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: node minuta-online-booking/tests/benefit-application-v149-static-test.mjs
      - run: node minuta-online-booking/tests/benefit-lifecycle-v150-static-test.mjs
      - run: node minuta-online-booking/tests/benefit-v149-v150-compatibility-test.mjs
      - run: node minuta-online-booking/tests/benefit-v149-v150-rollback-order-static-test.mjs
      - run: node minuta-online-booking/benefit-management-controller-test.mjs

  test-v149-v150:
    if: inputs.phase == 'test-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: npm install --no-save --ignore-scripts playwright@1.58.2 @electric-sql/pglite@0.5.8
      - run: npx playwright install --with-deps chromium
      - name: Static, controller and responsive browser checks
        run: |
          set -euo pipefail
          node minuta-online-booking/benefit-management-controller-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-controller-test.mjs
          node minuta-online-booking/tests/benefit-application-v149-static-test.mjs
          node minuta-online-booking/benefit-lifecycle-v150-static-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-v150-static-test.mjs
          node minuta-online-booking/tests/benefit-v149-v150-compatibility-test.mjs
          node minuta-online-booking/tests/benefit-v149-v150-rollback-order-static-test.mjs
          node minuta-online-booking/tests/benefit-application-v149-browser-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-v150-browser-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-v150-pglite-test.mjs
      - name: Real PostgreSQL application, rollback and integration contour
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          secure="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select position('commercial_refund_amount_mismatch' in pg_get_functiondef('public.refund_minuta_commercial_sale_v147(uuid,uuid,numeric,bigint,text,uuid)'::regprocedure))>0")"
          test "$(tr -d '[:space:]' <<<"$secure")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/benefit-application-v149-lifecycle.sql
          baseline_state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          baseline_state="$(grep '^{' <<<"$baseline_state"|tail -n 1)"
          jq -c '{classification,v149Exact,v150Exact,baselineStatusExact,baselineLedgerConstraintExact}' <<<"$baseline_state"
          jq -e '.classification=="v149-exact" and .v149Exact' <<<"$baseline_state" >/dev/null
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/benefit-v149-v150-rollback-order.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v149.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/benefit-application-v149-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/benefit-lifecycle-v150-integration.sql
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          state="$(grep '^{' <<<"$state"|tail -n 1)"
          jq -e '.classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact' <<<"$state" >/dev/null
      - name: Create isolated test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg v149 "$(sha256sum minuta-online-booking/supabase-migration-v149.sql|cut -d' ' -f1)" \
            --arg v149rollback "$(sha256sum minuta-online-booking/supabase-migration-v149-rollback.sql|cut -d' ' -f1)" \
            --arg v150 "$(sha256sum minuta-online-booking/supabase-migration-v150.sql|cut -d' ' -f1)" \
            --arg v150rollback "$(sha256sum minuta-online-booking/supabase-migration-v150-rollback.sql|cut -d' ' -f1)" \
            --arg v149integration "$(sha256sum minuta-online-booking/tests/benefit-application-v149-integration.sql|cut -d' ' -f1)" \
            --arg v150integration "$(sha256sum minuta-online-booking/tests/benefit-lifecycle-v150-integration.sql|cut -d' ' -f1)" \
            --arg rollbackorder "$(sha256sum minuta-online-booking/tests/benefit-v149-v150-rollback-order.sql|cut -d' ' -f1)" \
            --arg statescript "$(sha256sum minuta-online-booking/scripts/benefits-v149-v150-state.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v149-v150",commitSha:$sha,runId:$run,isolatedDatabase:true,
              engineCoverage:{postgres:["v149-double-apply","v149-rollback-reapply","ordered-v150-v149-rollback","v150-double-apply","v149-v150-integration"],
                pglite:["v150-race-reconciliation","v150-timezone-boundary","v150-rollback-reapply","v150-downgrade-guards"],
                browser:["responsive-390-760-1440","idempotent-retry"]},
              hashes:{v149:$v149,v149Rollback:$v149rollback,v150:$v150,v150Rollback:$v150rollback,
                v149Integration:$v149integration,v150Integration:$v150integration,rollbackOrder:$rollbackorder,stateScript:$statescript},productionWritten:false}' > "$RUNNER_TEMP/v149-v150-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v149-v150-test-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v149-v150:
    if: inputs.phase == 'validate-production-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate production prerequisites read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          state="$(grep '^{' <<<"$state"|tail -n 1)"
          jq -e '.v148Secure and .prerequisites and .invalidTimezoneOrganizations==0
            and (.classification=="v150-phase1-or-complete-exact"
              or ((.classification=="absent" or .classification=="v149-exact") and .baselineStatusExact and .baselineLedgerConstraintExact))' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" --argjson state "$state" '{status:"success",phase:"validate-production-v149-v150",commitSha:$sha,runId:$run,readOnly:true,productionWritten:false,canApply:true,state:$state}' > "$RUNNER_TEMP/v149-v150-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v149-v150-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v149-v150:
    if: inputs.phase == 'apply-production-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify tests, validation, encrypted backup and linked restore
        env: { SHA: "${{ inputs.commit_sha }}", TEST: "${{ inputs.test_run_id }}", VALIDATION: "${{ inputs.validation_run_id }}", BACKUP: "${{ inputs.backup_run_id }}", RESTORE: "${{ inputs.restore_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v149-v150-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v149-v150-benefits-safe-release.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v149-v150-test-$TEST" -D "$RUNNER_TEMP/v149-v150-evidence/test"
          jq -e --arg sha "$SHA" --arg run "$TEST" '.status=="success" and .phase=="test-v149-v150" and .commitSha==$sha and .runId==$run
            and .isolatedDatabase and (.productionWritten|not)
            and (.engineCoverage.postgres|index("ordered-v150-v149-rollback"))!=null
            and (.engineCoverage.pglite|index("v150-rollback-reapply"))!=null
            and (.engineCoverage.browser|index("responsive-390-760-1440"))!=null' "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json" >/dev/null
          test "$(jq -r .hashes.v149 "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/supabase-migration-v149.sql|cut -d' ' -f1)"
          test "$(jq -r .hashes.v149Rollback "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/supabase-migration-v149-rollback.sql|cut -d' ' -f1)"
          test "$(jq -r .hashes.v150 "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/supabase-migration-v150.sql|cut -d' ' -f1)"
          test "$(jq -r .hashes.v150Rollback "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/supabase-migration-v150-rollback.sql|cut -d' ' -f1)"
          test "$(jq -r .hashes.v149Integration "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/tests/benefit-application-v149-integration.sql|cut -d' ' -f1)"
          test "$(jq -r .hashes.v150Integration "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/tests/benefit-lifecycle-v150-integration.sql|cut -d' ' -f1)"
          test "$(jq -r .hashes.rollbackOrder "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/tests/benefit-v149-v150-rollback-order.sql|cut -d' ' -f1)"
          test "$(jq -r .hashes.stateScript "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json")" = "$(sha256sum minuta-online-booking/scripts/benefits-v149-v150-state.sql|cut -d' ' -f1)"
          check_run "$VALIDATION" .github/workflows/minuta-v149-v150-benefits-safe-release.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v149-v150-validation-$VALIDATION" -D "$RUNNER_TEMP/v149-v150-evidence/validation"
          jq -e --arg sha "$SHA" --arg run "$VALIDATION" '.status=="success" and .phase=="validate-production-v149-v150" and .commitSha==$sha and .runId==$run and .readOnly and .canApply and (.productionWritten|not)' "$RUNNER_TEMP/v149-v150-evidence/validation/v149-v150-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts")"
          test "$(jq '[.artifacts[]|select(.expired==false and .size_in_bytes>0)]|length' <<<"$artifacts")" = 1
          artifact="$(jq -r '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name' <<<"$artifacts")"
          [[ "$artifact" =~ ^minuta-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v149-v150-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v149-v150-evidence/backup/"*.dump.gpg); checksums=("$RUNNER_TEMP/v149-v150-evidence/backup/"*.dump.gpg.sha256); journals=("$RUNNER_TEMP/v149-v150-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#checksums[@]}" = 1 && test "${#journals[@]}" = 1
          expected="$(tr -d '[:space:]' < "${checksums[0]}")"; [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$expected"
          jq -e --arg digest "$expected" --arg run "$BACKUP" --arg repository "$GITHUB_REPOSITORY" '
            .schemaVersion==1 and .operation=="backup" and .status=="success" and .repository==$repository
            and .workflowRunId==$run and .encryptedSha256==$digest and .encryptedBytes>0 and .archiveEntries>0
            and .archiveFormat=="PostgreSQL custom" and .encryption=="OpenPGP symmetric AES-256"' "${journals[0]}" >/dev/null
          journal_age=$(( $(date +%s)-$(date -d "$(jq -r .completedAtUtc "${journals[0]}")" +%s) )); test "$journal_age" -ge 0 && test "$journal_age" -le 7200
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v149-v150-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg restore "$RESTORE" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed
            and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha and .workflowRunId==$restore' "$RUNNER_TEMP/v149-v150-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          cp "$RUNNER_TEMP/v149-v150-evidence/validation/v149-v150-validation.json" "$RUNNER_TEMP/validation.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v149-v150 and verify business state
        id: apply
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          validation="$(cat "$RUNNER_TEMP/validation.json")"
          prestate="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          prestate="$(grep '^{' <<<"$prestate"|tail -n 1)"
          jq -e '.v148Secure and .prerequisites and .invalidTimezoneOrganizations==0
            and (.classification=="v150-phase1-or-complete-exact"
              or ((.classification=="absent" or .classification=="v149-exact") and .baselineStatusExact and .baselineLedgerConstraintExact))' <<<"$prestate" >/dev/null
          for key in candidateHash expectedBackfill invalidTimezoneOrganizations baselineStatusHash baselineLedgerConstraintHash classification; do
            test "$(jq -r --arg key "$key" '.state[$key]|tostring' <<<"$validation")" = "$(jq -r --arg key "$key" '.[$key]|tostring' <<<"$prestate")"
          done
          if test "$(jq -r .v150Exact <<<"$prestate")" = true; then
            pre_lifecycle="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'freezePeriods',(select count(*) from public.benefit_freeze_periods),
            'backfilled',(select count(*) from public.benefit_freeze_periods where freeze_reason='Перенесено из прежней заморозки'),
            'missingOpen',(select count(*) from public.client_benefit_instruments i where i.status='frozen' and not exists(select 1 from public.benefit_freeze_periods p where p.instrument_id=i.id and p.thawed_at is null)),
            'missingOpenIds',(select coalesce(jsonb_agg(i.id order by i.id),'[]'::jsonb) from public.client_benefit_instruments i where i.status='frozen' and not exists(select 1 from public.benefit_freeze_periods p where p.instrument_id=i.id and p.thawed_at is null)),
            'orphanOpen',(select count(*) from public.benefit_freeze_periods p join public.client_benefit_instruments i on i.id=p.instrument_id where p.thawed_at is null and i.status<>'frozen')
          );
          SQL
          )"
          else
            pre_lifecycle="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'freezePeriods',0,'backfilled',0,
            'missingOpen',(select count(*) from public.client_benefit_instruments where status='frozen'),
            'missingOpenIds',(select coalesce(jsonb_agg(id order by id),'[]'::jsonb) from public.client_benefit_instruments where status='frozen'),
            'orphanOpen',0
          );
          SQL
          )"
          fi
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v149.sql
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          poststate="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          poststate="$(grep '^{' <<<"$poststate"|tail -n 1)"
          jq -e '.classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0' <<<"$poststate" >/dev/null
          missing_ids="$(jq -c .missingOpenIds <<<"$pre_lifecycle")"
          invariants="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -v missing_ids="$missing_ids" <<'SQL'
          select json_build_object(
            'applicationHistory',(select count(*) from public.benefit_application_requests),
            'lifecycleHistory',(select count(*) from public.benefit_lifecycle_requests),
            'freezePeriods',(select count(*) from public.benefit_freeze_periods),
            'backfilledFreezePeriods',(select count(*) from public.benefit_freeze_periods where freeze_reason='Перенесено из прежней заморозки'),
            'newBackfillMismatch',(select count(*) from public.benefit_freeze_periods period join public.client_benefit_instruments instrument on instrument.id=period.instrument_id
              where period.instrument_id in(select value::uuid from jsonb_array_elements_text(:'missing_ids'::jsonb))
                and period.thawed_at is null and period.freeze_reason='Перенесено из прежней заморозки' and (period.organization_id<>instrument.organization_id
                or period.frozen_at<>instrument.updated_at or period.expires_on_before<>instrument.expires_on or period.frozen_by is distinct from instrument.issued_by)),
            'missingOpen',(select count(*) from public.client_benefit_instruments i where i.status='frozen' and not exists(select 1 from public.benefit_freeze_periods p where p.instrument_id=i.id and p.thawed_at is null)),
            'orphanOpen',(select count(*) from public.benefit_freeze_periods p join public.client_benefit_instruments i on i.id=p.instrument_id where p.thawed_at is null and i.status<>'frozen'),
            'duplicateOpen',(select count(*) from (select instrument_id from public.benefit_freeze_periods where thawed_at is null group by instrument_id having count(*)<>1) duplicate),
            'v149Secure',not has_function_privilege('authenticated','public.apply_minuta_benefit(uuid,uuid,uuid,text,integer)','execute') and has_function_privilege('authenticated','public.apply_minuta_benefit_v149(uuid,uuid,uuid,text,integer,uuid)','execute'),
            'v150Secure',has_function_privilege('authenticated','public.set_minuta_benefit_lifecycle_v150(uuid,uuid,text,text,uuid)','execute') and not has_function_privilege('anon','public.set_minuta_benefit_lifecycle_v150(uuid,uuid,text,text,uuid)','execute')
          );
          SQL
          )"
          inserted=$(( $(jq -r .freezePeriods <<<"$invariants")-$(jq -r .freezePeriods <<<"$pre_lifecycle") ))
          reconciled=$(( $(jq -r .orphanOpen <<<"$pre_lifecycle")-$(jq -r .orphanOpen <<<"$invariants") ))
          test "$inserted" -eq "$(jq -r .missingOpen <<<"$pre_lifecycle")"
          test "$reconciled" -eq "$(jq -r .orphanOpen <<<"$pre_lifecycle")"
          jq -e '.newBackfillMismatch==0 and .missingOpen==0 and .orphanOpen==0 and .duplicateOpen==0 and .v149Secure and .v150Secure' <<<"$invariants" >/dev/null
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" --argjson before "$prestate" --argjson beforeLifecycle "$pre_lifecycle" \
            --argjson after "$poststate" --argjson invariants "$invariants" --argjson inserted "$inserted" --argjson reconciled "$reconciled" \
            '{status:"success",phase:"apply-production-v149-v150",commitSha:$sha,runId:$run,before:$before,beforeLifecycle:$beforeLifecycle,after:$after,invariants:$invariants,
              productionWritten:true,businessRowsChanged:($inserted>0 or $reconciled>0),insertedFreezePeriods:$inserted,reconciledClosedPeriods:$reconciled,secretsExposed:false}' > "$RUNNER_TEMP/v149-v150-apply.json"
      - name: Capture final or partial database state
        if: always()
        env: { SHA: "${{ inputs.commit_sha }}", APPLY_OUTCOME: "${{ steps.apply.outcome }}" }
        run: |
          set -uo pipefail
          set +e
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url 2>/dev/null)"
          guard_code=$?
          state_output=''
          state_code=1
          if test "$guard_code" -eq 0; then
            state_output="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql 2>/dev/null)"
            state_code=$?
          fi
          set -e
          state=''
          state_read=false
          if test "$guard_code" -eq 0 && test "$state_code" -eq 0; then
            state="$(grep '^{' <<<"$state_output"|tail -n 1)"
            if jq -e . >/dev/null 2>&1 <<<"$state"; then state_read=true; fi
          fi
          if test "$state_read" = true; then
            jq -n --arg sha "$SHA" --arg outcome "$APPLY_OUTCOME" --argjson state "$state" \
              '{status:(if $outcome=="success" then "complete" else "partial-or-failed" end),phase:"apply-production-v149-v150-state",commitSha:$sha,applyOutcome:$outcome,stateReadSucceeded:true,state:$state,readOnly:true}' > "$RUNNER_TEMP/v149-v150-state.json"
          else
            jq -n --arg sha "$SHA" --arg outcome "$APPLY_OUTCOME" --argjson guardCode "$guard_code" --argjson stateCode "$state_code" \
              '{status:"state-read-failed",phase:"apply-production-v149-v150-state",commitSha:$sha,applyOutcome:$outcome,stateReadSucceeded:false,guardExitCode:$guardCode,stateExitCode:$stateCode,readOnly:true,secretsIncluded:false}' > "$RUNNER_TEMP/v149-v150-state.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: "v149-v150-state-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-state.json", if-no-files-found: error, retention-days: 90 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v149-v150-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v149-v150:
    if: inputs.phase == 'observe-production-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply evidence and observe read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .path <<<"$run")" = .github/workflows/minuta-v149-v150-benefits-safe-release.yml
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          mkdir -p "$RUNNER_TEMP/v149-v150-apply"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v149-v150-apply-$APPLY" -D "$RUNNER_TEMP/v149-v150-apply"
          jq -e --arg sha "$SHA" --arg run "$APPLY" '.status=="success" and .phase=="apply-production-v149-v150" and .commitSha==$sha and .runId==$run and .productionWritten
            and .after.v149Exact and .after.v150Exact and .invariants.missingOpen==0 and .invariants.orphanOpen==0
            and .invariants.duplicateOpen==0 and .invariants.newBackfillMismatch==0 and .invariants.v149Secure and .invariants.v150Secure' "$RUNNER_TEMP/v149-v150-apply/v149-v150-apply.json" >/dev/null
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          object_state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/benefits-v149-v150-state.sql)"
          object_state="$(grep '^{' <<<"$object_state"|tail -n 1)"
          jq -e '.classification=="v150-phase1-or-complete-exact" and .v149Exact and .v150Exact and .invalidTimezoneOrganizations==0' <<<"$object_state" >/dev/null
          invariants="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'missingOpen',(select count(*) from public.client_benefit_instruments i where i.status='frozen' and not exists(select 1 from public.benefit_freeze_periods p where p.instrument_id=i.id and p.thawed_at is null)),
            'orphanOpen',(select count(*) from public.benefit_freeze_periods p join public.client_benefit_instruments i on i.id=p.instrument_id where p.thawed_at is null and i.status<>'frozen'),
            'duplicateOpen',(select count(*) from (select instrument_id from public.benefit_freeze_periods where thawed_at is null group by instrument_id having count(*)<>1) duplicate),
            'v149Secure',not has_function_privilege('authenticated','public.apply_minuta_benefit(uuid,uuid,uuid,text,integer)','execute') and has_function_privilege('authenticated','public.apply_minuta_benefit_v149(uuid,uuid,uuid,text,integer,uuid)','execute'),
            'v150Secure',has_function_privilege('authenticated','public.set_minuta_benefit_lifecycle_v150(uuid,uuid,text,text,uuid)','execute') and not has_function_privilege('anon','public.set_minuta_benefit_lifecycle_v150(uuid,uuid,text,text,uuid)','execute')
          );
          SQL
          )"
          jq -e '.missingOpen==0 and .orphanOpen==0 and .duplicateOpen==0 and .v149Secure and .v150Secure' <<<"$invariants" >/dev/null
          jq -n --arg sha "$SHA" --arg run "$APPLY" --argjson state "$object_state" --argjson invariants "$invariants" \
            '{status:"success",phase:"observe-production-v149-v150",commitSha:$sha,applyRunId:$run,state:$state,invariants:$invariants,readOnly:true,productionWritten:false}' > "$RUNNER_TEMP/v149-v150-observation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v149-v150-observation-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-observation.json", if-no-files-found: error, retention-days: 90 }
