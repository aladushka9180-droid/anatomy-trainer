name: Minuta v149-v150 benefits safe release
run-name: Minuta v149-v150 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v149-v150
        required: true
        default: test-v149-v150
        type: choice
        options: [test-v149-v150, validate-production-v149-v150, apply-production-v149-v150, observe-production-v149-v150]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful isolated v149-v150 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v149-v150 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency: { group: "${{ inputs.phase == 'test-v149-v150' && 'minuta-test-database' || 'minuta-production-database' }}", cancel-in-progress: false }
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact current main commit and phase
        env: { SHA: "${{ inputs.commit_sha }}", PHASE: "${{ inputs.phase }}", CONFIRMATION: "${{ inputs.confirmation }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v149-v150|validate-production-v149-v150|observe-production-v149-v150) ;;
            apply-production-v149-v150) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: node minuta-online-booking/tests/benefit-application-v149-static-test.mjs
      - run: node minuta-online-booking/tests/benefit-lifecycle-v150-static-test.mjs
      - run: node minuta-online-booking/tests/benefit-v149-v150-compatibility-test.mjs
      - run: node minuta-online-booking/benefit-management-controller-test.mjs

  test-v149-v150:
    if: inputs.phase == 'test-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: minuta-test
    env:
      MINUTA_TEST_DATABASE_URL: ${{ secrets.MINUTA_TEST_DATABASE_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      MINUTA_TEST_PROJECT_REF: ${{ vars.MINUTA_TEST_PROJECT_REF }}
      PGOPTIONS: -c statement_timeout=120000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: npm install --no-save --ignore-scripts playwright@1.58.2 @electric-sql/pglite
      - run: npx playwright install --with-deps chromium
      - name: Static, controller and responsive browser checks
        run: |
          set -euo pipefail
          node minuta-online-booking/benefit-management-controller-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-controller-test.mjs
          node minuta-online-booking/tests/benefit-application-v149-static-test.mjs
          node minuta-online-booking/benefit-lifecycle-v150-static-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-v150-static-test.mjs
          node minuta-online-booking/tests/benefit-v149-v150-compatibility-test.mjs
          node minuta-online-booking/tests/benefit-application-v149-browser-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-v150-browser-test.mjs
          node minuta-online-booking/tests/benefit-lifecycle-v150-pglite-test.mjs
      - name: Real PostgreSQL application, rollback and integration contour
        run: |
          set -euo pipefail
          test "$MINUTA_TEST_PROJECT_REF" != "$MINUTA_PRODUCTION_PROJECT_REF"
          db="${MINUTA_TEST_DATABASE_URL/:6543/:5432}"
          marker="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 --set=expected_ref="$MINUTA_TEST_PROJECT_REF" <<'SQL'
          select count(*) from minuta_migration_guard.target where project_ref=:'expected_ref' and allow_migrations is true;
          SQL
          )"
          test "$(tr -d '[:space:]' <<<"$marker")" = 1
          secure="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select position('commercial_refund_amount_mismatch' in pg_get_functiondef('public.refund_minuta_commercial_sale_v147(uuid,uuid,numeric,bigint,text,uuid)'::regprocedure))>0")"
          test "$(tr -d '[:space:]' <<<"$secure")" = t
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/benefit-application-v149-lifecycle.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/benefit-application-v149-integration.sql
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/tests/benefit-lifecycle-v150-integration.sql
      - name: Create isolated test attestation
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          jq -n --arg sha "$SHA" --arg run "$GITHUB_RUN_ID" \
            --arg v149 "$(sha256sum minuta-online-booking/supabase-migration-v149.sql|cut -d' ' -f1)" \
            --arg v149rollback "$(sha256sum minuta-online-booking/supabase-migration-v149-rollback.sql|cut -d' ' -f1)" \
            --arg v150 "$(sha256sum minuta-online-booking/supabase-migration-v150.sql|cut -d' ' -f1)" \
            --arg v150rollback "$(sha256sum minuta-online-booking/supabase-migration-v150-rollback.sql|cut -d' ' -f1)" \
            '{status:"success",phase:"test-v149-v150",commitSha:$sha,runId:$run,isolatedDatabase:true,
              coverage:["v149-double-apply","v149-rollback-reapply","v149-acl-rls","v149-replay-linkage","v150-double-apply","v150-race-reconciliation","v150-timezone-boundary","v150-rollback-reapply","v149-v150-compatibility","responsive-390-760-1440"],
              hashes:{v149:$v149,v149Rollback:$v149rollback,v150:$v150,v150Rollback:$v150rollback},productionWritten:false}' > "$RUNNER_TEMP/v149-v150-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v149-v150-test-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-test.json", if-no-files-found: error, retention-days: 35 }

  validate-production-v149-v150:
    if: inputs.phase == 'validate-production-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate production prerequisites read-only
        env: { SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -euo pipefail
          test "$MINUTA_PRODUCTION_PROJECT_REF" = cawexmmrqjvothcbgjxr
          [[ "$SUPABASE_DB_URL" == *"$MINUTA_PRODUCTION_PROJECT_REF"* ]]
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          begin transaction isolation level repeatable read read only;
          select json_build_object(
            'v148Secure',position('commercial_refund_amount_mismatch' in pg_get_functiondef('public.refund_minuta_commercial_sale_v147(uuid,uuid,numeric,bigint,text,uuid)'::regprocedure))>0,
            'prerequisites',to_regclass('public.client_benefit_instruments') is not null and to_regclass('public.benefit_redemptions') is not null
              and to_regclass('public.locations') is not null and to_regprocedure('public.apply_minuta_benefit(uuid,uuid,uuid,text,integer)') is not null
              and to_regprocedure('public.get_minuta_client_commerce_v147(uuid,uuid)') is not null,
            'v149Present',to_regprocedure('public.apply_minuta_benefit_v149(uuid,uuid,uuid,text,integer,uuid)') is not null,
            'v149TablePresent',to_regclass('public.benefit_application_requests') is not null,
            'v150Present',to_regprocedure('public.set_minuta_benefit_lifecycle_v150(uuid,uuid,text,text,uuid)') is not null,
            'v150TablesPresent',to_regclass('public.benefit_freeze_periods') is not null and to_regclass('public.benefit_lifecycle_requests') is not null,
            'invalidTimezoneOrganizations',(select count(distinct instrument.organization_id) from public.client_benefit_instruments instrument where not exists(
              select 1 from public.locations location join pg_catalog.pg_timezone_names zone on zone.name=location.timezone
              where location.organization_id=instrument.organization_id and location.active)),
            'expectedBackfill',(select count(*) from public.client_benefit_instruments instrument where instrument.status='frozen'),
            'candidateHash',(select md5(coalesce(string_agg(instrument.id::text,',' order by instrument.id),'')) from public.client_benefit_instruments instrument where instrument.status='frozen'),
            'sales',(select count(*) from public.commercial_sales),'refunds',(select count(*) from public.commercial_sale_refunds),
            'transactions',(select count(*) from public.financial_transactions),'redemptions',(select count(*) from public.benefit_redemptions)
          );
          rollback;
          SQL
          )"
          state="$(grep '^{' <<<"$state"|tail -n 1)"
          jq -e '.v148Secure and .prerequisites and .invalidTimezoneOrganizations==0
            and (.v149Present|not) and (.v149TablePresent|not) and (.v150Present|not) and (.v150TablesPresent|not)' <<<"$state" >/dev/null
          jq -n --arg sha "$SHA" --argjson state "$state" '{status:"success",phase:"validate-production-v149-v150",commitSha:$sha,readOnly:true,productionWritten:false,canApply:true,state:$state}' > "$RUNNER_TEMP/v149-v150-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v149-v150-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-validation.json", if-no-files-found: error, retention-days: 35 }

  apply-production-v149-v150:
    if: inputs.phase == 'apply-production-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Verify tests, validation, encrypted backup and linked restore
        env: { SHA: "${{ inputs.commit_sha }}", TEST: "${{ inputs.test_run_id }}", VALIDATION: "${{ inputs.validation_run_id }}", BACKUP: "${{ inputs.backup_run_id }}", RESTORE: "${{ inputs.restore_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          for id in "$TEST" "$VALIDATION" "$BACKUP" "$RESTORE"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run")" = success; test "$(jq -r .head_sha <<<"$run")" = "$SHA"; test "$(jq -r .head_branch <<<"$run")" = main; test "$(jq -r .event <<<"$run")" = workflow_dispatch; test "$(jq -r .path <<<"$run")" = "$2"; }
          mkdir -p "$RUNNER_TEMP/v149-v150-evidence"/{test,validation,backup,restore}
          check_run "$TEST" .github/workflows/minuta-v149-v150-benefits-safe-release.yml
          gh run download "$TEST" -R "$GITHUB_REPOSITORY" -n "v149-v150-test-$TEST" -D "$RUNNER_TEMP/v149-v150-evidence/test"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .isolatedDatabase and (.productionWritten|not)' "$RUNNER_TEMP/v149-v150-evidence/test/v149-v150-test.json" >/dev/null
          check_run "$VALIDATION" .github/workflows/minuta-v149-v150-benefits-safe-release.yml
          gh run download "$VALIDATION" -R "$GITHUB_REPOSITORY" -n "v149-v150-validation-$VALIDATION" -D "$RUNNER_TEMP/v149-v150-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .readOnly and .canApply' "$RUNNER_TEMP/v149-v150-evidence/validation/v149-v150-validation.json" >/dev/null
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run")" +%s) )); test "$age" -ge 0 && test "$age" -le 7200
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name')"; [[ "$artifact" == minuta-* ]]
          gh run download "$BACKUP" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/v149-v150-evidence/backup"
          shopt -s nullglob; encrypted=("$RUNNER_TEMP/v149-v150-evidence/backup/"*.dump.gpg); journals=("$RUNNER_TEMP/v149-v150-evidence/backup/"*.json)
          test "${#encrypted[@]}" = 1 && test "${#journals[@]}" = 1
          test "$(sha256sum "${encrypted[0]}"|cut -d' ' -f1)" = "$(jq -r .encryptedSha256 "${journals[0]}")"
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          gh run download "$RESTORE" -R "$GITHUB_REPOSITORY" -n "minuta-ephemeral-restore-$RESTORE" -D "$RUNNER_TEMP/v149-v150-evidence/restore"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$RUNNER_TEMP/v149-v150-evidence/restore/minuta-ephemeral-restore.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          cp "$RUNNER_TEMP/v149-v150-evidence/validation/v149-v150-validation.json" "$RUNNER_TEMP/validation.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply v149-v150 and verify business state
        env: { SHA: "${{ inputs.commit_sha }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          before="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'sales',(select count(*) from public.commercial_sales),'refunds',(select count(*) from public.commercial_sale_refunds),
            'transactions',(select count(*) from public.financial_transactions),'redemptions',(select count(*) from public.benefit_redemptions),
            'ledger',(select count(*) from public.benefit_ledger),
            'instrumentDigest',(select md5(coalesce(string_agg(concat_ws(':',id,status,expires_on,remaining_amount_rub,remaining_visits),',' order by id),'')) from public.client_benefit_instruments),
            'frozen',(select count(*) from public.client_benefit_instruments where status='frozen'),
            'candidateHash',(select md5(coalesce(string_agg(id::text,',' order by id),'')) from public.client_benefit_instruments where status='frozen')
          );
          SQL
          )"
          validation="$(cat "$RUNNER_TEMP/validation.json")"
          test "$(jq -r .state.candidateHash <<<"$validation")" = "$(jq -r .candidateHash <<<"$before")"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v149.sql
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v150.sql
          after="$(PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000' psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'sales',(select count(*) from public.commercial_sales),'refunds',(select count(*) from public.commercial_sale_refunds),
            'transactions',(select count(*) from public.financial_transactions),'redemptions',(select count(*) from public.benefit_redemptions),
            'ledger',(select count(*) from public.benefit_ledger),
            'instrumentDigest',(select md5(coalesce(string_agg(concat_ws(':',id,status,expires_on,remaining_amount_rub,remaining_visits),',' order by id),'')) from public.client_benefit_instruments),
            'applicationHistory',(select count(*) from public.benefit_application_requests),
            'lifecycleHistory',(select count(*) from public.benefit_lifecycle_requests),
            'freezePeriods',(select count(*) from public.benefit_freeze_periods),
            'missingOpen',(select count(*) from public.client_benefit_instruments i where i.status='frozen' and not exists(select 1 from public.benefit_freeze_periods p where p.instrument_id=i.id and p.thawed_at is null)),
            'orphanOpen',(select count(*) from public.benefit_freeze_periods p join public.client_benefit_instruments i on i.id=p.instrument_id where p.thawed_at is null and i.status<>'frozen'),
            'duplicateOpen',(select count(*) from (select instrument_id from public.benefit_freeze_periods where thawed_at is null group by instrument_id having count(*)<>1) duplicate),
            'v149Secure',not has_function_privilege('authenticated','public.apply_minuta_benefit(uuid,uuid,uuid,text,integer)','execute') and has_function_privilege('authenticated','public.apply_minuta_benefit_v149(uuid,uuid,uuid,text,integer,uuid)','execute'),
            'v150Secure',has_function_privilege('authenticated','public.set_minuta_benefit_lifecycle_v150(uuid,uuid,text,text,uuid)','execute') and not has_function_privilege('anon','public.set_minuta_benefit_lifecycle_v150(uuid,uuid,text,text,uuid)','execute')
          );
          SQL
          )"
          jq -e --argjson before "$before" '.sales==$before.sales and .refunds==$before.refunds and .transactions==$before.transactions
            and .redemptions==$before.redemptions and .ledger==$before.ledger and .instrumentDigest==$before.instrumentDigest
            and .applicationHistory==0 and .lifecycleHistory==0 and .missingOpen==0 and .orphanOpen==0 and .duplicateOpen==0 and .v149Secure and .v150Secure' <<<"$after" >/dev/null
          jq -n --arg sha "$SHA" --argjson before "$before" --argjson after "$after" '{status:"success",phase:"apply-production-v149-v150",commitSha:$sha,before:$before,after:$after,productionWritten:true,businessRowsChanged:($after.freezePeriods>0),backfilledFreezePeriods:$after.freezePeriods,secretsExposed:false}' > "$RUNNER_TEMP/v149-v150-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "v149-v150-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v149-v150-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v149-v150:
    if: inputs.phase == 'observe-production-v149-v150'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify apply evidence and observe read-only
        env: { SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$SHA"
          mkdir -p "$RUNNER_TEMP/v149-v150-apply"
          gh run download "$APPLY" -R "$GITHUB_REPOSITORY" -n "v149-v150-apply-$APPLY" -D "$RUNNER_TEMP/v149-v150-apply"
          jq -e --arg sha "$SHA" '.status=="success" and .commitSha==$sha and .productionWritten and .after.missingOpen==0 and .after.orphanOpen==0 and .after.duplicateOpen==0 and .after.v149Secure and .after.v150Secure' "$RUNNER_TEMP/v149-v150-apply/v149-v150-apply.json" >/dev/null
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          select json_build_object(
            'v149',to_regprocedure('public.apply_minuta_benefit_v149(uuid,uuid,uuid,text,integer,uuid)') is not null,
