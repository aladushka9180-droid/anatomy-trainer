name: Minuta v166 loyalty program release
run-name: Minuta v166 - ${{ inputs.phase }} - ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Production-safe phase for v166
        required: true
        default: test-v166
        type: choice
        options: [test-v166, validate-production-v166, apply-production-v166, observe-production-v166]
      commit_sha: { description: Exact 40-character main commit SHA, required: true, type: string }
      backup_run_id: { description: Fresh encrypted backup run ID, required: false, default: "", type: string }
      restore_run_id: { description: Linked offline restore run ID, required: false, default: "", type: string }
      test_run_id: { description: Successful v166 test run ID, required: false, default: "", type: string }
      validation_run_id: { description: Successful read-only v166 validation run ID, required: false, default: "", type: string }
      apply_run_id: { description: Successful v166 apply run ID, required: false, default: "", type: string }
      confirmation: { description: Enter BACKUP_VERIFIED for production apply, required: false, default: "", type: string }

permissions: { contents: read, actions: read }
concurrency:
  group: "${{ inputs.phase == 'test-v166' && 'minuta-test-database' || 'minuta-production-database' }}"
  cancel-in-progress: false
defaults:
  run: { shell: bash }

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Pin exact main commit and phase
        env: { SHA: "${{ inputs.commit_sha }}", PHASE: "${{ inputs.phase }}", CONFIRMATION: "${{ inputs.confirmation }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
          case "$PHASE" in
            test-v166|validate-production-v166|observe-production-v166) ;;
            apply-production-v166) test "$CONFIRMATION" = BACKUP_VERIFIED ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node --check minuta-online-booking/provider.js && node --check minuta-online-booking/loyalty-program-v166.js && node minuta-online-booking/loyalty-program-v166-static-test.mjs

  test-v166:
    if: inputs.phase == 'test-v166'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install isolated test runtimes
        run: npm install --ignore-scripts --no-save @electric-sql/pglite@0.3.10 playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Prove migration, rollback, UI, themes and retry recovery
        run: |
          set -euo pipefail
          node minuta-online-booking/tests/loyalty-program-v166-pglite-test.mjs
          node minuta-online-booking/tests/loyalty-program-v166-browser-test.mjs
          node minuta-online-booking/tests/client-relationship-appearance-browser-test.mjs
          node minuta-online-booking/client-relationship-test.mjs
          node minuta-online-booking/provider-startup-performance-v565-test.mjs
          node minuta-online-booking/tests/provider-mobile-more-browser-test.mjs
          node minuta-online-booking/client-url-redirect-test.mjs
          node minuta-online-booking/loyalty-program-v166-static-test.mjs
          jq -n --arg sha "${{ inputs.commit_sha }}" '{status:"success",phase:"test-v166",commitSha:$sha,cycle:["apply","retry","integration","operational-rollback","data-preservation"],themeWidthChecks:200,productionWritten:false,businessRowsChanged:false}' > "$RUNNER_TEMP/v166-test.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v166-test-${{ github.run_id }}", path: "${{ runner.temp }}/v166-test.json", if-no-files-found: error, retention-days: 90 }

  validate-production-v166:
    if: inputs.phase == 'validate-production-v166'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Read-only production validation
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/loyalty-program-v166-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.classification=="absent" or (.classification=="exact" and .authenticatedSetExecute and .authenticatedAdjustExecute and .authenticatedRedeemExecute and .authenticatedWorkspaceExecute and .anonClientExecute and .authenticatedClientExecute and (.authenticatedDirectSettings|not) and (.anonDirectRewards|not))) and .structuralExact' <<<"$state" >/dev/null
          jq -n --arg sha "${{ inputs.commit_sha }}" --argjson state "$state" '{status:"success",phase:"validate-production-v166",commitSha:$sha,state:$state,readOnly:true,productionWritten:false}' > "$RUNNER_TEMP/v166-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v166-validation-${{ github.run_id }}", path: "${{ runner.temp }}/v166-validation.json", if-no-files-found: error, retention-days: 90 }

  apply-production-v166:
    if: inputs.phase == 'apply-production-v166'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - name: Verify pinned test, validation, backup, restore and current main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
          BACKUP: ${{ inputs.backup_run_id }}
          RESTORE: ${{ inputs.restore_run_id }}
          TEST: ${{ inputs.test_run_id }}
          VALIDATION: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail
          for id in "$BACKUP" "$RESTORE" "$TEST" "$VALIDATION"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          check_run(){ run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1")"; test "$(jq -r .conclusion <<<"$run_json")" = success; test "$(jq -r .head_sha <<<"$run_json")" = "$SHA"; test "$(jq -r .head_branch <<<"$run_json")" = main; test "$(jq -r .event <<<"$run_json")" = workflow_dispatch; test "$(jq -r .path <<<"$run_json")" = "$2"; }
          check_run "$TEST" .github/workflows/minuta-v166-loyalty-program.yml
          test "$(jq -r .display_title <<<"$run_json")" = "Minuta v166 - test-v166 - $SHA"
          check_run "$VALIDATION" .github/workflows/minuta-v166-loyalty-program.yml
          test "$(jq -r .display_title <<<"$run_json")" = "Minuta v166 - validate-production-v166 - $SHA"
          check_run "$BACKUP" .github/workflows/minuta-supabase-backup.yml
          backup_age=$(( $(date +%s)-$(date -d "$(jq -r .created_at <<<"$run_json")" +%s) ))
          test "$backup_age" -ge 0 && test "$backup_age" -le 7200
          check_run "$RESTORE" .github/workflows/minuta-supabase-restore-drill.yml
          mkdir -p "$RUNNER_TEMP/v166-evidence"/{test,validation,backup,restore}
          gh run download "$TEST" -n "v166-test-$TEST" -D "$RUNNER_TEMP/v166-evidence/test"
          gh run download "$VALIDATION" -n "v166-validation-$VALIDATION" -D "$RUNNER_TEMP/v166-evidence/validation"
          jq -e --arg sha "$SHA" '.status=="success" and .phase=="test-v166" and .commitSha==$sha and (.productionWritten|not) and (.businessRowsChanged|not)' "$RUNNER_TEMP/v166-evidence/test/v166-test.json" >/dev/null
          jq -e --arg sha "$SHA" '.status=="success" and .phase=="validate-production-v166" and .commitSha==$sha and .readOnly and (.productionWritten|not)' "$RUNNER_TEMP/v166-evidence/validation/v166-validation.json" >/dev/null
          backup_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name' | head -n1)"
          restore_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESTORE/artifacts" --jq '.artifacts[]|select(.expired==false and .size_in_bytes>0)|.name' | head -n1)"
          test -n "$backup_name" && test -n "$restore_name"
          gh run download "$BACKUP" -n "$backup_name" -D "$RUNNER_TEMP/v166-evidence/backup"
          gh run download "$RESTORE" -n "$restore_name" -D "$RUNNER_TEMP/v166-evidence/restore"
          restore_json="$(find "$RUNNER_TEMP/v166-evidence/restore" -type f -name '*.json' -print -quit)"
          jq -e --arg backup "$BACKUP" --arg sha "$SHA" '.status=="success" and .networkMode=="none" and .ephemeralContainerDestroyed and (.productionWritten|not) and .sourceBackupRunId==$backup and .sourceBackupSha==$sha' "$restore_json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SHA"
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply exact v166 contract and verify
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          before="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/loyalty-program-v166-state.sql | grep '^{' | tail -n 1)"
          jq -e '(.classification=="absent" or .classification=="exact") and .structuralExact' <<<"$before" >/dev/null
          applied=false
          if test "$(jq -r .classification <<<"$before")" = absent; then psql "$db" -X -q -v ON_ERROR_STOP=1 -f minuta-online-booking/supabase-migration-v166.sql; applied=true; fi
          after="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/loyalty-program-v166-state.sql | grep '^{' | tail -n 1)"
          jq -e '.classification=="exact" and .structuralExact and .authenticatedSetExecute and .authenticatedAdjustExecute and .authenticatedRedeemExecute and .authenticatedWorkspaceExecute and .anonClientExecute and .authenticatedClientExecute and (.authenticatedDirectSettings|not) and (.anonDirectRewards|not)' <<<"$after" >/dev/null
          jq -n --arg sha "${{ inputs.commit_sha }}" --argjson before "$before" --argjson after "$after" --argjson written "$applied" '{status:"success",phase:"apply-production-v166",commitSha:$sha,before:$before,after:$after,productionWritten:$written,businessRowsChanged:false}' > "$RUNNER_TEMP/v166-apply.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v166-apply-${{ github.run_id }}", path: "${{ runner.temp }}/v166-apply.json", if-no-files-found: error, retention-days: 90 }

  observe-production-v166:
    if: inputs.phase == 'observe-production-v166'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minuta-production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MINUTA_PRODUCTION_PROJECT_REF: ${{ vars.MINUTA_PRODUCTION_PROJECT_REF }}
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ inputs.commit_sha }}", persist-credentials: false }
      - name: Verify exact apply run
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ inputs.commit_sha }}", APPLY: "${{ inputs.apply_run_id }}" }
        run: |
          set -euo pipefail
          [[ "$APPLY" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLY")"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = "$SHA"
          test "$(jq -r .path <<<"$run_json")" = .github/workflows/minuta-v166-loyalty-program.yml
          test "$(jq -r .display_title <<<"$run_json")" = "Minuta v166 - apply-production-v166 - $SHA"
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources && sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify production state and health read-only
        run: |
          set -euo pipefail
          db="$(node minuta-online-booking/scripts/production-db-target-guard.mjs --session-url)"
          bash minuta-online-booking/scripts/production-db-schema-guard.sh "$db"
          state="$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -f minuta-online-booking/scripts/loyalty-program-v166-state.sql | grep '^{' | tail -n 1)"
          jq -e '.classification=="exact" and .structuralExact and .outcomeTrigger and .bookingTrigger and .authenticatedSetExecute and .authenticatedAdjustExecute and .authenticatedRedeemExecute and .authenticatedWorkspaceExecute and .anonClientExecute and .authenticatedClientExecute and (.authenticatedDirectSettings|not) and (.anonDirectRewards|not)' <<<"$state" >/dev/null
          printf '%s\n' "$state" > "$RUNNER_TEMP/v166-observation.json"
          node minuta-online-booking/production-health-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "v166-observation-${{ github.run_id }}", path: "${{ runner.temp }}/v166-observation.json", if-no-files-found: error, retention-days: 90 }
