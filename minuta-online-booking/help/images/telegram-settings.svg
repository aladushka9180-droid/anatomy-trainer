<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Настройки Telegram</title><desc id="desc">Схема поля публичного username и переключателей событий для уведомлений клиентам.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f6f4"/><rect x="152" y="48" width="896" height="579" rx="28" fill="#fff" stroke="#dce5df" stroke-width="2"/>
  <text x="204" y="116" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="750">Telegram-уведомления</text><text x="204" y="151" fill="#657269" font-family="Inter,Segoe UI,sans-serif" font-size="17">Сообщения отправляет бот Minuta</text>
  <text x="204" y="211" fill="#657269" font-family="Inter,Segoe UI,sans-serif" font-size="15">Ваш Telegram</text><rect x="204" y="226" width="792" height="64" rx="14" fill="#f8faf8" stroke="#cfdad3"/><text x="228" y="266" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="600">@username</text><circle cx="996" cy="226" r="20" fill="#16794a"/><text x="996" y="233" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="750">1</text>
  <text x="204" y="344" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Что отправлять клиенту</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="17" fill="#17211b"><text x="204" y="397">Новая запись</text><text x="204" y="447">Напоминание за сутки</text><text x="204" y="497">Перенос записи</text><text x="204" y="547">Отмена записи</text></g>
  <g><rect x="904" y="373" width="68" height="36" rx="18" fill="#16794a"/><circle cx="951" cy="391" r="14" fill="#fff"/><rect x="904" y="423" width="68" height="36" rx="18" fill="#16794a"/><circle cx="951" cy="441" r="14" fill="#fff"/><rect x="904" y="473" width="68" height="36" rx="18" fill="#d5ddd8"/><circle cx="923" cy="491" r="14" fill="#fff"/><rect x="904" y="523" width="68" height="36" rx="18" fill="#16794a"/><circle cx="951" cy="541" r="14" fill="#fff"/></g>
  <circle cx="996" cy="344" r="20" fill="#16794a"/><text x="996" y="351" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="750">2</text><rect x="760" y="570" width="236" height="48" rx="24" fill="#17211b"/><text x="878" y="601" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Сохранить</text><circle cx="996" cy="570" r="20" fill="#16794a"/><text x="996" y="577" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="750">3</text>
</svg>
