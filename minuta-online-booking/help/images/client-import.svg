<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Импорт клиентов</title><desc id="desc">Схема выбора файла, сопоставления имени и телефона и предварительной проверки.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f6f4"/><rect x="92" y="58" width="1016" height="559" rx="26" fill="#fff" stroke="#dce5df" stroke-width="2"/>
  <text x="132" y="124" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="750">Импорт клиентов</text><text x="132" y="158" fill="#657269" font-family="Inter,Segoe UI,sans-serif" font-size="17">XLS, XLSX, CSV, TSV или TXT · до 12 МБ</text>
  <rect x="132" y="196" width="936" height="92" rx="18" fill="#f8faf8" stroke="#cfdad3" stroke-dasharray="7 7" stroke-width="2"/><path d="M176 252v-28m-11 11 11-11 11 11m-25 23h28" fill="none" stroke="#16794a" stroke-width="3" stroke-linecap="round"/><text x="218" y="238" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">client-base.xlsx</text><text x="218" y="265" fill="#657269" font-family="Inter,Segoe UI,sans-serif" font-size="15">Файл выбран</text><circle cx="1032" cy="242" r="20" fill="#16794a"/><path d="m1022 242 7 7 13-15" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="132" y="336" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Сопоставьте столбцы</text><rect x="132" y="360" width="436" height="66" rx="14" fill="#fff" stroke="#cfdad3"/><text x="152" y="385" fill="#657269" font-family="Inter,Segoe UI,sans-serif" font-size="14">Имя клиента</text><text x="152" y="410" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="600">Имя</text><path d="m536 386 8 8 8-8" fill="none" stroke="#627067" stroke-width="2"/>
  <rect x="588" y="360" width="480" height="66" rx="14" fill="#fff" stroke="#cfdad3"/><text x="608" y="385" fill="#657269" font-family="Inter,Segoe UI,sans-serif" font-size="14">Телефон</text><text x="608" y="410" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="600">Номер телефона</text><path d="m1036 386 8 8 8-8" fill="none" stroke="#627067" stroke-width="2"/>
  <rect x="132" y="470" width="290" height="58" rx="29" fill="#17211b"/><text x="277" y="506" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">Проверить файл</text><rect x="454" y="470" width="614" height="92" rx="16" fill="#e8f5ed"/><circle cx="490" cy="516" r="18" fill="#16794a"/><path d="m482 516 6 6 11-13" fill="none" stroke="#fff" stroke-width="3"/><text x="522" y="508" fill="#126c41" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">Готово к импорту: 124 клиента</text><text x="522" y="535" fill="#40705a" font-family="Inter,Segoe UI,sans-serif" font-size="15">3 дубля будут пропущены</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="750" text-anchor="middle"><circle cx="132" cy="196" r="19" fill="#16794a"/><text x="132" y="202" fill="#fff">1</text><circle cx="132" cy="360" r="19" fill="#16794a"/><text x="132" y="366" fill="#fff">2</text><circle cx="422" cy="470" r="19" fill="#16794a"/><text x="422" y="476" fill="#fff">3</text></g>
</svg>
