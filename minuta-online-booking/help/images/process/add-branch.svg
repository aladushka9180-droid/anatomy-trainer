<svg xmlns="http://www.w3.org/2000/svg" width="560" height="484" viewBox="0 0 560 484" role="img" aria-labelledby="title desc"><title id="title">Как добавить и настроить филиал — схема процесса</title><desc id="desc">Схема этапов, не снимок интерфейса. Название и адрес → Проверка адреса → Сохранение → Клиентская страница. Подробные действия описаны в статье.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a3446c" stroke-width="2"/></marker></defs><rect width="560" height="484" rx="20" fill="#fff7fa"/><g font-family="Arial, Segoe UI, sans-serif"><rect x="20" y="24" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="78" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Название и адрес</tspan></text><path d="M280 118v16" stroke="#a3446c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="140" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="194" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Проверка адреса</tspan></text><path d="M280 234v16" stroke="#a3446c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="256" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="310" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Сохранение</tspan></text><path d="M280 350v16" stroke="#a3446c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="372" width="520" height="88" rx="16" fill="#fce7ef" stroke="#ead5df" stroke-width="2"/><text x="280" y="426" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Клиентская страница</tspan></text></g></svg>
