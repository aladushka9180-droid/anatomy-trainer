<svg xmlns="http://www.w3.org/2000/svg" width="560" height="332" viewBox="0 0 560 332" role="img" aria-labelledby="title desc"><title id="title">Роли и безопасная проверка доступа — схема процесса</title><desc id="desc">Схема этапов, не снимок интерфейса. Владелец: все роли; Администратор: команда; Специалист: свой приём. Подробные действия описаны в статье.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a3446c" stroke-width="2"/></marker></defs><rect width="560" height="332" rx="20" fill="#fff7fa"/><g font-family="Arial, Segoe UI, sans-serif"><rect x="20" y="18" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="72" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Владелец: все роли</tspan></text><rect x="20" y="122" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="176" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Администратор: команда</tspan></text><rect x="20" y="226" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="280" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Специалист: свой приём</tspan></text></g></svg>
