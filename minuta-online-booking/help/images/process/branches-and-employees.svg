<svg xmlns="http://www.w3.org/2000/svg" width="560" height="436" viewBox="0 0 560 436" role="img" aria-labelledby="title desc"><title id="title">Как связать филиалы и сотрудников — схема процесса</title><desc id="desc">Схема этапов, не снимок интерфейса. Приглашение принято → Доступ открыт → Принимает клиентов → Услуга и часы готовы. Подробные действия описаны в статье.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a3446c" stroke-width="2"/></marker></defs><rect width="560" height="436" rx="20" fill="#fff7fa"/><g font-family="Arial, Segoe UI, sans-serif"><rect x="20" y="18" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="72" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Приглашение принято</tspan></text><path d="M280 112v4" stroke="#a3446c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="122" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="176" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Доступ открыт</tspan></text><path d="M280 216v4" stroke="#a3446c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="226" width="520" height="88" rx="16" fill="#ffffff" stroke="#ead5df" stroke-width="2"/><text x="280" y="280" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Принимает клиентов</tspan></text><path d="M280 320v4" stroke="#a3446c" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="330" width="520" height="88" rx="16" fill="#fce7ef" stroke="#ead5df" stroke-width="2"/><text x="280" y="384" text-anchor="middle" fill="#352b31" font-size="30" font-weight="600"><tspan x="280" dy="0">Услуга и часы готовы</tspan></text></g></svg>
