<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Установка Minuta</title><desc id="desc">Три карточки с шагами установки на компьютере, Android и iPhone.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f6f4"/><text x="78" y="88" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="750">Установите Minuta как приложение</text><text x="78" y="124" fill="#657269" font-family="Inter,Segoe UI,sans-serif" font-size="18">Выберите своё устройство</text>
  <g transform="translate(78 170)"><rect width="320" height="422" rx="24" fill="#fff" stroke="#dce5df" stroke-width="2"/><rect x="30" y="30" width="54" height="54" rx="16" fill="#e8f5ed"/><path d="M44 45h26v19H44zm6 24h14m-7-5v5" fill="none" stroke="#16794a" stroke-width="2.5"/><text x="104" y="65" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Компьютер</text><circle cx="50" cy="135" r="17" fill="#16794a"/><text x="50" y="141" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">1</text><text x="82" y="141" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Откройте «Приложение»</text><circle cx="50" cy="197" r="17" fill="#16794a"/><text x="50" y="203" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">2</text><text x="82" y="203" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Нажмите «Установить»</text><circle cx="50" cy="259" r="17" fill="#16794a"/><text x="50" y="265" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">3</text><text x="82" y="251" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Подтвердите окно</text><text x="82" y="274" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Chrome или Edge</text><rect x="30" y="338" width="260" height="54" rx="27" fill="#17211b"/><text x="160" y="372" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Установить приложение</text></g>
  <g transform="translate(440 170)"><rect width="320" height="422" rx="24" fill="#fff" stroke="#dce5df" stroke-width="2"/><rect x="30" y="30" width="54" height="54" rx="16" fill="#e8f5ed"/><rect x="48" y="39" width="19" height="36" rx="4" fill="none" stroke="#16794a" stroke-width="2.5"/><circle cx="57.5" cy="69" r="1.5" fill="#16794a"/><text x="104" y="65" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Android</text><circle cx="50" cy="135" r="17" fill="#16794a"/><text x="50" y="141" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">1</text><text x="82" y="141" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Откройте в Chrome</text><circle cx="50" cy="197" r="17" fill="#16794a"/><text x="50" y="203" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">2</text><text x="82" y="189" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Откройте меню</text><text x="82" y="212" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">браузера</text><circle cx="50" cy="259" r="17" fill="#16794a"/><text x="50" y="265" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">3</text><text x="82" y="251" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Выберите «Добавить</text><text x="82" y="274" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">на главный экран»</text><rect x="30" y="338" width="260" height="54" rx="27" fill="#e8f5ed"/><text x="160" y="372" text-anchor="middle" fill="#126c41" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Добавить</text></g>
  <g transform="translate(802 170)"><rect width="320" height="422" rx="24" fill="#fff" stroke="#dce5df" stroke-width="2"/><rect x="30" y="30" width="54" height="54" rx="16" fill="#e8f5ed"/><rect x="48" y="39" width="19" height="36" rx="4" fill="none" stroke="#16794a" stroke-width="2.5"/><path d="M57.5 57V43m-5 5 5-5 5 5M49 57v10h17V57" fill="none" stroke="#16794a" stroke-width="2"/><text x="104" y="65" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">iPhone / iPad</text><circle cx="50" cy="135" r="17" fill="#16794a"/><text x="50" y="141" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">1</text><text x="82" y="141" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Откройте в Safari</text><circle cx="50" cy="197" r="17" fill="#16794a"/><text x="50" y="203" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">2</text><text x="82" y="203" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Нажмите «Поделиться»</text><circle cx="50" cy="259" r="17" fill="#16794a"/><text x="50" y="265" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="750">3</text><text x="82" y="251" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Выберите «На экран</text><text x="82" y="274" fill="#17211b" font-family="Inter,Segoe UI,sans-serif" font-size="16">Домой»</text><rect x="30" y="338" width="260" height="54" rx="27" fill="#e8f5ed"/><text x="160" y="372" text-anchor="middle" fill="#126c41" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Добавить</text></g>
</svg>
