<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeTime Pro — образец сертификатов</title>
<link rel="stylesheet" href="/certificate-designer.css"><style>
  *{box-sizing:border-box}body{margin:0;background:#fff5f9;color:#2c2330;font:16px/1.5 system-ui,sans-serif;--primary-color:#a33c70;--border-color:#e8dce2;--muted-text-color:#756a72}main{max-width:1120px;margin:auto;padding:24px}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}header p{margin:0;color:#756a72}header h1{margin:0;font-size:24px;font-weight:600}section{background:#fff;padding:24px;border-radius:18px}@media(max-width:760px){main{padding:16px}section{padding:18px}}@media(max-width:390px){main{padding:10px}section{padding:14px}}
</style></head><body><main><header><h1>PrimeTime Pro</h1><p>Образец раздела «Сертификаты»</p></header><section id="certificateDesignerPanel"></section></main>
<script src="/certificate-renderer.js"></script><script src="/certificate-designer.js"></script>
<script>
(async function(){
  const databaseName = 'minuta-certificate-demo-' + (new URLSearchParams(location.search).get('store') || 'preview');
  const request=indexedDB.open(databaseName,1); request.onupgradeneeded=()=>request.result.createObjectStore('snapshot');
  const database=await new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
  function read(){return new Promise((resolve,reject)=>{const request=database.transaction('snapshot','readonly').objectStore('snapshot').get('state');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
  function write(value){return new Promise((resolve,reject)=>{const transaction=database.transaction('snapshot','readwrite');transaction.objectStore('snapshot').put(value,'state');transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)})}
  let initialImage='__CERTIFICATE_IMAGE__';
  if(initialImage.startsWith('__')){const canvas=document.createElement('canvas');canvas.width=700;canvas.height=990;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,700,990);ctx.strokeStyle='#ddd';ctx.strokeRect(10,10,680,970);initialImage=canvas.toDataURL('image/png')}
  const initialTemplate={id:'00000000-0000-4000-8000-000000000009',name:'Макет массажного сертификата',image_data:initialImage,layout:structuredClone(MinutaCertificateRenderer.fields),font_files:{}};
  let state=await read() || {templates:[initialTemplate],records:[]};
  const org='00000000-0000-4000-8000-000000000004';
  const services=[{id:'00000000-0000-4000-8000-000000000007',name:'Массаж спины+швз — углубленный',duration_minutes:60},{id:'00000000-0000-4000-8000-000000000008',name:'Массаж спины',duration_minutes:30},{id:'00000000-0000-4000-8000-000000000006',name:'Общий расслабляющий массаж',duration_minutes:60}];
  const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Samara'}).format(new Date());
  let writeQueue=Promise.resolve();
  function mutate(fn){const result=writeQueue.then(async()=>{const result=fn();await write(state);return result});writeQueue=result.catch(()=>{});return result}
  const repository={demo:true,
    workspace:async()=>({organization_id:org,current_role:'owner',today,templates:state.templates.map(t=>({id:t.id,name:t.name})),services}),
    template:async(_,id)=>({organization_id:org,template:state.templates.find(t=>t.id===id)}),
    saveTemplate:(_,value)=>mutate(()=>{state.templates.push(structuredClone(value));return {organization_id:org,id:value.id}}),
    issue:(_,value,request)=>mutate(()=>{
      const previous=state.records.find(r=>r.request_id===request);
      if(previous){if(JSON.stringify(previous.source)!==JSON.stringify(value))throw new Error('certificate_request_conflict');return {organization_id:org,record:previous}}
      if(state.records.some(r=>r.number===value.number))throw new Error('certificate_number_exists');
      const record={...structuredClone(value),id:crypto.randomUUID(),request_id:request,source:structuredClone(value)};state.records.unshift(record);return {organization_id:org,record};
    }),
    history:async(_,query,status,cursor)=>{
      const records=state.records.filter(r=>(r.number+' '+r.procedure).toLocaleLowerCase('ru-RU').includes(query.toLocaleLowerCase('ru-RU'))&&(status==='all'||MinutaCertificateRenderer.status(r,today,r.remind_days).code===status));
      const start=cursor||0;
      return {organization_id:org,today,records:records.slice(start,start+50),next_cursor:records.length>start+50?start+50:null,expiring_count:state.records.filter(r=>MinutaCertificateRenderer.status(r,today,r.remind_days).code==='expiring').length};
    }
  };
  const controller=MinutaCertificateDesigner.createController({root:document.getElementById('certificateDesignerPanel'),repository,defaultNumber:'267',defaultDate:'2026-10-03',getCurrentUser:()=>({id:'demo'}),requireWrites:()=>true});
  controller.bind();
  await controller.setOrganization({id:org});
  // Test-only hooks belong to this fixture, never to the product controller.
  window.certificateFixture={controller,repository,getState:()=>structuredClone(state)};
})();
</script></body></html>
